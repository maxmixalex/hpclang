name: E2E / HP48gII stock launch

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "tests/hp39-visible-smoke.c"
      - "tests/hp39-runtime-diag.c"
      - "tests/x50ng/stock-launcher-main.c"
      - "tests/x50ng/headless-ui-init.h"
      - "tests/e2e/sequences/hp48gii-stock-run.seq"
      - "tools/probe-atfe.sh"
      - "tools/prepare-x50ng.py"
      - "tools/prepare-hp48gii-nor.py"
      - "tools/fetch-x50ng.sh"
      - "tools/run-hp48-kermit-send.sh"
      - "tools/armtoolbox-wrap.py"
      - "tools/pgm-to-png.py"
      - "tools/pgm-to-summary.py"
      - "tools/publish-ci-image.sh"
      - ".github/actions/setup-atfe/**"
      - ".github/workflows/e2e-hp48-stock.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stock-launcher:
    name: hp48gii
    runs-on: home-docker
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Arm Toolchain for Embedded
        uses: ./.github/actions/setup-atfe

      - name: Build HP48gII HPC1 payload
        run: |
          export OUT="$GITHUB_WORKSPACE/build/hp48-payload"
          chmod +x tools/probe-atfe.sh tools/armtoolbox-wrap.py
          HPCLANG_E2E_WAIT_FOR_ENTER=1 tools/probe-atfe.sh
          $ATFE/bin/clang --target=arm-none-eabi -march=armv4t -marm \
            -DHPCLANG_STAGE0_MODEL=4 -c platform/armtoolbox/stage0.S \
            -o build/hp48-payload/stage0-hp48gii.o
          $ATFE/bin/ld.lld -m armelf -T platform/armtoolbox/stage0.ld \
            build/hp48-payload/stage0-hp48gii.o \
            build/hp48-payload/stage0-bundle.o \
            -o build/hp48-payload/stage0-hp48gii.elf
          $ATFE/bin/llvm-objcopy -O binary \
            build/hp48-payload/stage0-hp48gii.elf \
            build/hp48-payload/stage0-hp48gii.bin
          python3 tools/armtoolbox-wrap.py \
            build/hp48-payload/stage0-hp48gii.bin \
            build/hp48-payload/HPCLANG.HP

      - name: Ensure runtime dependencies
        run: |
          packages=(ckermit socat innoextract libglib2.0-0t64 libgtk-4-1 libncurses6 liblua5.4-0 git-lfs)
          missing=()
          for package in "${packages[@]}"; do
            dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'ok installed' || missing+=("$package")
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Restore HP48 stock x50ng cache
        id: x50ng-cache
        uses: actions/cache/restore@v6
        with:
          path: build/x50ng/dist
          key: hpclang-x50ng-hp48-stock-uart-${{ runner.os }}-${{ runner.arch }}-003533d9-${{ hashFiles('tools/prepare-x50ng.py', 'tools/fetch-x50ng.sh', 'tests/x50ng/stock-launcher-main.c', 'tests/x50ng/headless-ui-init.h') }}

      - name: Install x50ng build dependencies
        if: steps.x50ng-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libglib2.0-dev libgtk-4-dev libncurses-dev liblua5.4-dev

      - name: Fetch and adapt pinned x50ng
        if: steps.x50ng-cache.outputs.cache-hit != 'true'
        run: tools/fetch-x50ng.sh build/x50ng tests/x50ng/stock-launcher-main.c hp48gii host-uart0

      - name: Build x50ng
        if: steps.x50ng-cache.outputs.cache-hit != 'true'
        working-directory: build/x50ng
        run: make -j2 WITH_SDL=no WITH_SDL2=no LUA_VERSION=lua5.4

      - name: Save HP48 stock x50ng cache
        if: steps.x50ng-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/x50ng/dist
          key: ${{ steps.x50ng-cache.outputs.cache-primary-key }}

      - name: Prepare verified HP48gII full NOR
        run: |
          curl -fL --retry 3 https://blog.lyc8503.net/en/post/hp39gs-modify/48gii.bin -o build/hp48gii-nor.bin
          printf '%s  %s\n' 4899102743d3420dc517ae1b489fe2405229be616dbdb1b9f00cc1d0aeae1937 build/hp48gii-nor.bin | sha256sum -c -
          python3 tools/prepare-hp48gii-nor.py build/hp48gii-nor.bin build/hp48-state

      - name: Prepare stock transfer objects
        run: |
          chmod +x tools/bootstrap-hp39-aplet.sh tools/run-hp48-kermit-send.sh
          tools/bootstrap-hp39-aplet.sh >/dev/null
          mkdir -p build/hp48-send
          cp .cache/hp39-aplet/raw/app/ARMToolbox/L275_48.LIB build/hp48-send/L275_48
          cp build/hp48-payload/HPCLANG.HP build/hp48-send/HPCLANG.HP
          test "$(stat -c %s build/hp48-send/L275_48)" = 2404
          sha256sum build/hp48-send/L275_48
          sha256sum build/hp48-send/HPCLANG.HP

      - name: Execute full HP48gII stock launch
        run: |
          set -euo pipefail
          X50_TTY="$RUNNER_TEMP/hp48-x50ng-uart"
          KERMIT_TTY="$RUNNER_TEMP/hp48-kermit-uart"

          socat -d -d -x -v \
            PTY,raw,echo=0,link="$X50_TTY" \
            PTY,raw,echo=0,link="$KERMIT_TTY" \
            2> build/hp48-socat.log &
          SOCAT_PID=$!

          cleanup() {
            kill "${X50_PID:-}" "$SOCAT_PID" 2>/dev/null || true
            wait "${X50_PID:-}" 2>/dev/null || true
            wait "$SOCAT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 50); do
            [[ -e "$X50_TTY" && -e "$KERMIT_TTY" ]] && break
            sleep 0.1
          done
          [[ -e "$X50_TTY" && -e "$KERMIT_TTY" ]]

          export HPCLANG_X50NG_UART0="$X50_TTY"
          export HPCLANG_X50NG_LCD_HEIGHT=64
          export HPCLANG_STOCK_MODE=run
          export HPCLANG_E2E_SEQUENCE="$GITHUB_WORKSPACE/tests/e2e/sequences/hp48gii-stock-run.seq"
          export HPCLANG_STOCK_PREFIX="$GITHUB_WORKSPACE/build/hp48"
          export HPCLANG_STOCK_JSON="$GITHUB_WORKSPACE/build/hp48.json"
          export HPCLANG_STOCK_RESULT_ADDR="$(cat "$GITHUB_WORKSPACE/build/hp48-payload/hp39-visible.result-address")"

          timeout 200s build/x50ng/dist/x50ng \
            --datadir="$GITHUB_WORKSPACE/build/hp48-state" \
            --overwrite-config \
            --style="$GITHUB_WORKSPACE/build/x50ng/dist/style-40g.css" &
          X50_PID=$!

          sleep 31
          timeout 70s tools/run-hp48-kermit-send.sh \
            "$KERMIT_TTY" build/hp48-send build/hp48-kermit-debug.log L275_48=L275 HPCLANG.HP=HPCLANG \
            > build/hp48-kermit.out 2>&1

          wait "$X50_PID"
          X50_PID=

          for pgm in build/hp48-*.pgm; do
            [ -f "$pgm" ] || continue
            python3 tools/pgm-to-png.py "$pgm" "$pgm.png"
          done
          cat build/hp48.json

      - name: Generate LCD summary image
        if: always()
        run: |
          python3 tools/pgm-to-summary.py \
            --image-only \
            --image-out build/hp48-summary.png \
            build/hp48-home-rpn.pgm \
            build/hp48-server-serial.pgm \
            build/hp48-after-transfer.pgm \
            build/hp48-vars-before-install.pgm \
            build/hp48-l275-stack.pgm \
            build/hp48-stored.pgm \
            build/hp48-after-warmstart.pgm \
            build/hp48-hpclang-stack.pgm \
            build/hp48-lib-menu.pgm \
            build/hp48-armtoolbox.pgm \
            build/hp48-pass.pgm \
            build/hp48-failure.pgm

      - name: Publish LCD summary image
        if: always() && github.event_name != 'pull_request'
        run: |
          chmod +x tools/publish-ci-image.sh
          tools/publish-ci-image.sh \
            build/hp48-summary.png \
            "full-hp48gii-launch/$GITHUB_RUN_ID/hp48gii.png"

      - name: Add LCD evidence to job summary
        if: always()
        run: |
          IMAGE_URL=""
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            IMAGE_URL="https://github.com/$GITHUB_REPOSITORY/blob/ci-evidence/full-hp48gii-launch/$GITHUB_RUN_ID/hp48gii.png?raw=1"
          fi
          python3 tools/pgm-to-summary.py \
            --heading "HP48gII full original-system launch" \
            --image-url "$IMAGE_URL" \
            --json build/hp48.json \
            build/hp48-home-rpn.pgm \
            build/hp48-server-serial.pgm \
            build/hp48-after-transfer.pgm \
            build/hp48-vars-before-install.pgm \
            build/hp48-l275-stack.pgm \
            build/hp48-stored.pgm \
            build/hp48-after-warmstart.pgm \
            build/hp48-hpclang-stack.pgm \
            build/hp48-lib-menu.pgm \
            build/hp48-armtoolbox.pgm \
            build/hp48-pass.pgm \
            build/hp48-failure.pgm \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HP48gII full-launch evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hp48gii-full-launch-evidence
          retention-days: 14
          path: |
            build/hp48-*.pgm
            build/hp48-*.pgm.png
            build/hp48.json
            build/hp48-kermit*
            build/hp48-socat.log
            build/hp48-payload/HPCLANG.HP
            build/hp48-payload/hp39-visible.result-address
          if-no-files-found: warn
