name: E2E / Direct runtime

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "tests/hp39-visible-smoke.c"
      - "tests/hp39-runtime-diag.c"
      - "tests/m7-cxx-probe.cpp"
      - "tests/x50ng/e2e-main.c"
      - "tests/x50ng/headless-ui-init.h"
      - "tools/probe-atfe.sh"
      - "tools/pgm-to-png.py"
      - "tools/pgm-to-summary.py"
      - "tools/publish-ci-image.sh"
      - "tools/e2e-target-env.py"
      - "tools/prepare-x50ng.py"
      - "tools/prepare-hp48gii-nor.py"
      - "tools/fetch-x50ng.sh"
      - ".github/actions/setup-atfe/**"
      - "tests/e2e/targets/**"
      - ".github/workflows/e2e-canonical.yml"
  pull_request:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "tests/hp39-visible-smoke.c"
      - "tests/hp39-runtime-diag.c"
      - "tests/x50ng/e2e-main.c"
      - "tests/x50ng/headless-ui-init.h"
      - "tools/probe-atfe.sh"
      - "tools/pgm-to-png.py"
      - "tools/pgm-to-summary.py"
      - "tools/publish-ci-image.sh"
      - "tools/e2e-target-env.py"
      - "tools/prepare-x50ng.py"
      - "tools/fetch-x50ng.sh"
      - ".github/actions/setup-atfe/**"
      - "tests/e2e/targets/**"
      - ".github/workflows/e2e-canonical.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    name: ${{ matrix.target }}
    runs-on: home-docker
    timeout-minutes: 25
    env:
      X50NG_BUILD_VARIANT: ${{ matrix.target == 'hp48gii' && 'hp48' || ((matrix.target == 'hp49gplus' || matrix.target == 'hp50g') && 'hp4950' || 'hp39') }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [hp39gs, hp40gs, hp48gii, hp49gplus, hp50g]

    steps:
      - uses: actions/checkout@v7

      - name: Load target profile
        run: python3 tools/e2e-target-env.py "tests/e2e/targets/${{ matrix.target }}.json" >> "$GITHUB_ENV"

      - name: Setup Arm Toolchain for Embedded
        uses: ./.github/actions/setup-atfe

      - name: Build canonical HPC1 and ${{ matrix.target }} stage0
        run: |
          export OUT="$GITHUB_WORKSPACE/build/canonical"
          chmod +x tools/probe-atfe.sh
          HPCLANG_E2E_KEYBOARD=1 tools/probe-atfe.sh

          $ATFE/bin/clang --target=arm-none-eabi -march=armv4t -marm \
            -DHPCLANG_STAGE0_MODEL="$HPCLANG_E2E_MODEL" \
            -c platform/armtoolbox/stage0.S \
            -o build/canonical/stage0.o
          $ATFE/bin/ld.lld -m armelf -T platform/armtoolbox/stage0.ld \
            build/canonical/stage0.o build/canonical/stage0-bundle.o \
            -o build/canonical/stage0.elf
          $ATFE/bin/llvm-objcopy -O binary \
            build/canonical/stage0.elf build/canonical/stage0.bin

      - name: Restore x50ng build cache
        id: x50ng-cache
        uses: actions/cache/restore@v6
        with:
          path: build/x50ng/dist
          key: hpclang-x50ng-canonical-${{ env.X50NG_BUILD_VARIANT }}-${{ runner.os }}-${{ runner.arch }}-003533d9-dist-v1-${{ hashFiles('tools/prepare-x50ng.py', 'tools/fetch-x50ng.sh', 'tests/x50ng/e2e-main.c', 'tests/x50ng/headless-ui-init.h') }}
      - name: Ensure x50ng runtime dependencies
        run: |
          packages=(libglib2.0-0t64 libgtk-4-1 libncurses6 liblua5.4-0 git-lfs)
          missing=()
          for package in "${packages[@]}"; do
            dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'ok installed' \
              || missing+=("$package")
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Install x50ng build dependencies
        if: steps.x50ng-cache.outputs.cache-hit != 'true'
        run: |
          packages=(libglib2.0-dev libgtk-4-dev libncurses-dev liblua5.4-dev)
          missing=()
          for package in "${packages[@]}"; do
            dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'ok installed' \
              || missing+=("$package")
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Fetch and adapt pinned x50ng
        if: steps.x50ng-cache.outputs.cache-hit != 'true'
        run: |
          tools/fetch-x50ng.sh build/x50ng tests/x50ng/e2e-main.c "$X50NG_BUILD_VARIANT" reserve-ram

      - name: Build x50ng
        if: steps.x50ng-cache.outputs.cache-hit != 'true'
        working-directory: build/x50ng
        run: make -j2 WITH_SDL=no WITH_SDL2=no LUA_VERSION=lua5.4

      - name: Save x50ng build cache
        if: steps.x50ng-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/x50ng/dist
          key: ${{ steps.x50ng-cache.outputs.cache-primary-key }}

      - name: Record x50ng source
        run: printf '%s\n' 003533d9eca3f6ded36c6ab80b8dbc0563e31d9a > build/x50ng-canonical-source.txt
      - name: Prepare target firmware
        env:
          HP48GII_NOR_SHA256: 4899102743d3420dc517ae1b489fe2405229be616dbdb1b9f00cc1d0aeae1937
        run: |
          find build/x50ng/dist/firmware -mindepth 1 -maxdepth 1 ! -name Makefile -exec rm -rf {} +
          if [ "$HPCLANG_E2E_FAMILY" = hp39 ]; then
            make -C build/x50ng/dist/firmware bootloaders
            curl -fL --retry 3 "https://www.hpcalc.org/hp39/pc/$HPCLANG_E2E_ARCHIVE" -o "/tmp/$HPCLANG_E2E_ARCHIVE"
            unzip -p "/tmp/$HPCLANG_E2E_ARCHIVE" "$HPCLANG_E2E_MEMBER" > build/target-firmware.bin
          elif [ "$HPCLANG_E2E_FAMILY" = hp48 ]; then
            curl -fL --retry 3 https://blog.lyc8503.net/en/post/hp39gs-modify/48gii.bin -o build/hp48gii-nor.bin
            printf "%s  %s\n" "$HP48GII_NOR_SHA256" build/hp48gii-nor.bin | sha256sum -c -
            python3 tools/prepare-hp48gii-nor.py build/hp48gii-nor.bin "build/$HPCLANG_E2E_TARGET-state"
          else
            make -C build/x50ng/dist/firmware bootloaders official
          fi

      - name: Execute canonical HPC1
        env:
          TARGET: ${{ matrix.target }}
        run: |
          export HPCLANG_X50NG_STAGE0="$GITHUB_WORKSPACE/build/canonical/stage0.bin"
          export HPCLANG_X50NG_RESULT_ADDR="$(cat "$GITHUB_WORKSPACE/build/canonical/hp39-visible.result-address")"
          export HPCLANG_X50NG_BEFORE_PGM="$GITHUB_WORKSPACE/build/$TARGET-before.pgm"
          export HPCLANG_X50NG_PASS_PGM="$GITHUB_WORKSPACE/build/$TARGET-pass.pgm"
          export HPCLANG_X50NG_RETURN_PGM="$GITHUB_WORKSPACE/build/$TARGET-return.pgm"
          export HPCLANG_X50NG_E2E_JSON="$GITHUB_WORKSPACE/build/$TARGET-e2e.json"
          export HPCLANG_X50NG_LCD_HEIGHT="$HPCLANG_E2E_LCD_HEIGHT"

          X50_ARGS=(
            --datadir="$GITHUB_WORKSPACE/build/$TARGET-state"
            --overwrite-config
          )
          if [ "$HPCLANG_E2E_FAMILY" = hp39 ]; then
            X50_ARGS+=(
              --style="$GITHUB_WORKSPACE/build/x50ng/dist/style-40g.css"
              --flash-full
              --bootloader="$GITHUB_WORKSPACE/build/x50ng/dist/firmware/boot-50g.bin"
              --firmware="$GITHUB_WORKSPACE/build/target-firmware.bin"
            )
          elif [ "$HPCLANG_E2E_FAMILY" = hp48 ]; then
            X50_ARGS+=(
              --style="$GITHUB_WORKSPACE/build/x50ng/dist/style-40g.css"
            )
          else
            X50_ARGS+=(
              --style="$GITHUB_WORKSPACE/build/x50ng/dist/style-50g.css"
              --flash
              --bootloader="$GITHUB_WORKSPACE/build/x50ng/dist/firmware/$HPCLANG_E2E_BOOTLOADER"
              --firmware="$GITHUB_WORKSPACE/build/x50ng/dist/firmware/hp4950v215/2MB_FIX/2MB_215f.bin"
            )
          fi

          mkdir -p "build/$TARGET-state"
          timeout 35s build/x50ng/dist/x50ng "${X50_ARGS[@]}"

          for pgm in build/$TARGET-*.pgm; do
            [ -f "$pgm" ] || continue
            python3 tools/pgm-to-png.py "$pgm" "$pgm.png"
          done
          cat "build/$TARGET-e2e.json"

      - name: Generate LCD summary image
        if: always()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 tools/pgm-to-summary.py \
            --image-only \
            --image-out "build/$TARGET-summary.png" \
            "build/$TARGET-before.pgm" \
            "build/$TARGET-pass.pgm" \
            "build/$TARGET-return.pgm"


      - name: Publish LCD summary image
        if: always() && github.event_name != 'pull_request'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod +x tools/publish-ci-image.sh
          tools/publish-ci-image.sh \
            "build/$TARGET-summary.png" \
            "direct-runtime/$GITHUB_RUN_ID/$TARGET.png"

      - name: Add LCD evidence to job summary
        if: always()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          IMAGE_URL=""
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            IMAGE_URL="https://github.com/$GITHUB_REPOSITORY/blob/ci-evidence/direct-runtime/$GITHUB_RUN_ID/$TARGET.png?raw=1"
          fi
          python3 tools/pgm-to-summary.py \
            --heading "$TARGET direct hpclang runtime" \
            --image-url "$IMAGE_URL" \
            --json "build/$TARGET-e2e.json" \
            "build/$TARGET-before.pgm" \
            "build/$TARGET-pass.pgm" \
            "build/$TARGET-return.pgm" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ${{ matrix.target }} direct-runtime E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-direct-runtime-e2e
          retention-days: 14
          path: |
            build/${{ matrix.target }}-*.pgm
            build/${{ matrix.target }}-*.pgm.png
            build/${{ matrix.target }}-e2e.json
            build/x50ng-canonical-source.txt
            build/canonical/stage0.bin
            build/canonical/hp39-visible.hpc
          if-no-files-found: warn
