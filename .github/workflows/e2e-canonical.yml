name: E2E / Canonical

on:
  workflow_dispatch:
  push:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "tests/hp39-visible-smoke.c"
      - "tests/hp39-runtime-diag.c"
      - "tests/x50ng/e2e-main.c"
      - "tests/x50ng/headless-ui-init.h"
      - "tools/probe-atfe.sh"
      - "tools/pgm-to-png.py"
      - "tools/pgm-to-summary.py"
      - "tools/e2e-target-env.py"
      - "tests/e2e/targets/**"
      - ".github/workflows/e2e-canonical.yml"
  pull_request:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "tests/hp39-visible-smoke.c"
      - "tests/hp39-runtime-diag.c"
      - "tests/x50ng/e2e-main.c"
      - "tests/x50ng/headless-ui-init.h"
      - "tools/probe-atfe.sh"
      - "tools/pgm-to-png.py"
      - "tools/pgm-to-summary.py"
      - ".github/workflows/e2e-canonical.yml"

jobs:
  canonical:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [hp39gs, hp40gs, hp50g]

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential git pkg-config unzip curl xz-utils \
            libglib2.0-dev libgtk-4-dev libncurses-dev liblua5.4-dev

      - name: Load target profile
        run: python3 tools/e2e-target-env.py "tests/e2e/targets/${{ matrix.target }}.json" >> "$GITHUB_ENV"

      - name: Install Arm Toolchain for Embedded 22.1.0
        run: |
          curl -L https://github.com/arm/arm-toolchain/releases/download/release-22.1.0-ATfE/ATfE-22.1.0-Linux-x86_64.tar.xz -o /tmp/atfe.tar.xz
          mkdir -p /tmp/atfe
          tar -xJf /tmp/atfe.tar.xz -C /tmp/atfe --strip-components=1

      - name: Build canonical HPC1 and ${{ matrix.target }} stage0
        env:
          MODEL: ${{ env.HPCLANG_E2E_MODEL }}
        run: |
          export ATFE=/tmp/atfe
          export OUT="$GITHUB_WORKSPACE/build/canonical"
          chmod +x tools/probe-atfe.sh
          tools/probe-atfe.sh

          /tmp/atfe/bin/clang --target=arm-none-eabi -march=armv4t -marm \
            -DHPCLANG_STAGE0_MODEL="$MODEL" \
            -c platform/armtoolbox/stage0.S \
            -o build/canonical/stage0.o
          /tmp/atfe/bin/ld.lld -m armelf -T platform/armtoolbox/stage0.ld \
            build/canonical/stage0.o build/canonical/stage0-bundle.o \
            -o build/canonical/stage0.elf
          /tmp/atfe/bin/llvm-objcopy -O binary \
            build/canonical/stage0.elf build/canonical/stage0.bin

      - name: Fetch and adapt pinned x50ng
        env:
          FAMILY: ${{ env.HPCLANG_E2E_FAMILY }}
        run: |
          git clone --no-checkout https://codeberg.org/gwh/x50ng.git build/x50ng
          git -C build/x50ng checkout 003533d9eca3f6ded36c6ab80b8dbc0563e31d9a
          git -C build/x50ng submodule update --init --recursive
          git -C build/x50ng rev-parse HEAD > build/x50ng-canonical-source.txt
          cp tests/x50ng/e2e-main.c build/x50ng/src/main.c
          cp tests/x50ng/headless-ui-init.h build/x50ng/src/

          python3 - <<'PY'
          from pathlib import Path
          import os

          if os.environ["FAMILY"] == "little-apple":
              flash = Path("build/x50ng/src/flash.c")
              s = flash.read_text()
              old = 'memcmp( phys_ram_base + flash->offset + BOOT_SIZE, "KINPOUPDATEIMAGE", 16 ) != 0'
              new = '''memcmp( phys_ram_base + flash->offset + BOOT_SIZE, "KINPOUPDATEIMAGE", 16 ) != 0 &&
                             memcmp( phys_ram_base + flash->offset + BOOT_SIZE, "KINPOHP39G+IMAGE", 16 ) != 0 &&
                             memcmp( phys_ram_base + flash->offset + BOOT_SIZE, "KINPOHP40G+IMAGE", 16 ) != 0'''
              if old not in s:
                  raise SystemExit("x50ng firmware-header check changed")
              flash.write_text(s.replace(old, new, 1))

          module = Path("build/x50ng/src/module.c")
          s = module.read_text()
          needle = "    phys_ram_base = mmap( 0, phys_ram_size, PROT_NONE,"
          if needle not in s:
              raise SystemExit("x50ng init_modules layout changed")
          module.write_text(s.replace(
              needle,
              "    /* hpclang canonical E2E reserved RAM. */\n"
              "    phys_ram_size += 0x00100000;\n\n" + needle,
              1))
          PY

      - name: Build x50ng
        working-directory: build/x50ng
        run: make -j2 WITH_SDL=no WITH_SDL2=no LUA_VERSION=lua5.4

      - name: Fetch official firmware
        env:
          FAMILY: ${{ env.HPCLANG_E2E_FAMILY }}
          ARCHIVE: ${{ env.HPCLANG_E2E_ARCHIVE }}
          MEMBER: ${{ env.HPCLANG_E2E_MEMBER }}
        run: |
          if [ "$FAMILY" = little-apple ]; then
            make -C build/x50ng/dist/firmware bootloaders
            curl -L "https://www.hpcalc.org/hp39/pc/$ARCHIVE" -o "/tmp/$ARCHIVE"
            unzip -p "/tmp/$ARCHIVE" "$MEMBER" > build/target-firmware.bin
          else
            make -C build/x50ng/dist/firmware bootloaders official
          fi

      - name: Execute canonical HPC1
        env:
          TARGET: ${{ matrix.target }}
          FAMILY: ${{ env.HPCLANG_E2E_FAMILY }}
        run: |
          export HPCLANG_X50NG_STAGE0="$GITHUB_WORKSPACE/build/canonical/stage0.bin"
          export HPCLANG_X50NG_RESULT_ADDR="$(cat "$GITHUB_WORKSPACE/build/canonical/hp39-visible.result-address")"
          export HPCLANG_X50NG_BEFORE_PGM="$GITHUB_WORKSPACE/build/$TARGET-before.pgm"
          export HPCLANG_X50NG_PASS_PGM="$GITHUB_WORKSPACE/build/$TARGET-pass.pgm"
          export HPCLANG_X50NG_RETURN_PGM="$GITHUB_WORKSPACE/build/$TARGET-return.pgm"
          export HPCLANG_X50NG_E2E_JSON="$GITHUB_WORKSPACE/build/$TARGET-e2e.json"

          if [ "$FAMILY" = little-apple ]; then
            STYLE="$GITHUB_WORKSPACE/build/x50ng/dist/style-40g.css"
            FLASH_ARG=--flash-full
            FIRMWARE="$GITHUB_WORKSPACE/build/target-firmware.bin"
          else
            STYLE="$GITHUB_WORKSPACE/build/x50ng/dist/style-50g.css"
            FLASH_ARG=--flash
            FIRMWARE="$GITHUB_WORKSPACE/build/x50ng/dist/firmware/hp4950v215/2MB_FIX/2MB_215f.bin"
          fi

          mkdir -p "build/$TARGET-state"
          timeout 35s build/x50ng/dist/x50ng \
            --datadir="$GITHUB_WORKSPACE/build/$TARGET-state" \
            --overwrite-config \
            --style="$STYLE" \
            "$FLASH_ARG" \
            --bootloader="$GITHUB_WORKSPACE/build/x50ng/dist/firmware/boot-50g.bin" \
            --firmware="$FIRMWARE"

          for pgm in build/$TARGET-*.pgm; do
            [ -f "$pgm" ] || continue
            python tools/pgm-to-png.py "$pgm" "$pgm.png"
          done
          cat "build/$TARGET-e2e.json"

      - name: Add LCD evidence to job summary
        if: always()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python tools/pgm-to-summary.py \
            --heading "$TARGET canonical ARM E2E" \
            --json "build/$TARGET-e2e.json" \
            "build/$TARGET-before.pgm" \
            "build/$TARGET-pass.pgm" \
            "build/$TARGET-return.pgm" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ${{ matrix.target }} canonical E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-canonical-arm-e2e
          path: |
            build/${{ matrix.target }}-*.pgm
            build/${{ matrix.target }}-*.pgm.png
            build/${{ matrix.target }}-e2e.json
            build/x50ng-canonical-source.txt
            build/canonical/stage0.bin
            build/canonical/hp39-visible.hpc
          if-no-files-found: warn
