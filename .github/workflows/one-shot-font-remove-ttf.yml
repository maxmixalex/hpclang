name: Maintenance / One-shot bitmap-only font curation

on:
  push:
    branches:
      - m7-fonts-gallery
    paths:
      - ".github/workflows/one-shot-font-remove-ttf.yml"

permissions:
  contents: write

jobs:
  curate:
    runs-on: home-docker
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Replace canonical TTF assets with native bitmap sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import urllib.request
          import zipfile

          archive = Path('runtime/fonts/fonts.zip')
          temp = archive.with_suffix('.zip.tmp')

          expected_prefixes = (
              'fonts/boutique-bitmap-7x7/',
              'fonts/boutique-bitmap-9x9/',
              'fonts/cozette/',
              'fonts/galmuri/',
              'fonts/hasankazan/',
              'fonts/japanyoshi/',
              'fonts/pixeldroid/',
          )

          with zipfile.ZipFile(archive, 'r') as zin:
              infos = zin.infolist()
              ttf_infos = [
                  info for info in infos
                  if not info.is_dir() and info.filename.lower().endswith('.ttf')
              ]
              assert len(ttf_infos) == 35, [info.filename for info in ttf_infos]
              unexpected = [
                  info.filename for info in ttf_infos
                  if not info.filename.startswith(expected_prefixes)
              ]
              assert not unexpected, unexpected

              names = {info.filename for info in infos}
              bold_name = 'fonts/galmuri/Galmuri11-Bold.bdf'
              condensed_name = 'fonts/galmuri/Galmuri11-Condensed.bdf'
              assert bold_name not in names and condensed_name not in names

              # 2.40.3 is the current published npm/unpkg distribution with these BDFs.
              sources = {
                  bold_name: 'https://unpkg.com/galmuri@2.40.3/dist/Galmuri11-Bold.bdf',
                  condensed_name: 'https://unpkg.com/galmuri@2.40.3/dist/Galmuri11-Condensed.bdf',
              }
              downloaded = {}
              for name, url in sources.items():
                  with urllib.request.urlopen(url, timeout=60) as response:
                      data = response.read()
                  assert data.startswith(b'STARTFONT '), (name, data[:32])
                  assert b'CHARS ' in data[:65536], name
                  downloaded[name] = data
                  print(f'{name}: {len(data)} bytes sha256={hashlib.sha256(data).hexdigest()}')

              with zipfile.ZipFile(temp, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zout:
                  for info in infos:
                      if info in ttf_infos:
                          continue
                      data = zin.read(info.filename)
                      zout.writestr(info, data)
                  for name, data in downloaded.items():
                      info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.external_attr = 0o100644 << 16
                      zout.writestr(info, data)

          os.replace(temp, archive)

          policy_path = Path('runtime/fonts/ttf-raster.json')
          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          assert policy.get('schema') == 'hpclang-ttf-raster-v1'
          assert len(policy.get('faces', {})) == 35
          policy['faces'] = {}
          policy_path.write_text(
              json.dumps(policy, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          with zipfile.ZipFile(archive, 'r') as check:
              font_names = [n for n in check.namelist() if n.startswith('fonts/') and not n.endswith('/')]
              assert not [n for n in font_names if n.lower().endswith('.ttf')]
              assert 'fonts/galmuri/Galmuri11-Bold.bdf' in font_names
              assert 'fonts/galmuri/Galmuri11-Condensed.bdf' in font_names
          print('PASS: canonical package now contains zero TTF assets; Galmuri Bold/Condensed use upstream BDF')
          PY

      - name: Regenerate and audit bitmap-only catalog
        run: |
          python3 -m venv build/font-bitmap-venv
          build/font-bitmap-venv/bin/pip install --disable-pip-version-check Pillow fonttools
          mkdir -p build/font-bitmap-audit
          build/font-bitmap-venv/bin/python tools/regenerate-font-assets.py \
            --package runtime/fonts/fonts.zip \
            --output-dir runtime/fonts/generated \
            --chunk-glyphs 512
          set -o pipefail
          build/font-bitmap-venv/bin/python tools/audit-font-assets.py \
            --package runtime/fonts/fonts.zip \
            --generated-dir runtime/fonts/generated \
            --json build/font-bitmap-audit/all-fonts.json \
            --html build/font-bitmap-audit/visual-report.html \
            | tee build/font-bitmap-audit/all-fonts.txt
          build/font-bitmap-venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('runtime/fonts/generated/catalog.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('build/font-bitmap-audit/all-fonts.json').read_text(encoding='utf-8'))
          faces = catalog['faces']
          assert len(faces) == 242, len(faces)
          assert not [face for face in faces if face.get('format') == 'ttf']
          galmuri = sorted(face['selector'] for face in faces if face.get('family') == 'galmuri')
          assert galmuri == ['galmuri/Galmuri11-Bold.bdf', 'galmuri/Galmuri11-Condensed.bdf'], galmuri
          assert audit['face_count'] == 242, audit['face_count']
          assert audit['generated_parity']['passed'] == 242, audit['generated_parity']
          assert audit['generated_parity']['failed'] == 0, audit['generated_parity']
          for key in ('quick_overflow', 'glyph_collapse', 'blank_heavy', 'powerline_variant'):
              assert audit['visual_summary'][key] == 0, (key, audit['visual_summary'][key])
          print('PASS: 242 bitmap-source faces; 242/242 parity; no overflow/collapse/blank-heavy/powerline')
          print('exact duplicate groups:', len(audit['exact_duplicate_groups']))
          print('ASCII-missing:', audit['visual_summary']['ascii_missing'])
          print('loose-spacing:', audit['visual_summary']['loose_spacing'])
          PY
          git diff --check

      - name: Upload bitmap-only audit
        uses: actions/upload-artifact@v7
        with:
          name: font-bitmap-only-audit
          retention-days: 14
          path: build/font-bitmap-audit/
          if-no-files-found: error

      - name: Commit curated canonical package
        run: |
          rm .github/workflows/one-shot-font-remove-ttf.yml
          rm -f .github/workflows/one-shot-ttf-raster-fix.yml
          git add -A runtime/fonts/fonts.zip runtime/fonts/ttf-raster.json runtime/fonts/generated \
            .github/workflows/one-shot-font-remove-ttf.yml .github/workflows/one-shot-ttf-raster-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fonts: prefer native bitmap sources over TTF assets"
          git fetch origin m7-fonts-gallery
          git rebase origin/m7-fonts-gallery
          git push origin HEAD:m7-fonts-gallery
