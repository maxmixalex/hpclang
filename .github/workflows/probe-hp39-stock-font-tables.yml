name: Probe HP39 Stock Font Tables

on:
  push:
    branches:
      - m7-fonts-gallery

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, home-docker]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: hp39gs
            archive: hp39gs222.zip
            member: HP39GS_2.22/hp39gs_v2.22.bin
          - target: hp40gs
            archive: hp40gs222.zip
            member: HP40GS_2.22/hp40gs_v2.22.bin
    steps:
      - uses: actions/checkout@v7
      - name: Download official firmware update
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://www.hpcalc.org/hp39/pc/${{ matrix.archive }}" -o firmware.zip
          unzip -p firmware.zip "${{ matrix.member }}" > firmware.bin
          ls -l firmware.bin
      - name: Probe legacy font-table signatures
        shell: bash
        run: python3 tools/probe-hp39-stock-font-tables.py firmware.bin
