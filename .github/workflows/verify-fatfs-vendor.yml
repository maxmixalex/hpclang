name: CI / FatFs vendor

on:
  workflow_dispatch:
  push:
    paths:
      - "third_party/fatfs/**"
      - "tools/verify-fatfs-vendor.sh"
      - ".github/workflows/verify-fatfs-vendor.yml"
      - "docs/development/licensing.md"

permissions:
  contents: read

jobs:
  verify:
    runs-on: home-docker
    steps:
      - uses: actions/checkout@v7

      - name: Verify FatFs baseline and declared patch
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/fatfs-official-verify
          set -o pipefail
          bash -x tools/verify-fatfs-vendor.sh build/fatfs-official-verify \
            2>&1 | tee build/fatfs-official-verify/run.log

      - name: Upload official verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fatfs-official-verification
          retention-days: 7
          if-no-files-found: error
          path: |
            build/fatfs-official-verify/run.log
            build/fatfs-official-verify/verification.txt
            build/fatfs-official-verify/download/**
            build/fatfs-official-verify/canonical/**
            build/fatfs-official-verify/vendor-normalized/**
            build/fatfs-official-verify/diff/**
            build/fatfs-official-verify/unpacked/source/ff.c
            build/fatfs-official-verify/unpacked/source/ff.h
            build/fatfs-official-verify/unpacked/source/diskio.h
            build/fatfs-official-verify/unicode/**

      - name: Enforce baseline and patch match
        if: always()
        run: test "${{ steps.verify.outcome }}" = success
