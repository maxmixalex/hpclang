name: E2E / HP39/40 stock launch

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "tests/e2e/**"
      - "tools/build-e2e.sh"
      - "include/hpclang/**"
      - "tools/prepare-x50ng.py"
      - "tools/fetch-x50ng.sh"
      - "tools/run-hp39-kermit-server.sh"
      - "tools/hp39-fixture-key.py"
      - "tools/package-hp39-aplet.sh"
      - "tools/armtoolbox-wrap.py"
      - "tools/e2e-target-env.py"
      - "tools/pgm-to-png.py"
      - "tools/pgm-to-summary.py"
      - "tools/publish-ci-image.sh"
      - "platform/armtoolbox/**"
      - "tests/e2e/targets/hp39gs.json"
      - "tests/e2e/targets/hp40gs.json"
      - ".github/actions/setup-atfe/**"
      - "tests/e2e/sequences/hp39-serial-fixture-probe.seq"
      - "tests/e2e/sequences/hp40-serial-fixture-probe.seq"
      - ".github/workflows/e2e-hp39-stock.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stock-launch:
    name: ${{ matrix.target }}
    runs-on: home-docker
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [hp39gs, hp40gs]
    env:
      TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v7

      - name: Load target profile
        run: python3 tools/e2e-target-env.py "tests/e2e/targets/$TARGET.json" >> "$GITHUB_ENV"

      - name: Install fixture and x50ng runtime dependencies
        run: |
          packages=(
            ckermit socat innoextract git-lfs
            libglib2.0-0t64 libgtk-4-1 libncurses6 liblua5.4-0
          )
          missing=()
          for package in "${packages[@]}"; do
            dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'ok installed' \
              || missing+=("$package")
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Setup Arm Toolchain for Embedded
        uses: ./.github/actions/setup-atfe

      - name: Build current ${{ matrix.target }} transfer set
        run: |
          chmod +x \
            tools/build-e2e.sh \
            tools/bootstrap-hp39-aplet.sh \
            tools/package-hp39-aplet.sh \
            tools/run-hp39-kermit-server.sh
          OUT="$GITHUB_WORKSPACE/build/atfe-probe" tools/build-e2e.sh

          $ATFE/bin/clang \
            --target=arm-none-eabi -march=armv4t -marm \
            -mfpu=none -mfloat-abi=soft -mabi=aapcs \
            -fno-stack-protector -fno-unwind-tables \
            -fno-asynchronous-unwind-tables -fno-pic -fno-pie \
            -DHPCLANG_STAGE0_MODEL="$HPCLANG_E2E_MODEL" \
            -c platform/armtoolbox/stage0.S \
            -o "build/atfe-probe/stage0-$TARGET.o"

          $ATFE/bin/ld.lld -m armelf \
            -T platform/armtoolbox/stage0.ld \
            "build/atfe-probe/stage0-$TARGET.o" \
            build/atfe-probe/stage0-bundle.o \
            -o "build/atfe-probe/stage0-$TARGET.elf"

          $ATFE/bin/llvm-objcopy -O binary \
            "build/atfe-probe/stage0-$TARGET.elf" \
            "build/atfe-probe/stage0-$TARGET.bin"

          python3 tools/armtoolbox-wrap.py \
            "build/atfe-probe/stage0-$TARGET.bin" \
            "build/atfe-probe/$TARGET-hpc1.hp"

          tools/bootstrap-hp39-aplet.sh
          tools/package-hp39-aplet.sh \
            "build/atfe-probe/$TARGET-hpc1.hp" \
            "dist/$TARGET-stock-transfer" \
            "$TARGET"

      - name: Restore x50ng serial build cache
        id: x50ng-cache
        uses: actions/cache/restore@v6
        with:
          path: build/x50ng/dist
          key: hpclang-x50ng-hp39-stock-uart-${{ runner.os }}-${{ runner.arch }}-003533d9-${{ hashFiles('tools/prepare-x50ng.py', 'tools/fetch-x50ng.sh', 'tests/e2e/harness/x50ng/stock-launcher-main.c', 'tests/e2e/harness/x50ng/headless-ui-init.h') }}

      - name: Install x50ng build dependencies
        if: steps.x50ng-cache.outputs.cache-hit != 'true'
        run: |
          packages=(libglib2.0-dev libgtk-4-dev libncurses-dev liblua5.4-dev)
          missing=()
          for package in "${packages[@]}"; do
            dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'ok installed' \
              || missing+=("$package")
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Fetch and adapt pinned x50ng
        if: steps.x50ng-cache.outputs.cache-hit != 'true'
        run: |
          tools/fetch-x50ng.sh \
            build/x50ng \
            tests/e2e/harness/x50ng/stock-launcher-main.c \
            hp39 \
            host-uart0

      - name: Build x50ng
        if: steps.x50ng-cache.outputs.cache-hit != 'true'
        working-directory: build/x50ng
        run: make -j2 WITH_SDL=no WITH_SDL2=no LUA_VERSION=lua5.4

      - name: Save x50ng serial build cache
        if: steps.x50ng-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/x50ng/dist
          key: ${{ steps.x50ng-cache.outputs.cache-primary-key }}

      - name: Fetch official ${{ matrix.target }} firmware
        run: |
          make -C build/x50ng/dist/firmware bootloaders
          curl -fL --retry 3 \
            "https://www.hpcalc.org/hp39/pc/$HPCLANG_E2E_ARCHIVE" \
            -o "/tmp/$HPCLANG_E2E_ARCHIVE"
          unzip -p "/tmp/$HPCLANG_E2E_ARCHIVE" \
            "$HPCLANG_E2E_MEMBER" \
            > "build/$TARGET-2.22.bin"

      - name: Compute fixture content key
        run: |
          python3 tools/hp39-fixture-key.py \
            "$TARGET" \
            "build/$TARGET-2.22.bin" \
            "dist/$TARGET-stock-transfer" \
            | tee "build/$TARGET-fixture-key.txt"

      - name: Execute ${{ matrix.target }} through stock serial disk
        run: |
          set -euo pipefail
          X50_TTY="$RUNNER_TEMP/$TARGET-x50ng-uart"
          KERMIT_TTY="$RUNNER_TEMP/$TARGET-kermit-uart"

          socat -d -d -x -v \
            PTY,raw,echo=0,link="$X50_TTY" \
            PTY,raw,echo=0,link="$KERMIT_TTY" \
            2> "build/$TARGET-socat.log" &
          SOCAT_PID=$!

          cleanup() {
            kill "${KERMIT_PID:-}" "$SOCAT_PID" 2>/dev/null || true
            wait "${KERMIT_PID:-}" 2>/dev/null || true
            wait "$SOCAT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 50); do
            [[ -e "$X50_TTY" && -e "$KERMIT_TTY" ]] && break
            sleep 0.1
          done
          [[ -e "$X50_TTY" && -e "$KERMIT_TTY" ]]

          tools/run-hp39-kermit-server.sh \
            "$KERMIT_TTY" \
            "dist/$TARGET-stock-transfer" \
            "$GITHUB_WORKSPACE/build/$TARGET-kermit-debug.log" \
            > "build/$TARGET-kermit.out" 2>&1 &
          KERMIT_PID=$!

          export HPCLANG_X50NG_UART0="$X50_TTY"
          export HPCLANG_X50NG_LCD_HEIGHT="$HPCLANG_E2E_LCD_HEIGHT"
          export HPCLANG_STOCK_MODE=run
          export HPCLANG_STOCK_RESULT_ADDR="$(cat "$GITHUB_WORKSPACE/build/atfe-probe/e2e.result-address")"
          if [ "$TARGET" = hp40gs ]; then
            SEQUENCE=tests/e2e/sequences/hp40-serial-fixture-probe.seq
          else
            SEQUENCE=tests/e2e/sequences/hp39-serial-fixture-probe.seq
          fi
          export HPCLANG_E2E_SEQUENCE="$GITHUB_WORKSPACE/$SEQUENCE"
          export HPCLANG_STOCK_PREFIX="$GITHUB_WORKSPACE/build/$TARGET-stock"
          export HPCLANG_STOCK_JSON="$GITHUB_WORKSPACE/build/$TARGET-stock.json"

          mkdir -p "build/$TARGET-state"
          timeout 255s build/x50ng/dist/x50ng \
            --datadir="$GITHUB_WORKSPACE/build/$TARGET-state" \
            --overwrite-config \
            --style="$GITHUB_WORKSPACE/build/x50ng/dist/style-40g.css" \
            --flash-full \
            --bootloader="$GITHUB_WORKSPACE/build/x50ng/dist/firmware/boot-50g.bin" \
            --firmware="$GITHUB_WORKSPACE/build/$TARGET-2.22.bin"

          kill "$KERMIT_PID" 2>/dev/null || true
          wait "$KERMIT_PID" 2>/dev/null || true
          KERMIT_PID=

          cat "build/$TARGET-stock.json"
          grep -F 'sgetinit[HP39DIR.CUR]=0' "build/$TARGET-kermit-debug.log"
          grep -F 'sgetinit[HP39DIR.000]=0' "build/$TARGET-kermit-debug.log"
          grep -F 'sgetinit[HPGCC000.000]=0' "build/$TARGET-kermit-debug.log"
          grep -F 'sgetinit[LIB275L.000]=0' "build/$TARGET-kermit-debug.log"

      - name: Render stock-launch captures
        if: always()
        run: |
          for pgm in build/$TARGET-stock-*.pgm; do
            [[ -f "$pgm" ]] || continue
            python3 tools/pgm-to-png.py "$pgm" "$pgm.png"
          done

      - name: Generate LCD summary image
        if: always()
        run: |
          python3 tools/pgm-to-summary.py \
            --image-only \
            --image-out "build/$TARGET-stock-summary.png" \
            "build/$TARGET-stock-aplet-library.pgm" \
            "build/$TARGET-stock-receive-menu.pgm" \
            "build/$TARGET-stock-receive-serial-disk.pgm" \
            "build/$TARGET-stock-remote-aplet.pgm" \
            "build/$TARGET-stock-lazy-fetch.pgm" \
            "build/$TARGET-stock-pass.pgm" \
            "build/$TARGET-stock-failure.pgm"

      - name: Publish LCD summary image
        if: always() && github.event_name != 'pull_request'
        run: |
          chmod +x tools/publish-ci-image.sh
          tools/publish-ci-image.sh \
            "build/$TARGET-stock-summary.png" \
            "full-hp3940-launch/$GITHUB_RUN_ID/$TARGET.png"

      - name: Add LCD evidence to job summary
        if: always()
        run: |
          IMAGE_URL=""
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            IMAGE_URL="https://github.com/$GITHUB_REPOSITORY/blob/ci-evidence/full-hp3940-launch/$GITHUB_RUN_ID/$TARGET.png?raw=1"
          fi
          python3 tools/pgm-to-summary.py \
            --heading "$TARGET full original-system serial-disk launch" \
            --image-url "$IMAGE_URL" \
            --json "build/$TARGET-stock.json" \
            "build/$TARGET-stock-aplet-library.pgm" \
            "build/$TARGET-stock-receive-menu.pgm" \
            "build/$TARGET-stock-receive-serial-disk.pgm" \
            "build/$TARGET-stock-remote-aplet.pgm" \
            "build/$TARGET-stock-lazy-fetch.pgm" \
            "build/$TARGET-stock-pass.pgm" \
            "build/$TARGET-stock-failure.pgm" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ${{ matrix.target }} stock-launch evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-stock-launch-evidence
          retention-days: 14
          path: |
            build/${{ matrix.target }}-stock*
            build/${{ matrix.target }}-socat.log
            build/${{ matrix.target }}-kermit*
            build/${{ matrix.target }}-fixture-key.txt
            build/${{ matrix.target }}-state/
          if-no-files-found: warn
