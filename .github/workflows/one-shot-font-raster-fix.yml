name: One-shot / Font raster fix

on:
  push:
    branches:
      - m7-fonts-gallery
    paths:
      - ".github/workflows/one-shot-font-raster-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: home-docker
    steps:
      - uses: actions/checkout@v7
        with:
          ref: m7-fonts-gallery
          fetch-depth: 0

      - name: Correct Pillow mask geometry and remove one-shot workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/hpclang-font.py")
          text = path.read_text(encoding="utf-8")
          old = '''        try:\n            mask, _ = font.getmask2(ch, mode="1")\n            bbox = font.getbbox(ch)\n            adv = round(font.getlength(ch))\n        except Exception:\n            continue\n        if bbox is None:\n            glyphs[cp] = Glyph(cp, 0, 0, max(0, adv), 0, 0, b"", 0)\n            continue\n        x0, y0, x1, y1 = bbox\n        gw = max(0, x1 - x0)\n        gh = max(0, y1 - y0)\n        stride = (gw + 7) // 8\n        raw = bytes(mask)\n        bits = bytearray(stride * gh)\n        if gw and gh and len(raw) >= gw * gh:\n            for y in range(gh):\n                for x in range(gw):\n                    if raw[y * gw + x]:\n                        bits[y * stride + (x >> 3)] |= 0x80 >> (x & 7)\n        glyphs[cp] = Glyph(\n            cp,\n            gw,\n            gh,\n            max(0, adv),\n            x0,\n            asc - y1,\n            bytes(bits),\n            stride,\n        )\n'''
          new = '''        try:\n            mask, (x0, y0) = font.getmask2(ch, mode="1")\n            adv = round(font.getlength(ch))\n        except Exception:\n            continue\n        gw, gh = mask.size\n        stride = (gw + 7) // 8\n        raw = bytes(mask)\n        if len(raw) != gw * gh:\n            raise ValueError(\n                f"{source}: U+{cp:04X}: Pillow mask bytes {len(raw)} "\n                f"!= geometry {gw}x{gh}"\n            )\n        bits = bytearray(stride * gh)\n        for y in range(gh):\n            for x in range(gw):\n                if raw[y * gw + x]:\n                    bits[y * stride + (x >> 3)] |= 0x80 >> (x & 7)\n        glyphs[cp] = Glyph(\n            cp,\n            gw,\n            gh,\n            max(0, adv),\n            x0,\n            asc - (y0 + gh),\n            bytes(bits),\n            stride,\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one raster block, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          git rm .github/workflows/one-shot-font-raster-fix.yml
          git diff --check
          git diff -- tools/hpclang-font.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/hpclang-font.py .github/workflows/one-shot-font-raster-fix.yml
          git commit -m "fix: use Pillow mask geometry for font rasterization"
          git pull --rebase origin m7-fonts-gallery
          git push origin HEAD:m7-fonts-gallery
