name: Emu48 headless harness

on:
  push:
    paths:
      - "tests/emu48/**"
      - "tools/emu48-bmp-to-png.py"
      - ".github/workflows/emu48-headless.yml"
  pull_request:
    paths:
      - "tests/emu48/**"
      - "tools/emu48-bmp-to-png.py"
      - ".github/workflows/emu48-headless.yml"
  workflow_dispatch:

jobs:
  harness:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned Emu48+ 67 binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "$env:RUNNER_TEMP\emu48plus67.zip"
          $dst = "$env:GITHUB_WORKSPACE\build\emu48plus67"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Invoke-WebRequest -Uri "https://www.hpcalc.org/hp48/pc/emulators/e48sp67plus.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $dll = Get-ChildItem $dst -Recurse -Filter Emu48.dll | Select-Object -First 1
          if (-not $dll) { throw "Emu48.dll not found in service pack" }
          "EMU48_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-FileHash $zip -Algorithm SHA256 | Format-List | Out-File build\emu48plus67.sha256.txt

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build x86 headless controller
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /nologo /W4 /WX /TC tests\emu48\headless.c user32.lib gdi32.lib /Fe:build\emu48-headless.exe

      - name: Probe Emu48+ automation API
        shell: pwsh
        run: |
          & build\emu48-headless.exe probe "$env:EMU48_DLL" | Tee-Object -FilePath build\emu48-probe.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate screenshot pipeline
        shell: pwsh
        run: |
          & build\emu48-headless.exe selftest build\lcd-selftest.bmp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools\emu48-bmp-to-png.py build\lcd-selftest.bmp build\lcd-selftest.png

      - name: Upload headless harness artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emu48-headless-harness
          path: |
            build/emu48-headless.exe
            build/emu48-probe.json
            build/emu48plus67.sha256.txt
            build/lcd-selftest.bmp
            build/lcd-selftest.png
          if-no-files-found: error
