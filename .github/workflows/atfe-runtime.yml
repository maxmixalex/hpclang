name: CI / Core runtime

on:
  push:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "cmake/**"
      - "tests/unit/**"
      - "tests/e2e/**"
      - "tools/build-e2e.sh"
      - "tools/hpclang-pack.py"
      - "tools/armtoolbox-wrap.py"
      - ".github/actions/setup-atfe/**"
      - ".github/workflows/atfe-runtime.yml"
  pull_request:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "cmake/**"
      - "tests/unit/**"
      - "tests/e2e/**"
      - "tools/build-e2e.sh"
      - "tools/hpclang-pack.py"
      - ".github/actions/setup-atfe/**"
      - ".github/workflows/atfe-runtime.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: home-docker
    steps:
      - uses: actions/checkout@v7

      - name: Verify GitHub-hosted runner baseline
        run: |
          missing=()
          for tool in git curl wget tar xz unzip python3 cc gcc g++ make pkg-config clang file cmake sha256sum find timeout; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if (( ${#missing[@]} )); then
            printf 'Missing GitHub-hosted baseline tools: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Run unit tests
        run: |
          cmake -S tests/unit -B build/unit
          cmake --build build/unit -j2
          ctest --test-dir build/unit --output-on-failure

      - name: Setup Arm Toolchain for Embedded
        uses: ./.github/actions/setup-atfe

      - name: Build unified E2E project
        run: |
          chmod +x tools/build-e2e.sh
          tools/build-e2e.sh hardware "$GITHUB_WORKSPACE/build/e2e"
