name: ATfE runtime

on:
  push:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "include/hpclang/**"
      - "tests/atfe-runtime-smoke.c"
      - "tools/probe-atfe.sh"
      - "tools/hpclang-pack.py"
      - ".github/workflows/atfe-runtime.yml"
  pull_request:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "include/hpclang/**"
      - "tests/atfe-runtime-smoke.c"
      - "tools/probe-atfe.sh"
      - "tools/hpclang-pack.py"
      - ".github/workflows/atfe-runtime.yml"

jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Arm Toolchain for Embedded 22.1.0
        run: |
          curl -L             https://github.com/arm/arm-toolchain/releases/download/release-22.1.0-ATfE/ATfE-22.1.0-Linux-x86_64.tar.xz             -o /tmp/atfe.tar.xz
          mkdir -p /tmp/atfe
          tar -xJf /tmp/atfe.tar.xz -C /tmp/atfe --strip-components=1

      - name: Link compiler-rt and picolibc into HPC1
        env:
          ATFE: /tmp/atfe
        run: |
          chmod +x tools/probe-atfe.sh tools/hpclang-pack.py
          tools/probe-atfe.sh
