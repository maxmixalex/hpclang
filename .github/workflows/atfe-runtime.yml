name: Core runtime

on:
  push:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "tests/atfe-runtime-smoke.c"
      - "tests/atfe-cxx-smoke.cpp"
      - "tests/atfe-platform-stubs.c"
      - "tests/armv4t-softfloat-host.c"
      - "tests/bootstrap-mmu.c"
      - "tests/hp39-visible-smoke.c"
      - "tests/hp39-visible-smoke-irq.S"
      - "tools/probe-atfe.sh"
      - "tools/hpclang-pack.py"
      - ".github/actions/setup-atfe/**"
      - ".github/actions/setup-apt/**"
      - ".github/workflows/atfe-runtime.yml"
  pull_request:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "tests/atfe-runtime-smoke.c"
      - "tests/atfe-cxx-smoke.cpp"
      - "tests/atfe-platform-stubs.c"
      - "tests/armv4t-softfloat-host.c"
      - "tests/bootstrap-mmu.c"
      - "tests/hp39-visible-smoke.c"
      - "tools/probe-atfe.sh"
      - "tools/hpclang-pack.py"
      - ".github/workflows/atfe-runtime.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: home-docker
    steps:
      - uses: actions/checkout@v4

      - name: Setup host build dependencies
        uses: ./.github/actions/setup-apt
        with:
          packages: build-essential curl xz-utils python3

      - name: Validate common MMU layout
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iinclude             runtime/bootstrap/mmu.c tests/bootstrap-mmu.c             -o /tmp/bootstrap-mmu
          /tmp/bootstrap-mmu

      - name: Setup Arm Toolchain for Embedded
        uses: ./.github/actions/setup-atfe

      - name: Link compiler-rt and picolibc into HPC1
        run: |
          chmod +x tools/probe-atfe.sh tools/hpclang-pack.py
          tools/probe-atfe.sh
