name: CI / Core runtime

on:
  push:
    paths:
      - "CMakeLists.txt"
      - "examples/**"
      - "tests/sdk/**"
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "runtime/fonts/generated/**"
      - "platform/armtoolbox/**"
      - "third_party/tinf/**"
      - "include/**"
      - "cmake/**"
      - "tests/unit/**"
      - "tests/font-cmake/**"
      - "tests/e2e/CMakeLists.txt"
      - "tests/e2e/main.c"
      - "tests/e2e/port-recovery/**"
      - "tests/e2e/phase.c"
      - "tests/e2e/harness/x50ng/**"
      - "tools/wait-hp39-kermit-fetch.py"
      - "tools/kermit_watchdog.py"
      - "tests/e2e/cpp.cpp"
      - "tests/e2e/targets/**"
      - "tools/build-e2e.sh"
      - "tools/build-launchers.py"
      - "tools/install-ci-packages.sh"
      - "tools/hpclang-pack.py"
      - "tools/armtoolbox-wrap.py"
      - "tools/prepare-hp39-aplet.py"
      - "tools/bootstrap-hp39-aplet.sh"
      - "tools/package-hp39-aplet.sh"
      - "tools/package-aplet.py"
      - "tools/package-recovery.py"
      - "tools/run-hp48-kermit-send.sh"
      - "tools/prepare-x50ng.py"
      - "tools/fetch-x50ng.sh"
      - "tools/build-ckermit.sh"
      - "tests/e2e/sequences/hp4950-stock-usb-run.seq"
      - "tests/e2e/harness/setup-runtime.sh"
      - "tests/e2e/harness/ckermit-*.patch"
      - "tests/e2e/harness/test-kermit-timers.py"
      - ".github/actions/setup-x50ng/**"
      - ".github/actions/setup-atfe/**"
      - ".github/workflows/atfe-runtime.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "examples/**"
      - "tests/sdk/**"
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "runtime/fonts/generated/**"
      - "platform/armtoolbox/**"
      - "third_party/tinf/**"
      - "include/**"
      - "cmake/**"
      - "tests/unit/**"
      - "tests/font-cmake/**"
      - "tests/e2e/CMakeLists.txt"
      - "tests/e2e/main.c"
      - "tests/e2e/port-recovery/**"
      - "tests/e2e/phase.c"
      - "tests/e2e/harness/x50ng/**"
      - "tools/wait-hp39-kermit-fetch.py"
      - "tools/kermit_watchdog.py"
      - "tests/e2e/cpp.cpp"
      - "tests/e2e/targets/**"
      - "tools/build-e2e.sh"
      - "tools/build-launchers.py"
      - "tools/install-ci-packages.sh"
      - "tools/hpclang-pack.py"
      - "tools/armtoolbox-wrap.py"
      - "tools/prepare-hp39-aplet.py"
      - "tools/bootstrap-hp39-aplet.sh"
      - "tools/package-hp39-aplet.sh"
      - "tools/package-aplet.py"
      - "tools/package-recovery.py"
      - "tools/run-hp48-kermit-send.sh"
      - "tools/prepare-x50ng.py"
      - "tools/fetch-x50ng.sh"
      - "tools/build-ckermit.sh"
      - "tests/e2e/sequences/hp4950-stock-usb-run.seq"
      - "tests/e2e/harness/setup-runtime.sh"
      - "tests/e2e/harness/ckermit-*.patch"
      - "tests/e2e/harness/test-kermit-timers.py"
      - ".github/actions/setup-x50ng/**"
      - ".github/actions/setup-atfe/**"
      - ".github/workflows/atfe-runtime.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HPCLANG_RECOVERY_JOURNAL_SLOT: "0x160105"

jobs:
  runtime:
    name: Runtime and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Run unit tests
        run: |
          cmake -S tests/unit -B build/unit
          cmake --build build/unit -j2
          ctest --test-dir build/unit --output-on-failure

      - name: Setup Arm Toolchain for Embedded
        uses: ./.github/actions/setup-atfe

      - name: Build independent recovery witnesses
        run: |
          export PATH="$ATFE/bin:$PATH"
          for mode in normal interrupted retirement configuration; do
            stop_before_identity=OFF
            retire_journal=OFF
            restart_after_repair=OFF
            bound_journal_slot=
            case "$mode" in
              interrupted) stop_before_identity=ON ;;
              retirement) retire_journal=ON ;;
              configuration)
                retire_journal=ON
                restart_after_repair=ON
                bound_journal_slot="$HPCLANG_RECOVERY_JOURNAL_SLOT"
                ;;
            esac
            cmake -S tests/e2e/port-recovery -B "build/port-recovery/$mode" \
              -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/toolchains/hpclang-armv4t.cmake" \
              -DCMAKE_BUILD_TYPE=MinSizeRel \
              -DHPCLANG_RECOVERY_STOP_BEFORE_IDENTITY="$stop_before_identity" \
              -DHPCLANG_RECOVERY_RETIRE_JOURNAL="$retire_journal" \
              -DHPCLANG_RECOVERY_RESTART_AFTER_REPAIR="$restart_after_repair" \
              -DHPCLANG_RECOVERY_BOUND_JOURNAL_SLOT="$bound_journal_slot"
            cmake --build "build/port-recovery/$mode" -j2
          done

      - name: Upload independent recovery witness
        uses: actions/upload-artifact@v7
        with:
          name: port-recovery-build
          retention-days: 1
          path: |
            build/port-recovery/*/*.elf
            build/port-recovery/*/*.bin
            build/port-recovery/*/*.hp
          if-no-files-found: error

      - name: Restore prepared HPGCC39 cache
        uses: actions/cache@v6
        with:
          path: .cache/hp39-aplet
          key: hpclang-hpgcc39-aplet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap-hp39-aplet.sh', 'tools/prepare-hp39-aplet.py') }}

      - name: Verify installed SDK with external applications
        run: |
          dependencies=()
          command -v clang >/dev/null 2>&1 || dependencies+=(clang)
          if [[ ! -f .cache/hp39-aplet/sdk/.hpclang-prepared ]] && \
             ! command -v innoextract >/dev/null 2>&1; then
            dependencies+=(innoextract)
          fi
          if (( ${#dependencies[@]} )); then
            bash tools/install-ci-packages.sh "${dependencies[@]}"
          fi
          bash tools/bootstrap-hp39-aplet.sh
          host_tool="$(mktemp -d)"
          trap 'rm -rf "$host_tool"' EXIT
          clang -O2 .cache/hp39-aplet/sdk/src/hp2aplet.c -o "$host_tool/hp2aplet"
          python3 tests/sdk/check.py --aplet-tool "$host_tool/hp2aplet" \
            --aplet-assets .cache/hp39-aplet/sdk/data

      - name: Build hardware-validation E2E
        run: |
          chmod +x tools/build-e2e.sh
          tools/build-e2e.sh hardware "$GITHUB_WORKSPACE/build/e2e"

      - name: Upload hardware-validation build
        uses: actions/upload-artifact@v7
        with:
          name: e2e-hardware-build
          retention-days: 1
          path: |
            build/e2e/e2e.result-address
            build/e2e/launchers/hp39gplus.hp
            build/e2e/launchers/hp39gs.hp
            build/e2e/launchers/hp40gs.hp
          if-no-files-found: error

  port-recovery:
    name: Stock recovery / ${{ matrix.target }}
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [hp49gplus, hp50g]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-atfe
      - uses: ./.github/actions/setup-x50ng
      - uses: actions/download-artifact@v7
        with:
          name: port-recovery-build
          path: build/port-recovery
      - name: Prepare Stock runtime
        run: bash tests/e2e/harness/setup-runtime.sh stock hp4950
      - name: Execute independent recovery
        run: |
          python3 tests/e2e/port-recovery/run.py \
            --model "${{ matrix.target }}" \
            --dist build/x50ng/dist --build build/port-recovery/normal \
            --interrupted-build build/port-recovery/interrupted \
            --retirement-build build/port-recovery/retirement \
            --configuration-build build/port-recovery/configuration \
            --configuration-authority --slot "$HPCLANG_RECOVERY_JOURNAL_SLOT" \
            --flash-busy-reads 64 \
            --power-cut 2 16 0x5555 --power-cut 1 16 0x0101 \
            --output build/port-recovery-evidence --nm "$ATFE/bin/llvm-nm"
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-independent-recovery
          retention-days: 14
          path: |
            build/port-recovery-evidence/**/*.json
            build/port-recovery-evidence/**/*.hp
            build/port-recovery-evidence/**/*.log
            build/port-recovery-evidence/**/*.seq
            build/port-recovery-evidence/**/*.sram
            build/port-recovery-evidence/**/*.pgm
            build/port-recovery-evidence/**/state
            build/port-recovery-evidence/**/sram
            build/port-recovery-evidence/**/flash
          if-no-files-found: warn

  hp39-package:
    name: HP39 package
    needs: runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download hardware-validation build
        uses: actions/download-artifact@v7
        with:
          name: e2e-hardware-build
          path: build/package

      - name: Restore prepared HPGCC39 cache
        uses: actions/cache@v6
        with:
          path: .cache/hp39-aplet
          key: hpclang-hpgcc39-aplet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap-hp39-aplet.sh', 'tools/prepare-hp39-aplet.py') }}

      - name: Install HP39 packaging dependency on cache miss
        run: |
          if [[ ! -f .cache/hp39-aplet/sdk/.hpclang-prepared ]] && \
             ! command -v innoextract >/dev/null 2>&1; then
            bash tools/install-ci-packages.sh innoextract
          fi

      - name: Prepare hardware-validation packages
        run: |
          chmod +x tools/bootstrap-hp39-aplet.sh tools/package-hp39-aplet.sh
          tools/bootstrap-hp39-aplet.sh

          for target in hp39gplus hp39gs hp40gs; do
            root="dist/$target-hardware-validation"
            tools/package-hp39-aplet.sh \
              "build/package/launchers/$target.hp" \
              "$root" \
              "$target"
            cp build/package/e2e.result-address "$root/E2E_RESULT_ADDRESS.txt"
            printf 'commit=%s\nworkflow_run=%s\n' \
              "$GITHUB_SHA" "$GITHUB_RUN_ID" \
              > "$root/BUILD_INFO.txt"
          done

      - name: Upload HP39g+ hardware validation bundle
        uses: actions/upload-artifact@v7
        with:
          name: hpclang-hp39gplus-hardware-validation
          retention-days: 30
          path: dist/hp39gplus-hardware-validation/
          if-no-files-found: error

      - name: Upload HP39gs hardware validation bundle
        uses: actions/upload-artifact@v7
        with:
          name: hpclang-hp39gs-hardware-validation
          retention-days: 30
          path: dist/hp39gs-hardware-validation/
          if-no-files-found: error

      - name: Upload HP40gs hardware validation bundle
        uses: actions/upload-artifact@v7
        with:
          name: hpclang-hp40gs-hardware-validation
          retention-days: 30
          path: dist/hp40gs-hardware-validation/
          if-no-files-found: error
