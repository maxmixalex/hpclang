name: Maintenance / One-shot font docs polish

permissions:
  contents: write

on:
  push:
    branches:
      - m7-fonts-gallery
    paths:
      - ".github/workflows/one-shot-font-doc-polish.yml"

jobs:
  polish:
    runs-on: home-docker
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Remove stale pre-curation Font Gallery status
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path_s, old, new, count=1):
              path = Path(path_s)
              text = path.read_text(encoding='utf-8')
              actual = text.count(old)
              assert actual == count, f'{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}'
              path.write_text(text.replace(old, new), encoding='utf-8')

          # API reference: current matrix/evidence rather than the old #42/HP48-open state.
          replace(
              'docs/development/api-reference.md',
              '| native font/text | ✅ | ✅ | HP39 targeted exhaustive 310/620 each; production Gallery Direct families green | HP40gs visual Stock evidence plus HP50g live-native compact Stock Gallery; HP48 compact live-native Gallery still open |',
              '| native font/text | ✅ | ✅ | HP39 targeted exhaustive 277/554 each; curated Gallery Direct families green on all five automated models | HP48gII and HP50g compact live-native Stock controls green; #47 HP48gII also reaches visible stock return |',
          )
          replace(
              'docs/development/api-reference.md',
              '| generated font selection | ✅ configure | ✅ | production Gallery #42 exhaustively traverses 275 generated faces on all five automated targets | HP50g compact Stock control green |',
              '| generated font selection | ✅ configure | ✅ | production Gallery #47 exhaustively traverses 275 generated faces on all five automated targets | HP48gII and HP50g compact Stock controls green |',
          )
          replace(
              'docs/development/api-reference.md',
              'Formal `E2E / Font Gallery` run **34743437279 / #47 (attempt 2)** is green across Build, universal x50ng, `Gallery / hp39`, `Gallery / hp48`, `Gallery / hp4950`, and `Stock Gallery / hp50g`.',
              'Formal `E2E / Font Gallery` run **34743437279 / #47 (attempt 2)** is green across Build, universal x50ng, `Gallery / hp39`, `Gallery / hp48`, `Gallery / hp4950`, `Stock / hp48`, and `Stock / hp4950`.',
          )

          # Roadmap: HP48 live-native evidence is closed; human asset review is now the merge blocker.
          replace(
              'docs/development/roadmap.md',
              '- [x] formal production `E2E / Font Gallery` run **34743437279 / #47 (attempt 2)** is fully green across Build, universal x50ng, `Gallery / hp39`, `Gallery / hp48`, `Gallery / hp4950`, and `Stock Gallery / hp50g`.',
              '- [x] formal production `E2E / Font Gallery` run **34743437279 / #47 (attempt 2)** is fully green across Build, universal x50ng, `Gallery / hp39`, `Gallery / hp48`, `Gallery / hp4950`, `Stock / hp48`, and `Stock / hp4950`.',
          )
          replace(
              'docs/development/roadmap.md',
              '- [x] close the formal production Gallery matrix after the HP39 mapping fix (`E2E / Font Gallery` #42);',
              '- [x] close the curated production Gallery matrix after source-package pruning and the HP39 mapping fix (`E2E / Font Gallery` #47, attempt 2);',
          )
          replace(
              'docs/development/roadmap.md',
              '- [ ] add compact HP48gII Stock Gallery evidence for the 64-line live Saturn native-font path;',
              '- [x] add compact HP48gII Stock Gallery evidence for the 64-line live Saturn native-font path, including distinct/nonblank native probes, HPC1 PASS, and visible stock return;',
          )
          replace(
              'docs/development/roadmap.md',
              '- [ ] merge the completed font slice to `main` after the final HP48 Stock Gallery and documentation/evidence review.',
              '- [ ] complete human visual curation of the retained TTF faces; regenerate/re-evidence any further removals, then merge the font slice to `main` after final documentation/evidence review.',
          )

          # Compatibility inventory: current closure includes both live-native Stock families.
          replace(
              'docs/development/hpgcc-compat.md',
              'The production Font Gallery gate now covers this boundary directly: targeted HP39 exhaustive validation completes 277 entries / 554 captures on both HP39gs and HP40gs, and formal `E2E / Font Gallery` run `34698825657` / #42 is green across all Direct families plus the HP50g Stock live-native control.',
              'The production Font Gallery gate now covers this boundary directly: targeted HP39 exhaustive validation completes 277 entries / 554 captures on both HP39gs and HP40gs, and formal `E2E / Font Gallery` run `34743437279` / #47 (attempt 2) is green across all Direct families plus the HP48gII and HP50g live-native Stock controls.',
          )

          # E2E: preserve the concern separation, but record that current HP48 Gallery evidence actually returns visibly.
          replace(
              'docs/development/e2e.md',
              'The HP48 font-evidence job deliberately accepts the already-classified post-PASS `return-unsettled` state only for this concern-specific gate; that does **not** convert the separate HP48 visible Stock-return gate into a PASS.',
              'The concern-specific HP48 font gate still keeps post-PASS return settling separately classified from native-font correctness; however, the curated #47 run itself reaches visible Stock-return PASS, so current Gallery evidence does not rely on a `return-unsettled` exception.',
          )
          replace(
              'docs/development/e2e.md',
              'Formal production run **34743437279 / #47 (attempt 2)** is green across the Build stage, universal x50ng, `Gallery / hp39`, `Gallery / hp48`, `Gallery / hp4950`, `Stock Gallery / hp50g`, and `Stock native-font evidence / hp48gii`.',
              'Formal production run **34743437279 / #47 (attempt 2)** is green across the Build stage, universal x50ng, `Gallery / hp39`, `Gallery / hp48`, `Gallery / hp4950`, `Stock / hp48`, and `Stock / hp4950`.',
          )

          # Validation: same matrix naming/current return evidence, plus current acknowledged Stock-key protocol.
          replace(
              'docs/development/validation.md',
              '- production `E2E / Font Gallery` run **34743437279 / #47 (attempt 2)** is fully green: Build, universal x50ng, `Gallery / hp39`, `Gallery / hp48`, `Gallery / hp4950`, `Stock Gallery / hp50g`, and `Stock native-font evidence / hp48gii` all succeed;',
              '- production `E2E / Font Gallery` run **34743437279 / #47 (attempt 2)** is fully green: Build, universal x50ng, `Gallery / hp39`, `Gallery / hp48`, `Gallery / hp4950`, `Stock / hp48`, and `Stock / hp4950` all succeed;',
          )
          replace(
              'docs/development/validation.md',
              '- the HP48 font-specific gate requires `saw_pass: true` and valid distinct native-mini/native-main/generated captures, while allowing only the already-classified post-PASS `return-unsettled` outcome; this does **not** satisfy the separate visible Stock-return gate;',
              '- the HP48 font-specific gate requires `saw_pass: true` and valid distinct native-mini/native-main/generated captures while keeping return settling separately observable; curated run #47 additionally reaches visible Stock-return PASS;',
          )
          replace(
              'docs/development/validation.md',
              'both sequences were corrected and revalidated before run #45 became the formal closure.',
              'both sequences were corrected and revalidated before the current curated #47 closure.',
          )
          replace(
              'docs/development/validation.md',
              'The remaining Stock/hp39 keyboard flake and HP48 visible-return settling issue are downstream of this font proof and are not blockers for the native-font mapping/evidence closure.',
              'Broader Stock-runtime harness stabilization remains downstream of this font proof and is tracked separately; curated Font Gallery #47 itself has green HP48gII and HP50g Stock evidence and does not depend on an unsettled-return result.',
          )
          replace(
              'docs/development/validation.md',
              'The current Stock launcher waits for the guest\'s `PHASE_KEYBOARD_READY` marker and then schedules all 51 key down/up pairs on x50ng\'s realtime timer. Direct uses the same 50 ms hold and 120 ms step values and passes on all five automated models. The guest keyboard test is intentionally strict: after resetting its event baseline, any event other than the expected next DOWN/UP pair fails immediately with `0x10` (`0x46410010` in the shared result word).\n\nThat makes the first repair attempt a **small, harness-local synchronization change**, not a keyboard-runtime rewrite. Preferred order:',
              'The Stock launcher now waits for the guest\'s `PHASE_KEYBOARD_READY` marker and advances key injection one acknowledged transition at a time through the test-only `KBRD -> KACK(n)` handshake instead of pre-scheduling all 51 key pairs. Direct remains the blocking keyboard-runtime correctness gate and passes all 51 positions on all five automated models. The guest keyboard test is intentionally strict: after resetting its event baseline, any event other than the expected next DOWN/UP pair fails immediately with `0x10` (`0x46410010` in the shared result word).\n\nThe bounded Stock repair remains **harness-local synchronization**, not a keyboard-runtime rewrite. Follow-up order:',
          )
          replace(
              'docs/development/validation.md',
              '1. make Stock key progression closed-loop or explicitly acknowledge guest progress instead of pre-scheduling all 51 pairs;\n2. publish the same 52-frame keyboard progression evidence already available in Direct so the first divergent key is visible;\n3. if needed, add an explicit release-all/quiescent baseline handshake after Stock UI/ARMToolbox launch and before the first injected key.',
              '1. retain the closed-loop acknowledged Stock key progression and keep protocol failures distinguishable from runtime failures;\n2. publish the same 52-frame keyboard progression evidence already available in Direct so the first divergent key is visible;\n3. if needed, add an explicit release-all/quiescent baseline handshake after Stock UI/ARMToolbox launch and before the first injected key.',
          )

          # Trigger one final maintenance pass after this one-shot workflow deletes itself.
          ci = Path('.github/workflows/ci-maintenance.yml')
          text = ci.read_text(encoding='utf-8')
          marker = '      - name: Prune old Actions runs\n'
          assert text.count(marker) == 1
          text = text.replace(marker, '      # Final branch-only pass also removes this documentation-polish one-shot run.\n' + marker)
          ci.write_text(text, encoding='utf-8')

          # Current-state stale phrases must be gone.
          checks = {
              'docs/development/api-reference.md': [
                  '310/620', 'production Gallery #42', 'HP48 compact live-native Gallery still open',
                  'Stock Gallery / hp50g',
              ],
              'docs/development/roadmap.md': [
                  '(`E2E / Font Gallery` #42)', '- [ ] add compact HP48gII Stock Gallery evidence',
                  'after the final HP48 Stock Gallery', 'Stock Gallery / hp50g',
              ],
              'docs/development/hpgcc-compat.md': ['`34698825657` / #42'],
              'docs/development/e2e.md': ['Stock Gallery / hp50g', 'Stock native-font evidence / hp48gii'],
              'docs/development/validation.md': [
                  'Stock Gallery / hp50g', 'Stock native-font evidence / hp48gii',
                  'run #45 became the formal closure',
              ],
          }
          for path_s, stale_items in checks.items():
              text = Path(path_s).read_text(encoding='utf-8')
              for stale in stale_items:
                  assert stale not in text, f'{path_s}: stale phrase remains: {stale}'

          print('semantic font documentation polish passed')
          PY
          git diff --check
          git diff --stat

      - name: Commit polished documentation and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-font-doc-polish.yml
          git add -A docs/development .github/workflows/ci-maintenance.yml .github/workflows/one-shot-font-doc-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: remove stale pre-curation gallery status"
          git fetch origin m7-fonts-gallery
          git rebase origin/m7-fonts-gallery
          git push origin HEAD:m7-fonts-gallery
