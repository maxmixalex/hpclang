name: Fix bitmap helper signature

on:
  push:
    branches:
      - m7-fonts-gallery
    paths:
      - ".github/workflows/fix-font-bitmap-helper-signature.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: m7-fonts-gallery
      - name: Restore bitmap helper parameter type and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('runtime/core/font.c')
          text = path.read_text()
          old = '''static const struct hpclang_bitmap_glyph *bitmap_glyph(\n    const struct hpclang_font *font,\n    uint32_t codepoint)\n'''
          new = '''static const struct hpclang_bitmap_glyph *bitmap_glyph(\n    const struct hpclang_bitmap_font_data *font,\n    uint32_t codepoint)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one broken bitmap_glyph signature, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-font-bitmap-helper-signature.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/core/font.c
          git commit -m "fix: restore bitmap glyph helper type"
          git push origin HEAD:m7-fonts-gallery
