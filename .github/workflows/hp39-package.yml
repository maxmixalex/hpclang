name: CI / HP39 package

on:
  push:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "tests/hp39-visible-smoke.c"
      - "tests/hp39-runtime-diag.c"
      - "tests/armv4t-softfloat-host.c"
      - "tools/hpclang-pack.py"
      - "tools/armtoolbox-wrap.py"
      - "tools/probe-atfe.sh"
      - "tools/prepare-hp39-aplet.py"
      - "tools/bootstrap-hp39-aplet.sh"
      - "tools/package-hp39-aplet.sh"
      - ".github/actions/setup-atfe/**"
      - ".github/workflows/hp39-package.yml"
  pull_request:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "tests/hp39-visible-smoke.c"
      - "tests/hp39-runtime-diag.c"
      - "tests/armv4t-softfloat-host.c"
      - "tools/hpclang-pack.py"
      - "tools/armtoolbox-wrap.py"
      - "tools/probe-atfe.sh"
      - "tools/prepare-hp39-aplet.py"
      - "tools/bootstrap-hp39-aplet.sh"
      - "tools/package-hp39-aplet.sh"
      - ".github/workflows/hp39-package.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: home-docker
    steps:
      - uses: actions/checkout@v7

      - name: Install HP39 packaging dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends innoextract

      - name: Setup Arm Toolchain for Embedded
        uses: ./.github/actions/setup-atfe

      - name: Build visible HPC1 and stock launcher bundle
        run: |
          chmod +x             tools/probe-atfe.sh             tools/hpclang-pack.py             tools/armtoolbox-wrap.py
          tools/probe-atfe.sh

      - name: Build HP39g+ model-1 launcher bundle
        run: |
          $ATFE/bin/clang \
            --target=arm-none-eabi -march=armv4t -marm \
            -mfpu=none -mfloat-abi=soft -mabi=aapcs \
            -fno-stack-protector -fno-unwind-tables \
            -fno-asynchronous-unwind-tables -fno-pic -fno-pie \
            -DHPCLANG_STAGE0_MODEL=1 \
            -c platform/armtoolbox/stage0.S \
            -o build/atfe-probe/stage0-hp39gplus.o

          $ATFE/bin/ld.lld -m armelf \
            -T platform/armtoolbox/stage0.ld \
            build/atfe-probe/stage0-hp39gplus.o \
            build/atfe-probe/stage0-bundle.o \
            -o build/atfe-probe/stage0-hp39gplus.elf

          $ATFE/bin/llvm-objcopy -O binary \
            build/atfe-probe/stage0-hp39gplus.elf \
            build/atfe-probe/stage0-hp39gplus.bin

          python3 tools/armtoolbox-wrap.py \
            build/atfe-probe/stage0-hp39gplus.bin \
            build/atfe-probe/hp39gplus-hpc1.hp

      - name: Build HP40gs model-3 launcher bundle
        run: |
          $ATFE/bin/clang \
            --target=arm-none-eabi -march=armv4t -marm \
            -mfpu=none -mfloat-abi=soft -mabi=aapcs \
            -fno-stack-protector -fno-unwind-tables \
            -fno-asynchronous-unwind-tables -fno-pic -fno-pie \
            -DHPCLANG_STAGE0_MODEL=3 \
            -c platform/armtoolbox/stage0.S \
            -o build/atfe-probe/stage0-hp40gs.o

          $ATFE/bin/ld.lld -m armelf \
            -T platform/armtoolbox/stage0.ld \
            build/atfe-probe/stage0-hp40gs.o \
            build/atfe-probe/stage0-bundle.o \
            -o build/atfe-probe/stage0-hp40gs.elf

          $ATFE/bin/llvm-objcopy -O binary \
            build/atfe-probe/stage0-hp40gs.elf \
            build/atfe-probe/stage0-hp40gs.bin

          python3 tools/armtoolbox-wrap.py \
            build/atfe-probe/stage0-hp40gs.bin \
            build/atfe-probe/hp40gs-hpc1.hp

      - name: Restore HPGCC39 packaging cache
        uses: actions/cache@v6
        with:
          path: .cache/hp39-aplet
          key: hpclang-hpgcc39-aplet-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Prepare HP39g+, HP39gs and HP40gs hardware-validation packages
        run: |
          chmod +x tools/bootstrap-hp39-aplet.sh tools/package-hp39-aplet.sh
          tools/bootstrap-hp39-aplet.sh

          # Temporary provenance probe: inventory the 2006 HPGCC 39G kit without
          # publishing any vendor binaries.
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path(".cache/hp39-aplet/raw")
          files = sorted(p for p in root.rglob("*") if p.is_file())
          with Path("build/hpgcc39-files.txt").open("w", encoding="utf-8") as out:
              for path in files:
                  out.write(f"{path.relative_to(root)}\t{path.stat().st_size}\n")

          terms = re.compile(
              r"39g|armtool|boot|flash|kinpo|jtag|dump|rom|s3c2410",
              re.IGNORECASE,
          )
          printable = re.compile(rb"[ -~]{6,}")
          with Path("build/hpgcc39-strings.txt").open("w", encoding="utf-8") as out:
              for path in files:
                  data = path.read_bytes()
                  hits = []
                  for match in printable.finditer(data):
                      text = match.group().decode("ascii", errors="ignore")
                      if terms.search(text):
                          hits.append(text)
                          if len(hits) >= 200:
                              break
                  if hits:
                      out.write(f"===== {path.relative_to(root)} =====\n")
                      for text in hits:
                          out.write(text + "\n")
          PY

          tools/package-hp39-aplet.sh \
            build/atfe-probe/hp39gplus-hpc1.hp \
            dist/hp39gplus-hardware-validation \
            hp39gplus

          tools/package-hp39-aplet.sh \
            build/atfe-probe/hp39gs-hpc1.hp \
            dist/hp39gs-hardware-validation \
            hp39gs

          tools/package-hp39-aplet.sh \
            build/atfe-probe/hp40gs-hpc1.hp \
            dist/hp40gs-hardware-validation \
            hp40gs

          for root in \
            dist/hp39gplus-hardware-validation \
            dist/hp39gs-hardware-validation \
            dist/hp40gs-hardware-validation
          do
            cp build/atfe-probe/hp39-visible.result-address \
              "$root/E2E_RESULT_ADDRESS.txt"
            printf 'commit=%s\nworkflow_run=%s\n' \
              "$GITHUB_SHA" "$GITHUB_RUN_ID" \
              > "$root/BUILD_INFO.txt"
          done

          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          for root in (
              Path("dist/hp39gs-hardware-validation"),
              Path("dist/hp40gs-hardware-validation"),
          ):
              names = sorted(
                  p.name for p in root.iterdir()
                  if p.is_file() and p.name != "SHA256SUMS.txt"
              )
              with (root / "SHA256SUMS.txt").open("w", encoding="ascii") as out:
                  for name in names:
                      digest = sha256((root / name).read_bytes()).hexdigest()
                      out.write(f"{digest}  {name}\n")
          PY

      - name: Upload temporary HPGCC39 provenance inventory
        uses: actions/upload-artifact@v7
        with:
          name: hpgcc39-provenance-inventory
          retention-days: 1
          path: |
            build/hpgcc39-files.txt
            build/hpgcc39-strings.txt
          if-no-files-found: error

      - name: Upload HP39g+ hardware validation bundle
        uses: actions/upload-artifact@v7
        with:
          name: hpclang-hp39gplus-hardware-validation
          retention-days: 30
          path: dist/hp39gplus-hardware-validation/
          if-no-files-found: error

      - name: Upload HP39gs hardware validation bundle
        uses: actions/upload-artifact@v7
        with:
          name: hpclang-hp39gs-hardware-validation
          retention-days: 30
          path: dist/hp39gs-hardware-validation/
          if-no-files-found: error

      - name: Upload HP40gs hardware validation bundle
        uses: actions/upload-artifact@v7
        with:
          name: hpclang-hp40gs-hardware-validation
          retention-days: 30
          path: dist/hp40gs-hardware-validation/
          if-no-files-found: error
