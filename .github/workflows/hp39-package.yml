name: CI / HP39 package

on:
  push:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "cmake/**"
      - "tests/e2e/**"
      - "tools/build-e2e.sh"
      - "tools/hpclang-pack.py"
      - "tools/armtoolbox-wrap.py"
      - "tools/prepare-hp39-aplet.py"
      - "tools/bootstrap-hp39-aplet.sh"
      - "tools/package-hp39-aplet.sh"
      - ".github/actions/setup-atfe/**"
      - ".github/workflows/hp39-package.yml"
  pull_request:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "cmake/**"
      - "tests/e2e/**"
      - "tools/build-e2e.sh"
      - "tools/hpclang-pack.py"
      - "tools/armtoolbox-wrap.py"
      - "tools/prepare-hp39-aplet.py"
      - "tools/bootstrap-hp39-aplet.sh"
      - "tools/package-hp39-aplet.sh"
      - ".github/actions/setup-atfe/**"
      - ".github/workflows/hp39-package.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: home-docker
    steps:
      - uses: actions/checkout@v7

      - name: Install HP39 packaging dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends innoextract

      - name: Setup Arm Toolchain for Embedded
        uses: ./.github/actions/setup-atfe

      - name: Build unified E2E application
        run: |
          chmod +x tools/build-e2e.sh tools/hpclang-pack.py tools/armtoolbox-wrap.py
          OUT="$GITHUB_WORKSPACE/build/package" tools/build-e2e.sh

      - name: Build HP39 family launchers
        run: |
          for spec in hp39gplus:1 hp39gs:2 hp40gs:3; do
            TARGET="${spec%%:*}"
            MODEL="${spec##*:}"

            $ATFE/bin/clang               --target=arm-none-eabi -march=armv4t -marm               -mfpu=none -mfloat-abi=soft -mabi=aapcs               -fno-stack-protector -fno-unwind-tables               -fno-asynchronous-unwind-tables -fno-pic -fno-pie               -DHPCLANG_STAGE0_MODEL="$MODEL"               -c platform/armtoolbox/stage0.S               -o "build/package/stage0-$TARGET.o"

            $ATFE/bin/ld.lld -m armelf               -T platform/armtoolbox/stage0.ld               "build/package/stage0-$TARGET.o"               build/package/stage0-bundle.o               -o "build/package/stage0-$TARGET.elf"

            $ATFE/bin/llvm-objcopy -O binary               "build/package/stage0-$TARGET.elf"               "build/package/stage0-$TARGET.bin"

            python3 tools/armtoolbox-wrap.py               "build/package/stage0-$TARGET.bin"               "build/package/$TARGET-hpc1.hp"
          done

      - name: Restore HPGCC39 packaging cache
        uses: actions/cache@v6
        with:
          path: .cache/hp39-aplet
          key: hpclang-hpgcc39-aplet-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Prepare hardware-validation packages
        run: |
          chmod +x tools/bootstrap-hp39-aplet.sh tools/package-hp39-aplet.sh
          tools/bootstrap-hp39-aplet.sh

          for target in hp39gplus hp39gs hp40gs; do
            root="dist/$target-hardware-validation"
            tools/package-hp39-aplet.sh               "build/package/$target-hpc1.hp"               "$root"               "$target"
            cp build/package/e2e.result-address "$root/E2E_RESULT_ADDRESS.txt"
            printf 'commit=%s\nworkflow_run=%s\n'               "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$root/BUILD_INFO.txt"
          done

      - name: Upload HP39g+ hardware validation bundle
        uses: actions/upload-artifact@v7
        with:
          name: hpclang-hp39gplus-hardware-validation
          retention-days: 30
          path: dist/hp39gplus-hardware-validation/
          if-no-files-found: error

      - name: Upload HP39gs hardware validation bundle
        uses: actions/upload-artifact@v7
        with:
          name: hpclang-hp39gs-hardware-validation
          retention-days: 30
          path: dist/hp39gs-hardware-validation/
          if-no-files-found: error

      - name: Upload HP40gs hardware validation bundle
        uses: actions/upload-artifact@v7
        with:
          name: hpclang-hp40gs-hardware-validation
          retention-days: 30
          path: dist/hp40gs-hardware-validation/
          if-no-files-found: error
