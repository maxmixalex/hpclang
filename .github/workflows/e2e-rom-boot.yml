name: E2E / ROM boot

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/x50ng/little-apple-boot-main.c"
      - "tests/x50ng/headless-ui-init.h"
      - "tools/pgm-to-summary.py"
      - "tools/e2e-target-env.py"
      - "tools/prepare-x50ng.py"
      - "tools/fetch-x50ng.sh"
      - "tests/e2e/targets/**"
      - ".github/workflows/e2e-rom-boot.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    name: ${{ matrix.target }}
    runs-on: home-docker
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [hp39gs, hp40gs]

    steps:
      - uses: actions/checkout@v7

      - name: Load target profile
        run: python3 tools/e2e-target-env.py "tests/e2e/targets/${{ matrix.target }}.json" >> "$GITHUB_ENV"

      - name: Restore x50ng build cache
        id: x50ng-cache
        uses: actions/cache/restore@v6
        with:
          path: build/x50ng/dist
          key: hpclang-x50ng-rom-boot-little-apple-${{ runner.os }}-${{ runner.arch }}-003533d9-dist-v1-${{ hashFiles('tools/prepare-x50ng.py', 'tools/fetch-x50ng.sh', 'tests/x50ng/little-apple-boot-main.c', 'tests/x50ng/headless-ui-init.h') }}
      - name: Ensure x50ng runtime dependencies
        run: |
          packages=(libglib2.0-0t64 libgtk-4-1 libncurses6 liblua5.4-0)
          missing=()
          for package in "${packages[@]}"; do
            dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'ok installed' \
              || missing+=("$package")
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Install x50ng build dependencies
        if: steps.x50ng-cache.outputs.cache-hit != 'true'
        run: |
          packages=(libglib2.0-dev libgtk-4-dev libncurses-dev liblua5.4-dev)
          missing=()
          for package in "${packages[@]}"; do
            dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'ok installed' \
              || missing+=("$package")
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Fetch and adapt pinned x50ng
        if: steps.x50ng-cache.outputs.cache-hit != 'true'
        run: tools/fetch-x50ng.sh build/x50ng tests/x50ng/little-apple-boot-main.c little-apple

      - name: Build x50ng
        if: steps.x50ng-cache.outputs.cache-hit != 'true'
        working-directory: build/x50ng
        run: make -j2 WITH_SDL=no WITH_SDL2=no LUA_VERSION=lua5.4

      - name: Save x50ng build cache
        if: steps.x50ng-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/x50ng/dist
          key: ${{ steps.x50ng-cache.outputs.cache-primary-key }}

      - name: Record x50ng source
        run: printf '%s\n' 003533d9eca3f6ded36c6ab80b8dbc0563e31d9a > build/x50ng-little-apple-source.txt
      - name: Fetch bootloader and official Little-Apple ROM
        run: |
          find build/x50ng/dist/firmware -mindepth 1 -maxdepth 1 ! -name Makefile -exec rm -rf {} +
          make -C build/x50ng/dist/firmware bootloaders
          curl -L "https://www.hpcalc.org/hp39/pc/$HPCLANG_E2E_ARCHIVE" -o "/tmp/$HPCLANG_E2E_ARCHIVE"
          unzip -p "/tmp/$HPCLANG_E2E_ARCHIVE" "$HPCLANG_E2E_MEMBER" > build/little-apple.bin
          python3 - <<'PY'
          from pathlib import Path
          data = Path("build/little-apple.bin").read_bytes()
          print("size", len(data))
          print("header", data[:32])
          if data[:16] not in (b"KINPOHP39G+IMAGE", b"KINPOHP40G+IMAGE"):
              raise SystemExit("unexpected Little-Apple Kinpo update header")
          PY
          sha256sum build/little-apple.bin

      - name: Boot official ${{ matrix.target }} ROM on ARM hardware model
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "build/$TARGET-state"
          export HPCLANG_LA_PREFIX="$GITHUB_WORKSPACE/build/$TARGET"
          export HPCLANG_LA_JSON="$GITHUB_WORKSPACE/build/$TARGET.json"
          timeout 25s build/x50ng/dist/x50ng \
            --datadir="$GITHUB_WORKSPACE/build/$TARGET-state" \
            --overwrite-config \
            --style="$GITHUB_WORKSPACE/build/x50ng/dist/style-40g.css" \
            --flash-full \
            --bootloader="$GITHUB_WORKSPACE/build/x50ng/dist/firmware/boot-50g.bin" \
            --firmware="$GITHUB_WORKSPACE/build/little-apple.bin"
          for pgm in build/$TARGET-*.pgm; do
            [ -f "$pgm" ] || continue
            python3 tools/pgm-to-png.py "$pgm" "$pgm.png"
          done
          cat "build/$TARGET.json"

      - name: Generate LCD summary image
        if: always()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 tools/pgm-to-summary.py \
            --image-only \
            --image-out "build/$TARGET-summary.png" \
            "build/$TARGET-1.pgm" \
            "build/$TARGET-2.pgm" \
            "build/$TARGET-3.pgm" \
            "build/$TARGET-4.pgm"

      - name: Upload LCD summary image
        if: always()
        id: lcd-summary-image
        uses: actions/upload-artifact@v7
        with:
          name: lcd-summary-${{ matrix.target }}
          path: build/${{ matrix.target }}-summary.png
          archive: false
          if-no-files-found: ignore

      - name: Add LCD evidence to job summary
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT_ID: ${{ steps.lcd-summary-image.outputs.artifact-id }}
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE_URL=""
          if [ -n "$ARTIFACT_ID" ]; then
            IMAGE_URL="$(curl -fLsS -o /dev/null -w '%{url_effective}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              "$API_URL/repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" || true)"
          fi
          python3 tools/pgm-to-summary.py \
            --heading "$TARGET official-ROM boot" \
            --image-url "$IMAGE_URL" \
            --json "build/$TARGET.json" \
            "build/$TARGET-1.pgm" \
            "build/$TARGET-2.pgm" \
            "build/$TARGET-3.pgm" \
            "build/$TARGET-4.pgm" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ${{ matrix.target }} ARM boot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x50ng-${{ matrix.target }}-arm-boot
          path: |
            build/${{ matrix.target }}-*.pgm
            build/${{ matrix.target }}-*.pgm.png
            build/${{ matrix.target }}.json
            build/x50ng-little-apple-source.txt
            build/little-apple.bin
          if-no-files-found: warn
