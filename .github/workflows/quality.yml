name: Quality

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.c"
      - "**/*.h"
      - "**/*.cpp"
      - "**/*.cc"
      - "**/*.cxx"
      - "**/*.hpp"
      - "**/*.py"
      - "**/*.sh"
      - "**/CMakeLists.txt"
      - "cmake/**"
      - ".clang-format"
      - "pyproject.toml"
      - "tools/requirements-quality.txt"
      - ".github/actions/setup-atfe/**"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "**/*.c"
      - "**/*.h"
      - "**/*.cpp"
      - "**/*.cc"
      - "**/*.cxx"
      - "**/*.hpp"
      - "**/*.py"
      - "**/*.sh"
      - "**/CMakeLists.txt"
      - "cmake/**"
      - ".clang-format"
      - "pyproject.toml"
      - "tools/requirements-quality.txt"
      - ".github/actions/setup-atfe/**"
      - ".github/workflows/quality.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, and Clang analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-atfe
      - name: Install quality tools
        run: |
          bash tools/install-ci-packages.sh python3-venv shellcheck
          python3 -m venv build/quality-venv
          build/quality-venv/bin/pip install --disable-pip-version-check -r tools/requirements-quality.txt
          echo "$GITHUB_WORKSPACE/build/quality-venv/bin" >> "$GITHUB_PATH"
          echo "$ATFE/bin" >> "$GITHUB_PATH"
      - name: Lint Python and shell
        run: bash tools/lint.sh
      - name: Check source formatting
        run: bash tools/format.sh --check
      - name: Analyze host and ARM C/C++
        run: bash tools/analyze.sh
