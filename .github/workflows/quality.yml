name: Quality

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.c"
      - "**/*.h"
      - "**/*.cc"
      - "**/*.cpp"
      - "**/*.cxx"
      - "**/*.hpp"
      - "**/*.py"
      - "**/*.sh"
      - ".clang-format"
      - "pyproject.toml"
      - "tools/lint.sh"
      - "tools/format.sh"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "**/*.c"
      - "**/*.h"
      - "**/*.cc"
      - "**/*.cpp"
      - "**/*.cxx"
      - "**/*.hpp"
      - "**/*.py"
      - "**/*.sh"
      - ".clang-format"
      - "pyproject.toml"
      - "tools/lint.sh"
      - "tools/format.sh"
      - ".github/workflows/quality.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff + ShellCheck
    runs-on: home-docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install lightweight lint dependencies
        run: |
          set -euo pipefail
          apt_install() {
            local installed=false
            for attempt in 1 2 3; do
              sudo -E rm -rf /var/lib/apt/lists/partial
              if sudo -E apt-get -o Acquire::Retries=4 update -qq &&
                 sudo -E apt-get -o Acquire::Retries=4 install -y --no-install-recommends "$@"; then
                installed=true
                break
              fi
              printf 'quality apt install attempt %d failed; refreshing metadata\n' "$attempt" >&2
              sleep $((attempt * 2))
            done
            "$installed"
          }
          if ! command -v ruff >/dev/null 2>&1; then
            if ! python3 -m venv build/quality-venv; then
              apt_install python3-venv
              python3 -m venv build/quality-venv
            fi
            build/quality-venv/bin/pip install --disable-pip-version-check 'ruff==0.13.2'
            echo "$GITHUB_WORKSPACE/build/quality-venv/bin" >> "$GITHUB_PATH"
            export PATH="$GITHUB_WORKSPACE/build/quality-venv/bin:$PATH"
          fi
          if ! command -v shellcheck >/dev/null 2>&1; then
            apt_install shellcheck
          fi
          ruff --version
          shellcheck --version

      - name: Lint Python and shell
        run: bash tools/lint.sh

      - name: Verify HP39 Kermit completion gate
        run: python3 -m unittest discover -s tests/unit -p 'test_hp39_kermit_gate.py'

  formatter-config:
    name: Formatter configuration
    runs-on: home-docker
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - name: Validate formatter configuration
        run: |
          set -euo pipefail
          test -s .clang-format
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("pyproject.toml").read_text())
          assert "ruff" in config["tool"]
          print("formatter configuration: clang-format + Ruff")
          PY

          if ! command -v clang-format >/dev/null 2>&1; then
            installed=false
            for attempt in 1 2 3; do
              sudo -E rm -rf /var/lib/apt/lists/partial
              if sudo -E apt-get -o Acquire::Retries=4 update -qq &&
                 sudo -E apt-get -o Acquire::Retries=4 install -y --no-install-recommends clang-format; then
                installed=true
                break
              fi
              printf 'quality clang-format install attempt %d failed; refreshing metadata\n' "$attempt" >&2
              sleep $((attempt * 2))
            done
            "$installed"
          fi
          printf 'int main(void){return 0;}\n' | clang-format --style=file >/dev/null

      - name: Explain formatting boundary
        run: |
          echo "C/C++ formatting is configured by .clang-format."
          echo "Python formatting is configured by Ruff in pyproject.toml."
          echo "Run: tools/format.sh"
          echo "Check selected files without rewriting: tools/format.sh --check <files...>"
