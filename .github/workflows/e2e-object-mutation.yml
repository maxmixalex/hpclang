name: E2E / Object mutation

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - "runtime/**"
      - "platform/armtoolbox/**"
      - "include/**"
      - "cmake/**"
      - "tests/e2e/**"
      - "tools/build-e2e.sh"
      - "tools/install-ci-packages.sh"
      - "tools/hpclang-pack.py"
      - "tools/armtoolbox-wrap.py"
      - "tools/e2e-target-env.py"
      - "tools/prepare-x50ng.py"
      - "tools/prepare-nor-fixture.py"
      - "tools/prepare-hp48gii-nor.py"
      - "tools/fetch-x50ng.sh"
      - "tools/build-ckermit.sh"
      - "tools/run-hp39-kermit-server.sh"
      - "tools/wait-hp39-kermit-fetch.py"
      - "tools/run-hp48-kermit-send.sh"
      - "tools/hp48-kermit-watchdog.py"
      - "tools/hp-rpl-string-wrap.py"
      - "tools/bootstrap-hp39-aplet.sh"
      - "tools/package-hp39-aplet.sh"
      - "tools/prepare-hp39-aplet.py"
      - ".github/actions/setup-atfe/**"
      - ".github/actions/setup-x50ng/**"
      - ".github/workflows/e2e-object-mutation.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "platform/armtoolbox/**"
      - "include/**"
      - "cmake/**"
      - "tests/e2e/**"
      - "tools/build-e2e.sh"
      - "tools/install-ci-packages.sh"
      - "tools/hpclang-pack.py"
      - "tools/armtoolbox-wrap.py"
      - "tools/e2e-target-env.py"
      - "tools/prepare-x50ng.py"
      - "tools/prepare-nor-fixture.py"
      - "tools/prepare-hp48gii-nor.py"
      - "tools/fetch-x50ng.sh"
      - "tools/build-ckermit.sh"
      - "tools/run-hp39-kermit-server.sh"
      - "tools/wait-hp39-kermit-fetch.py"
      - "tools/run-hp48-kermit-send.sh"
      - "tools/hp48-kermit-watchdog.py"
      - "tools/hp-rpl-string-wrap.py"
      - "tools/bootstrap-hp39-aplet.sh"
      - "tools/package-hp39-aplet.sh"
      - "tools/prepare-hp39-aplet.py"
      - ".github/actions/setup-atfe/**"
      - ".github/actions/setup-x50ng/**"
      - ".github/workflows/e2e-object-mutation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build object-mutation / ${{ matrix.family }}
    runs-on: home-docker
    strategy:
      fail-fast: false
      matrix:
        family: [hp39, hp48, hp4950]
    env:
      FAMILY: ${{ matrix.family }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Arm Toolchain for Embedded
        uses: ./.github/actions/setup-atfe
      - name: Build object-mutation payload and launchers
        run: |
          chmod +x tools/build-e2e.sh
          tools/build-e2e.sh object-mutation "$GITHUB_WORKSPACE/build/e2e-object" "$FAMILY"
      - name: Upload object-mutation build
        uses: actions/upload-artifact@v7
        with:
          name: e2e-object-mutation-${{ matrix.family }}-build
          retention-days: 1
          path: |
            build/e2e-object/e2e.hpc
            build/e2e-object/e2e.result-address
            build/e2e-object/e2e.stock-lifecycle.json
            build/e2e-object/launchers/*.bin
            build/e2e-object/launchers/*.hp
            build/e2e-object/stock-fixtures/*.hp
          if-no-files-found: error

  x50ng:
    name: Prepare universal x50ng
    runs-on: home-docker
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Restore or build universal x50ng
        uses: ./.github/actions/setup-x50ng
      - name: Pack universal x50ng
        run: tar -C build/x50ng -czf build/x50ng-universal.tar.gz dist
      - name: Upload universal x50ng
        uses: actions/upload-artifact@v7
        with:
          name: x50ng-universal
          retention-days: 1
          path: build/x50ng-universal.tar.gz
          if-no-files-found: error

  stock-assets:
    name: Prepare object Stock assets
    needs: build
    runs-on: home-docker
    steps:
      - uses: actions/checkout@v7
      - name: Download object-mutation build
        uses: actions/download-artifact@v7
        with:
          name: e2e-object-mutation-hp39-build
          path: build/e2e
      - name: Restore HPGCC39 asset cache
        uses: actions/cache@v6
        with:
          path: .cache/hp39-aplet
          key: hpclang-hpgcc39-aplet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap-hp39-aplet.sh', 'tools/prepare-hp39-aplet.py') }}
      - name: Restore hpcalc asset cache
        uses: actions/cache@v6
        with:
          path: .cache/hpcalc
          key: hpclang-hpcalc-static-v1
      - name: Install asset preparation dependency on cache miss
        run: |
          if [[ ! -f .cache/hp39-aplet/sdk/.hpclang-prepared ]] && \
             ! command -v innoextract >/dev/null 2>&1; then
            bash tools/install-ci-packages.sh innoextract
          fi
      - name: Prepare Stock assets
        run: bash tests/e2e/harness/prepare-stock-assets.sh build/e2e build/assets
      - name: Upload object Stock assets
        uses: actions/upload-artifact@v7
        with:
          name: e2e-object-stock-assets
          retention-days: 1
          path: build/assets/
          if-no-files-found: error

  stock:
    name: Stock / ${{ matrix.family }}
    needs: [build, x50ng, stock-assets]
    runs-on: home-docker
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        family: [hp39, hp48, hp4950]
    env:
      FAMILY: ${{ matrix.family }}
      HPCLANG_E2E_REQUIRE_KEYBOARD: 0
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Download object-mutation build
        uses: actions/download-artifact@v7
        with:
          name: e2e-object-mutation-${{ matrix.family }}-build
          path: build/e2e
      - name: Download universal x50ng
        uses: actions/download-artifact@v7
        with:
          name: x50ng-universal
          path: build
      - name: Unpack universal x50ng
        run: |
          mkdir -p build/x50ng
          tar -xzf build/x50ng-universal.tar.gz -C build/x50ng
      - name: Download object Stock assets
        uses: actions/download-artifact@v7
        with:
          name: e2e-object-stock-assets
          path: build/assets
      - name: Prepare platform runtime
        run: bash tests/e2e/harness/setup-runtime.sh stock "$FAMILY"
      - name: Execute Stock family
        run: bash tests/e2e/harness/run-family.sh stock "$FAMILY" build/e2e build/assets
      - name: Generate object-mutation evidence
        if: always()
        continue-on-error: true
        run: |
          targets_file="build/stock-$FAMILY-targets.txt"
          [[ -f "$targets_file" ]] || exit 0
          while IFS= read -r TARGET; do
            [[ -n "$TARGET" ]] || continue
            export TARGET
            python3 tests/e2e/report.py tests/e2e/specs/object-mutation.json \
              --image-out "build/$TARGET-summary.png" \
              --image-only
            python3 tests/e2e/report.py tests/e2e/specs/object-mutation.json \
              >> "$GITHUB_STEP_SUMMARY"
          done < "$targets_file"
      - name: Upload object-mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.family }}-stock-object-mutation-e2e
          retention-days: 14
          path: |
            build/*-*.pgm
            build/*-*.pgm.png
            build/*-*.json
            build/*-kermit*
            build/*-socat.log
            build/*-lifecycle-*.log
            build/*-summary.png
            build/stock-${{ matrix.family }}-targets.txt
            build/e2e/e2e.hpc
          if-no-files-found: warn
