name: E2E / Stock

on:
  workflow_dispatch:
  push:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "tests/hp39-visible-smoke.c"
      - "tests/hp39-runtime-diag.c"
      - "tests/x50ng/stock-launcher-main.c"
      - "tests/e2e/sequences/**"
      - "tests/x50ng/headless-ui-init.h"
      - "tools/probe-atfe.sh"
      - "tools/prepare-x50ng.py"
      - "tools/fetch-x50ng.sh"
      - ".github/actions/setup-atfe/**"
      - ".github/actions/setup-apt/**"
      - "tools/armtoolbox-wrap.py"
      - "tools/inspect-armtoolbox-envelope.py"
      - "tools/pgm-to-summary.py"
      - ".github/workflows/e2e-stock.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stock-launcher:
    name: hp50g
    runs-on: home-docker
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup host build dependencies
        uses: ./.github/actions/setup-apt
        with:
          packages: >-
            build-essential git pkg-config unzip curl wget xz-utils python3
            libglib2.0-dev libgtk-4-dev libncurses-dev liblua5.4-dev

      - name: Setup Arm Toolchain for Embedded
        uses: ./.github/actions/setup-atfe

      - name: Build canonical HP50g stock payload
        run: |
          export OUT="$GITHUB_WORKSPACE/build/stock-payload"
          chmod +x tools/probe-atfe.sh tools/armtoolbox-wrap.py
          tools/probe-atfe.sh
          $ATFE/bin/clang --target=arm-none-eabi -march=armv4t -marm \
            -DHPCLANG_STAGE0_MODEL=6 -c platform/armtoolbox/stage0.S \
            -o build/stock-payload/stage0-hp50g.o
          $ATFE/bin/ld.lld -m armelf -T platform/armtoolbox/stage0.ld \
            build/stock-payload/stage0-hp50g.o \
            build/stock-payload/stage0-bundle.o \
            -o build/stock-payload/stage0-hp50g.elf
          $ATFE/bin/llvm-objcopy -O binary \
            build/stock-payload/stage0-hp50g.elf \
            build/stock-payload/stage0-hp50g.bin
          python3 tools/armtoolbox-wrap.py \
            build/stock-payload/stage0-hp50g.bin \
            build/stock-payload/HPCLANG.HP

      - name: Restore hpcalc download cache
        uses: actions/cache@v4
        with:
          path: .cache/hpcalc
          key: hpclang-hpcalc-static-v1

      - name: Prepare ARMToolbox installer
        run: |
          mkdir -p .cache/hpcalc build/stock-sd build/stock-reference
          if [ ! -f .cache/hpcalc/mlreg.zip ]; then
            curl -fL --retry 3 --retry-delay 2 \
              https://www.hpcalc.org/hp49/math/statistic/mlreg.zip \
              -o .cache/hpcalc/mlreg.zip
          fi
          unzip -jo .cache/hpcalc/mlreg.zip SETUP.BIN -d build/stock-sd
          unzip -jo .cache/hpcalc/mlreg.zip mlreg.hp -d build/stock-reference
          test "$(stat -c %s build/stock-sd/SETUP.BIN)" = 7673
          sha256sum build/stock-sd/SETUP.BIN
          test "$(stat -c %s build/stock-reference/mlreg.hp)" = 21914

      - name: Validate ARMToolbox transfer envelopes
        run: |
          python3 tools/inspect-armtoolbox-envelope.py \
            build/stock-reference/mlreg.hp \
            build/stock-payload/HPCLANG.HP \
            | tee build/armtoolbox-envelope-reference.jsonl

      - name: Restore x50ng build cache
        id: x50ng-cache
        uses: actions/cache@v4
        with:
          path: build/x50ng/dist
          key: hpclang-x50ng-stock-hp50g-${{ runner.os }}-${{ runner.arch }}-003533d9-dist-v1-${{ hashFiles('tools/prepare-x50ng.py', 'tools/fetch-x50ng.sh', 'tests/x50ng/stock-launcher-main.c', 'tests/x50ng/headless-ui-init.h') }}
          save-always: true

      - name: Fetch and adapt pinned x50ng
        if: steps.x50ng-cache.outputs.cache-hit != 'true'
        run: tools/fetch-x50ng.sh build/x50ng tests/x50ng/stock-launcher-main.c hp4950

      - name: Build x50ng
        if: steps.x50ng-cache.outputs.cache-hit != 'true'
        working-directory: build/x50ng
        run: make -j2 WITH_SDL=no WITH_SDL2=no LUA_VERSION=lua5.4

      - name: Record x50ng source
        run: printf '%s\n' 003533d9eca3f6ded36c6ab80b8dbc0563e31d9a > build/x50ng-stock-source.txt
      - name: Fetch official 49g+/50g firmware
        working-directory: build/x50ng
        run: make -C dist/firmware bootloaders official

      - name: Install ARMToolbox through stock File Manager
        run: |
          export HPCLANG_STOCK_MODE=install
          export HPCLANG_E2E_SEQUENCE="$GITHUB_WORKSPACE/tests/e2e/sequences/hp50g-stock-install.seq"
          export HPCLANG_STOCK_PREFIX="$GITHUB_WORKSPACE/build/stock-install"
          export HPCLANG_STOCK_JSON="$GITHUB_WORKSPACE/build/stock-install.json"
          mkdir -p build/stock-state
          timeout 30s build/x50ng/dist/x50ng \
            --datadir="$GITHUB_WORKSPACE/build/stock-state" \
            --overwrite-config \
            --style="$GITHUB_WORKSPACE/build/x50ng/dist/style-50g.css" \
            --sd-dir="$GITHUB_WORKSPACE/build/stock-sd" \
            --flash \
            --bootloader="$GITHUB_WORKSPACE/build/x50ng/dist/firmware/boot-50g.bin" \
            --firmware="$GITHUB_WORKSPACE/build/x50ng/dist/firmware/hp4950v215/2MB_FIX/2MB_215f.bin"
          for pgm in build/stock-install-*.pgm; do
            [ -f "$pgm" ] || continue
            python3 tools/pgm-to-png.py "$pgm" "$pgm.png"
          done
          cat build/stock-install.json

      - name: Execute HPCLANG.HP through stock ARMToolbox PrRUN
        run: |
          rm -f build/stock-sd/SETUP.BIN
          cp build/stock-payload/HPCLANG.HP build/stock-sd/

          export HPCLANG_STOCK_MODE=run
          export HPCLANG_E2E_SEQUENCE="$GITHUB_WORKSPACE/tests/e2e/sequences/hp50g-stock-run.seq"
          export HPCLANG_STOCK_RESULT_ADDR="$(cat "$GITHUB_WORKSPACE/build/stock-payload/hp39-visible.result-address")"
          export HPCLANG_STOCK_PREFIX="$GITHUB_WORKSPACE/build/stock-run"
          export HPCLANG_STOCK_JSON="$GITHUB_WORKSPACE/build/stock-run.json"

          timeout 30s build/x50ng/dist/x50ng \
            --datadir="$GITHUB_WORKSPACE/build/stock-state" \
            --style="$GITHUB_WORKSPACE/build/x50ng/dist/style-50g.css" \
            --sd-dir="$GITHUB_WORKSPACE/build/stock-sd"

          for pgm in build/stock-run-*.pgm; do
            [ -f "$pgm" ] || continue
            python3 tools/pgm-to-png.py "$pgm" "$pgm.png"
          done
          cat build/stock-run.json

      - name: Add LCD evidence to job summary
        if: always()
        run: |
          python3 tools/pgm-to-summary.py \
            --heading "HP50g stock ARMToolbox E2E" \
            --json build/stock-install.json \
            --json build/stock-run.json \
            build/stock-install-files.pgm \
            build/stock-install-sd.pgm \
            build/stock-install-copy.pgm \
            build/stock-install-home-after-copy.pgm \
            build/stock-install-vars.pgm \
            build/stock-install-installed.pgm \
            build/stock-run-files.pgm \
            build/stock-run-sd.pgm \
            build/stock-run-lib.pgm \
            build/stock-run-port2.pgm \
            build/stock-run-armtoolbox.pgm \
            build/stock-run-pass.pgm \
            build/stock-run-returned.pgm \
            build/stock-run-failure.pgm \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stock launcher evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x50ng-stock-armtoolbox-e2e
          path: |
            build/stock-install-*
            build/stock-install.json
            build/stock-run-*
            build/stock-run.json
            build/x50ng-stock-source.txt
            build/stock-payload/HPCLANG.HP
            build/stock-payload/hp39-visible.result-address
            build/armtoolbox-envelope-reference.jsonl
          if-no-files-found: warn
