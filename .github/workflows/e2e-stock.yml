name: E2E / Stock launch

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "cmake/**"
      - "tests/e2e/CMakeLists.txt"
      - "tests/e2e/main.c"
      - "tests/e2e/cpp.cpp"
      - "tests/e2e/targets/**"
      - "tests/e2e/sequences/**"
      - "tests/e2e/specs/stock-*.json"
      - "tests/e2e/verify.py"
      - "tests/e2e/report.py"
      - "tests/e2e/harness/run-stock*.sh"
      - "tests/e2e/harness/run-family.sh"
      - "tests/e2e/harness/setup-runtime.sh"
      - "tests/e2e/harness/prepare-stock-assets.sh"
      - "tests/e2e/harness/x50ng/**"
      - "tools/build-e2e.sh"
      - "tools/hpclang-pack.py"
      - "tools/armtoolbox-wrap.py"
      - "tools/e2e-target-env.py"
      - "tools/prepare-x50ng.py"
      - "tools/prepare-hp48gii-nor.py"
      - "tools/fetch-x50ng.sh"
      - "tools/run-hp39-kermit-server.sh"
      - "tools/run-hp48-kermit-send.sh"
      - "tools/hp39-fixture-key.py"
      - "tools/package-hp39-aplet.sh"
      - "tools/bootstrap-hp39-aplet.sh"
      - "tools/prepare-hp39-aplet.py"
      - "tools/pgm-to-png.py"
      - "tools/pgm-to-summary.py"
      - "tools/publish-ci-image.sh"
      - ".github/actions/setup-atfe/**"
      - ".github/actions/setup-x50ng/**"
      - ".github/workflows/e2e-stock.yml"
  pull_request:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "cmake/**"
      - "tests/e2e/CMakeLists.txt"
      - "tests/e2e/main.c"
      - "tests/e2e/cpp.cpp"
      - "tests/e2e/targets/**"
      - "tests/e2e/sequences/**"
      - "tests/e2e/specs/stock-*.json"
      - "tests/e2e/verify.py"
      - "tests/e2e/report.py"
      - "tests/e2e/harness/run-stock*.sh"
      - "tests/e2e/harness/run-family.sh"
      - "tests/e2e/harness/setup-runtime.sh"
      - "tests/e2e/harness/prepare-stock-assets.sh"
      - "tests/e2e/harness/x50ng/**"
      - "tools/build-e2e.sh"
      - "tools/hpclang-pack.py"
      - "tools/armtoolbox-wrap.py"
      - "tools/e2e-target-env.py"
      - "tools/prepare-x50ng.py"
      - "tools/prepare-hp48gii-nor.py"
      - "tools/fetch-x50ng.sh"
      - "tools/run-hp39-kermit-server.sh"
      - "tools/run-hp48-kermit-send.sh"
      - "tools/hp39-fixture-key.py"
      - "tools/package-hp39-aplet.sh"
      - "tools/bootstrap-hp39-aplet.sh"
      - "tools/prepare-hp39-aplet.py"
      - "tools/pgm-to-png.py"
      - "tools/pgm-to-summary.py"
      - ".github/actions/setup-atfe/**"
      - ".github/actions/setup-x50ng/**"
      - ".github/workflows/e2e-stock.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Stock E2E
    runs-on: home-docker
    steps:
      - uses: actions/checkout@v7

      - name: Setup Arm Toolchain for Embedded
        uses: ./.github/actions/setup-atfe

      - name: Build one Stock HPC1 and all launchers
        run: |
          chmod +x tools/build-e2e.sh
          tools/build-e2e.sh stock "$GITHUB_WORKSPACE/build/e2e-stock"

      - name: Upload Stock build
        uses: actions/upload-artifact@v7
        with:
          name: e2e-stock-build
          retention-days: 1
          path: |
            build/e2e-stock/e2e.hpc
            build/e2e-stock/e2e.result-address
            build/e2e-stock/launchers/*.hp
          if-no-files-found: error

  assets:
    name: Prepare shared Stock assets
    needs: build
    runs-on: home-docker
    steps:
      - uses: actions/checkout@v7

      - name: Download Stock build
        uses: actions/download-artifact@v7
        with:
          name: e2e-stock-build
          path: build/e2e

      - name: Restore HPGCC39 asset cache
        uses: actions/cache@v6
        with:
          path: .cache/hp39-aplet
          key: hpclang-hpgcc39-aplet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap-hp39-aplet.sh', 'tools/prepare-hp39-aplet.py') }}

      - name: Restore hpcalc asset cache
        uses: actions/cache@v6
        with:
          path: .cache/hpcalc
          key: hpclang-hpcalc-static-v1

      - name: Install asset preparation dependency
        run: |
          if ! command -v innoextract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends innoextract
          fi

      - name: Prepare shared Stock assets
        run: bash tests/e2e/harness/prepare-stock-assets.sh build/e2e build/assets

      - name: Upload shared Stock assets
        uses: actions/upload-artifact@v7
        with:
          name: e2e-stock-assets
          retention-days: 1
          path: build/assets/
          if-no-files-found: error

  family:
    name: Stock / ${{ matrix.family }}
    needs: [build, assets]
    runs-on: home-docker
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        family: [hp39, hp48, hp4950]
    env:
      FAMILY: ${{ matrix.family }}

    steps:
      - uses: actions/checkout@v7

      - name: Download Stock build
        uses: actions/download-artifact@v7
        with:
          name: e2e-stock-build
          path: build/e2e

      - name: Download shared Stock assets
        uses: actions/download-artifact@v7
        with:
          name: e2e-stock-assets
          path: build/assets

      - name: Prepare x50ng family
        uses: ./.github/actions/setup-x50ng
        with:
          mode: stock
          family: ${{ matrix.family }}

      - name: Prepare platform runtime
        run: bash tests/e2e/harness/setup-runtime.sh stock "$FAMILY"

      - name: Execute Stock family
        run: bash tests/e2e/harness/run-family.sh stock "$FAMILY" build/e2e build/assets

      - name: Generate and publish LCD evidence
        if: always()
        run: |
          targets_file="build/stock-$FAMILY-targets.txt"
          [[ -f "$targets_file" ]] || exit 0
          while IFS= read -r TARGET; do
            [[ -n "$TARGET" ]] || continue
            export TARGET
            SPEC="tests/e2e/specs/stock-$FAMILY.json"
            python3 tests/e2e/report.py "$SPEC" \
              --image-out "build/$TARGET-summary.png" \
              --image-only
            if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
              chmod +x tools/publish-ci-image.sh
              tools/publish-ci-image.sh \
                "build/$TARGET-summary.png" \
                "stock-launch/$GITHUB_RUN_ID/$TARGET.png"
            fi
            args=("$SPEC")
            if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
              args+=(--image-url "https://github.com/$GITHUB_REPOSITORY/blob/ci-evidence/stock-launch/$GITHUB_RUN_ID/$TARGET.png?raw=1")
            fi
            python3 tests/e2e/report.py "${args[@]}" >> "$GITHUB_STEP_SUMMARY"
          done < "$targets_file"

      - name: Upload Stock E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.family }}-stock-launch-e2e
          retention-days: 14
          path: |
            build/*-*.pgm
            build/*-*.pgm.png
            build/*-*.json
            build/*-kermit*
            build/*-socat.log
            build/*-fixture-key.txt
            build/*-setup.bin
            build/*-summary.png
            build/*-send/*
            build/stock-${{ matrix.family }}-targets.txt
            build/e2e/launchers/*.hp
          if-no-files-found: warn
