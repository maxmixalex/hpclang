name: Historical HPGCC archaeology

on:
  workflow_dispatch:
  push:
    paths:
      - research/trigger.txt
      - .github/workflows/historical-archaeology.yml
      - tools/analyze-hpgcc-tags.py

permissions:
  contents: write

concurrency:
  group: historical-hpgcc-archaeology
  cancel-in-progress: true

jobs:
  archaeology:
    runs-on: home-docker
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Subversion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends subversion

      - name: Export official SourceForge tags
        run: |
          rm -rf /tmp/hpgcc11 /tmp/hpgcc20
          svn export --force https://svn.code.sf.net/p/hpgcc/code/tags/frozen_1.1_MMU_trunk /tmp/hpgcc11
          svn export --force https://svn.code.sf.net/p/hpgcc/code/tags/frozen_2.0_VC_release /tmp/hpgcc20

      - name: Analyze historical trees
        run: |
          rm -rf research/generated
          mkdir -p research/generated
          python3 tools/analyze-hpgcc-tags.py /tmp/hpgcc11 /tmp/hpgcc20 research/generated

      - name: Inspect 2.0 VC packer constants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/hpgcc20/elf2hp/elf2hp.c")
          lines = p.read_text(errors="replace").splitlines()
          needles = (
              "0A94C", "0a94c", "01220000", "01101000",
              "1024", "2048", "virtual", "VIRTUAL",
              "3176B34C", "0x40000000", "0x4a800400",
          )
          for i, line in enumerate(lines, 1):
              if any(n in line for n in needles):
                  lo = max(1, i - 4)
                  hi = min(len(lines), i + 5)
                  print(f"--- {lo}:{hi} around line {i} ---")
                  for n in range(lo, hi + 1):
                      print(f"{n:5}: {lines[n-1]}")
          PY

      - name: Run modern Clang probes
        run: |
          {
            echo '# Modern Clang probe'
            echo
            echo '## Version'
            echo '~~~'
            clang --version
            echo '~~~'
            echo
            echo '## Old required flag: -ffixed-r10'
            echo '~~~'
            printf 'int f(int x){return x+1;}\n' >/tmp/fixed.c
            clang --target=arm-none-eabi -march=armv4t -marm -ffixed-r10 -c /tmp/fixed.c -o /tmp/fixed.o 2>&1 || true
            echo '~~~'
            echo
            echo '## APCS GNU ABI support'
            echo '~~~'
            clang --target=arm-none-eabi -march=armv4t -marm -mabi=apcs-gnu -c /tmp/fixed.c -o /tmp/apcs.o 2>&1
            file /tmp/apcs.o
            echo '~~~'
            echo
            echo '## PIC codegen'
            echo '~~~asm'
            printf '%s\n' \
              'extern int ext;' \
              'int glob=3;' \
              'int f(int x){ return ext + glob + x; }' >/tmp/pic.c
            clang --target=arm-none-eabi -march=armv4t -marm -O2 -fPIC -S /tmp/pic.c -o -
            echo '~~~'
          } > research/generated/clang-probe.md

      - name: Commit generated research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "research: analyze official HPGCC 1.1 and 2.0 tags"
            git pull --rebase origin main
            git push
          fi
