name: Debug / HP39 pre-entry alias load

permissions:
  contents: read
  actions: read

on:
  push:
    paths:
      - ".github/workflows/debug-hp39-preentry.yml"

concurrency:
  group: hp39-preentry-alias-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: home-docker
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-atfe
      - name: Build compact Gallery with current bootstrap
        run: |
          mkdir -p build
          chmod +x tools/build-e2e.sh
          tools/build-e2e.sh font-gallery-stock "$GITHUB_WORKSPACE/build/e2e"
      - uses: actions/upload-artifact@v7
        with:
          name: hp39-preentry-gallery
          retention-days: 1
          path: |
            build/e2e/e2e.hpc
            build/e2e/e2e.elf
            build/e2e/e2e.result-address
            build/e2e/launchers/*.bin
          if-no-files-found: error

  hp39:
    needs: build
    runs-on: home-docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: hp39-preentry-gallery
          path: build/e2e
      - name: Reuse diagnostic x50ng from run 34696549755
        uses: actions/download-artifact@v7
        with:
          name: x50ng-universal
          path: build
          repository: zyf722/hpclang
          run-id: 34696549755
          github-token: ${{ github.token }}
      - run: |
          mkdir -p build/x50ng
          tar -xzf build/x50ng-universal.tar.gz -C build/x50ng
          bash tests/e2e/harness/setup-runtime.sh direct hp39
      - name: Classify pre-entry alias load
        run: bash tests/e2e/harness/run-gallery-family.sh hp39 build/e2e
      - name: Upload fault evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hp39-preentry-alias-fault
          retention-days: 1
          path: |
            build/*-e2e.json
            build/*-before.pgm
          if-no-files-found: warn
