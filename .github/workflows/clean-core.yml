name: Clean core

on:
  push:
    paths:
      - "runtime/core/**"
      - "include/hpclang/abi.h"
      - "tests/core-smoke.c"
      - "tools/hpclang-pack.py"
      - "tools/probe-core.sh"
      - "cmake/profiles/hpclang-v1.cmake"
      - ".github/workflows/clean-core.yml"
  pull_request:
    paths:
      - "runtime/core/**"
      - "include/hpclang/abi.h"
      - "tests/core-smoke.c"
      - "tools/hpclang-pack.py"
      - "tools/probe-core.sh"
      - "cmake/profiles/hpclang-v1.cmake"
      - ".github/workflows/clean-core.yml"

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld llvm

      - name: Build unified image
        env:
          CC: clang
          LD: ld.lld
          READELF: llvm-readelf
          OBJDUMP: llvm-objdump
        run: |
          chmod +x tools/probe-core.sh tools/hpclang-pack.py
          tools/probe-core.sh

      - name: Verify HPC1 header
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          p = Path("build/core-probe/hpclang-v1.hpc").read_bytes()
          magic, image_size, entry, rw_static = struct.unpack_from("<4sIII", p)
          assert magic == b"HPC1"
          assert image_size == len(p) - 16
          assert entry < image_size
          assert rw_static >= 4
          print(
              f"PASS HPC1: image={image_size}, "
              f"entry=0x{entry:x}, rw_static={rw_static}"
          )
          PY
