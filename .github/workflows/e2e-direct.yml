name: E2E / Direct runtime

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "cmake/**"
      - "tests/e2e/CMakeLists.txt"
      - "tests/e2e/main.c"
      - "tests/e2e/cpp.cpp"
      - "tests/e2e/targets/**"
      - "tests/e2e/specs/direct.json"
      - "tests/e2e/verify.py"
      - "tests/e2e/report.py"
      - "tests/e2e/harness/run-direct.sh"
      - "tests/e2e/harness/run-family.sh"
      - "tests/e2e/harness/setup-runtime.sh"
      - "tests/e2e/harness/x50ng/**"
      - "tools/build-e2e.sh"
      - "tools/hpclang-pack.py"
      - "tools/armtoolbox-wrap.py"
      - "tools/e2e-target-env.py"
      - "tools/prepare-x50ng.py"
      - "tools/prepare-hp48gii-nor.py"
      - "tools/fetch-x50ng.sh"
      - "tools/pgm-to-png.py"
      - "tools/pgm-to-summary.py"
      - "tools/publish-ci-image.sh"
      - ".github/actions/setup-atfe/**"
      - ".github/actions/setup-x50ng/**"
      - ".github/workflows/e2e-direct.yml"
  pull_request:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "cmake/**"
      - "tests/e2e/CMakeLists.txt"
      - "tests/e2e/main.c"
      - "tests/e2e/cpp.cpp"
      - "tests/e2e/targets/**"
      - "tests/e2e/specs/direct.json"
      - "tests/e2e/verify.py"
      - "tests/e2e/report.py"
      - "tests/e2e/harness/run-direct.sh"
      - "tests/e2e/harness/run-family.sh"
      - "tests/e2e/harness/setup-runtime.sh"
      - "tests/e2e/harness/x50ng/**"
      - "tools/build-e2e.sh"
      - "tools/hpclang-pack.py"
      - "tools/armtoolbox-wrap.py"
      - "tools/e2e-target-env.py"
      - "tools/prepare-x50ng.py"
      - "tools/prepare-hp48gii-nor.py"
      - "tools/fetch-x50ng.sh"
      - "tools/pgm-to-png.py"
      - "tools/pgm-to-summary.py"
      - ".github/actions/setup-atfe/**"
      - ".github/actions/setup-x50ng/**"
      - ".github/workflows/e2e-direct.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Direct E2E
    runs-on: home-docker
    steps:
      - uses: actions/checkout@v7

      - name: Setup Arm Toolchain for Embedded
        uses: ./.github/actions/setup-atfe

      - name: Build one Direct HPC1 and all launchers
        run: |
          chmod +x tools/build-e2e.sh
          tools/build-e2e.sh direct "$GITHUB_WORKSPACE/build/e2e-direct"

      - name: Upload Direct build
        uses: actions/upload-artifact@v7
        with:
          name: e2e-direct-build
          retention-days: 1
          path: |
            build/e2e-direct/e2e.hpc
            build/e2e-direct/e2e.result-address
            build/e2e-direct/launchers/*.bin
          if-no-files-found: error

  family:
    name: Direct / ${{ matrix.family }}
    needs: build
    runs-on: home-docker
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        family: [hp39, hp48, hp4950]
    env:
      FAMILY: ${{ matrix.family }}

    steps:
      - uses: actions/checkout@v7

      - name: Download Direct build
        uses: actions/download-artifact@v7
        with:
          name: e2e-direct-build
          path: build/e2e

      - name: Prepare x50ng family
        uses: ./.github/actions/setup-x50ng
        with:
          mode: direct
          family: ${{ matrix.family }}

      - name: Prepare platform runtime
        run: bash tests/e2e/harness/setup-runtime.sh direct "$FAMILY"

      - name: Execute Direct family
        run: bash tests/e2e/harness/run-family.sh direct "$FAMILY" build/e2e

      - name: Generate and publish LCD evidence
        if: always()
        continue-on-error: true
        run: |
          targets_file="build/direct-$FAMILY-targets.txt"
          [[ -f "$targets_file" ]] || exit 0
          while IFS= read -r TARGET; do
            [[ -n "$TARGET" ]] || continue
            export TARGET
            python3 tests/e2e/report.py tests/e2e/specs/direct.json \
              --image-out "build/$TARGET-summary.png" \
              --image-only
            if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
              chmod +x tools/publish-ci-image.sh
              tools/publish-ci-image.sh \
                "build/$TARGET-summary.png" \
                "direct-runtime/$GITHUB_RUN_ID/$TARGET.png"
            fi
            args=(tests/e2e/specs/direct.json)
            if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
              args+=(--image-url "https://github.com/$GITHUB_REPOSITORY/blob/ci-evidence/direct-runtime/$GITHUB_RUN_ID/$TARGET.png?raw=1")
            fi
            python3 tests/e2e/report.py "${args[@]}" >> "$GITHUB_STEP_SUMMARY"
          done < "$targets_file"

      - name: Upload Direct E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.family }}-direct-runtime-e2e
          retention-days: 14
          path: |
            build/*-*.pgm
            build/*-*.pgm.png
            build/*-e2e.json
            build/*-summary.png
            build/direct-${{ matrix.family }}-targets.txt
            build/e2e/launchers/*.bin
            build/e2e/e2e.hpc
          if-no-files-found: warn
