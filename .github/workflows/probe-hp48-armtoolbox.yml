name: Probe / HP48 ARMToolbox

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-hp48-armtoolbox.yml"

jobs:
  probe:
    runs-on: home-docker
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install extractor
        run: |
          if ! command -v innoextract >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends innoextract; fi
      - name: Extract HPGCC 1.1-p1
        run: |
          chmod +x tools/bootstrap-hp39-aplet.sh
          tools/bootstrap-hp39-aplet.sh >/dev/null
          ROOT=.cache/hp39-aplet/raw
          mkdir -p build
          echo '=== paths containing ARMToolbox / source48 / 48g ==='
          find "$ROOT" -type f | grep -Ei 'ARMToolbox|source48|48g' | sort | tee build/hp48-armtoolbox-paths.txt
          echo '=== candidate fingerprints ==='
          python3 - <<'PY' | tee build/hp48-armtoolbox-fingerprints.txt
          from pathlib import Path
          import hashlib
          root=Path('.cache/hp39-aplet/raw')
          keys=('masd_source48','ARMToolbox48','SETUP.BIN','TBXLIB','ARMJMP','PRFIX','PRLNK','SYSMEM.ARM')
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              s=str(p)
              if any(k.lower() in s.lower() or k.lower()==p.name.lower() for k in keys):
                  b=p.read_bytes()
                  print(f'{p.relative_to(root)}\t{len(b)}\t{hashlib.sha256(b).hexdigest()}')
          PY
          mkdir -p build/hp48-armtoolbox-source
          find "$ROOT" -type f \( -path '*masd_source48*' -o -iname '*48*' \) -size -128k -print0 | while IFS= read -r -d '' f; do
            rel=${f#"$ROOT"/}; safe=$(printf '%s' "$rel" | tr '/ ' '__'); cp "$f" "build/hp48-armtoolbox-source/$safe";
          done
      - name: Upload probe
        uses: actions/upload-artifact@v7
        with:
          name: hp48-armtoolbox-probe
          retention-days: 1
          path: |
            build/hp48-armtoolbox-paths.txt
            build/hp48-armtoolbox-fingerprints.txt
            build/hp48-armtoolbox-source/
          if-no-files-found: error
