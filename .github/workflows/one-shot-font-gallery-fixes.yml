name: Maintenance / One-shot font gallery fixes

on:
  push:
    branches:
      - m7-fonts-gallery
    paths:
      - ".github/workflows/one-shot-font-gallery-fixes.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: home-docker
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Apply bitmap-only importer and Gallery fixes
        run: python3 .github/scripts/one-shot-font-gallery-fixes.py

      - name: Validate patched sources
        run: |
          python3 -m py_compile \
            tools/hpclang-font.py \
            tools/regenerate-font-assets.py \
            tools/render-font-audit-cn.py \
            tests/e2e/report.py \
            tools/pgm-to-summary.py
          python3 tools/hpclang-font.py --package runtime/fonts/fonts.zip verify
          git diff --check
          git status --short

      - name: Commit fixes and self-delete
        run: |
          rm -f \
            .github/workflows/one-shot-font-gallery-fixes.yml \
            .github/scripts/one-shot-font-gallery-fixes.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fonts: harden bitmap Gallery evidence"
          git fetch origin m7-fonts-gallery
          git rebase origin/m7-fonts-gallery
          git push origin HEAD:m7-fonts-gallery
