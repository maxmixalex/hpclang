name: Maintenance / One-shot font docs sync

on:
  push:
    branches: [m7-fonts-gallery]
    paths: [.github/workflows/one-shot-font-doc-sync.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: home-docker
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Synchronize bitmap-only font status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [Path('docs/development')/n for n in (
              'roadmap.md','api-reference.md','e2e.md','validation.md','hpgcc-compat.md'
          )]
          files.append(Path('tests/e2e/font-gallery/README.md'))

          replacements = {
              '275 faces / 1,772,082 glyph mappings': '242 faces / 1,597,680 glyph mappings',
              '275 generated faces': '242 generated faces',
              '275 generated': '242 generated',
              '275/275': '242/242',
              '277 entries / 554 captures': '244 entries / 488 captures',
              '277 entries': '244 entries',
              '554 captures': '488 captures',
              '34743437279 / #47 (attempt 2)': '34748303030 / #49',
              '34743437279 / #47, attempt 2': '34748303030 / #49',
              '34743437279 / #47': '34748303030 / #49',
              '34698825657` / #42': '34748303030` / #49',
              'production Gallery #42': 'production Gallery #49',
              'targeted HP39 exhaustive 310/620 each': 'HP39 Direct Gallery 244/488 on both HP39gs and HP40gs',
              'HP48 compact live-native Gallery still open': 'HP48 live-native evidence PASS; visible Stock return remains `return-unsettled`',
              'Stock Gallery / hp50g': 'Stock / hp4950',
              'Stock native-font evidence / hp48gii': 'Stock / hp48',
              'BDF, TTF, FON, and newRPL BMP+TXT source parsing': 'BDF, FON, and newRPL BMP+TXT source parsing for the canonical bitmap-only bundle',
              'Retained TTF families still require the final human curation decision before the font slice is merged.': 'Canonical bundled assets are bitmap-source only; the remaining TTF importer itself is scheduled for removal before merge.',
              'compact HP48gII Stock Gallery now closes the 64-line live-native evidence item, including nonblank/distinct native probes and a visible stock return.': 'compact HP48gII Stock Gallery closes the 64-line live-native font evidence item with nonblank/distinct native probes and HPC1 PASS; visible Stock return remains a separate `return-unsettled` gate.',
          }

          current = '''### Current bitmap-only font closure status (2026-09-13)

          Canonical bundled assets are bitmap-source only. The generated catalog is **242 faces / 1,597,680 mapped glyphs / 3,386 assembly sources** with **242/242** source-to-generated parity; `CI / Font Assets` run **34748326228 / #20** is green and regeneration produces no drift.

          `E2E / Font Gallery` run **34748303030 / #49** is green. Direct traverses **244 entries (242 generated + 2 native) × 2 pages = 488 captures per target** on HP39gs, HP40gs, HP48gII, HP49g+, and HP50g. HP48 Stock reaches HPC1 PASS with distinct nonblank native-mini/native-main/generated-control captures, while visible return remains `return-unsettled`.

          Before merge: remove the TTF importer; normalize hp48/hp4950 Stock summaries and add the missing HP39 Direct summary; replace weak generic Gallery specimen text with repertoire/design-sensitive samples; evaluate Cubic-11, Fusion Pixel Font, ChillBitmap, and May7/QuanPixel; rerun Font Assets and Gallery after asset/rendering changes.
          '''
          current = '\n'.join(line.lstrip() for line in current.splitlines()).strip() + '\n'

          for p in files:
              t = p.read_text()
              for old, new in replacements.items():
                  t = t.replace(old, new)
              t = re.sub(r'\n### Curated font package evidence \(2026-09-13\)\n.*\Z', '\n', t, flags=re.S)
              t = re.sub(r'\n### Current bitmap-only font closure status \(2026-09-13\)\n.*\Z', '\n', t, flags=re.S)
              if p.name == 'README.md':
                  extra = '''\n## Closure work still required\n\n- remove the TTF importer and rasterizer-only dependencies/tests/docs;\n- normalize Direct/Stock summary structure, include all concern-owned Stock evidence, and add the missing HP39 Direct summary;\n- use repertoire/design-sensitive specimens instead of one weak generic phrase;\n- evaluate Cubic-11, Fusion Pixel Font, ChillBitmap, and May7/QuanPixel as bitmap-source candidates.\n'''
                  t = t.rstrip() + extra
              t = t.rstrip() + '\n\n' + current
              p.write_text(t)

          stale = ['1,772,082','277 entries','554 captures','34743437279','production Gallery #42','Retained TTF families still require']
          for p in files:
              t = p.read_text()
              bad = [x for x in stale if x in t]
              if bad:
                  raise SystemExit(f'{p}: stale font status remains: {bad}')
          PY

          git diff --check
          grep -R "242 faces / 1,597,680" docs/development tests/e2e/font-gallery/README.md >/dev/null
          grep -R "34748303030 / #49" docs/development tests/e2e/font-gallery/README.md >/dev/null

      - name: Commit docs and self-delete
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-font-doc-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A docs/development tests/e2e/font-gallery/README.md .github/workflows/one-shot-font-doc-sync.yml
          git commit -m "docs: synchronize bitmap-only font closure"
          git push origin HEAD:m7-fonts-gallery
