name: HP39 40 canonical ARM E2E

on:
  workflow_dispatch:
  push:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "tests/hp39-visible-smoke.c"
      - "tests/hp39-runtime-diag.c"
      - "tests/x50ng/e2e-main.c"
      - "tools/probe-atfe.sh"
      - ".github/workflows/x50ng-little-apple-e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: hp39gs
            model: 2
            archive: hp39gs222.zip
            member: HP39GS_2.22/hp39gs_v2.22.bin
          - target: hp40gs
            model: 3
            archive: hp40gs222.zip
            member: HP40GS_2.22/hp40gs_v2.22.bin

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential git pkg-config unzip curl xz-utils \
            libglib2.0-dev libgtk-4-dev libncurses-dev liblua5.4-dev

      - name: Install Arm Toolchain for Embedded 22.1.0
        run: |
          curl -L https://github.com/arm/arm-toolchain/releases/download/release-22.1.0-ATfE/ATfE-22.1.0-Linux-x86_64.tar.xz -o /tmp/atfe.tar.xz
          mkdir -p /tmp/atfe
          tar -xJf /tmp/atfe.tar.xz -C /tmp/atfe --strip-components=1

      - name: Build canonical HPC1 and ${{ matrix.target }} stage0
        env:
          MODEL: ${{ matrix.model }}
        run: |
          export ATFE=/tmp/atfe
          export OUT="$GITHUB_WORKSPACE/build/little-e2e"
          chmod +x tools/probe-atfe.sh
          tools/probe-atfe.sh

          /tmp/atfe/bin/clang --target=arm-none-eabi -march=armv4t -marm \
            -DHPCLANG_STAGE0_MODEL="$MODEL" \
            -c platform/armtoolbox/stage0.S \
            -o build/little-e2e/stage0.o
          /tmp/atfe/bin/ld.lld -m armelf -T platform/armtoolbox/stage0.ld \
            build/little-e2e/stage0.o build/little-e2e/stage0-bundle.o \
            -o build/little-e2e/stage0.elf
          /tmp/atfe/bin/llvm-objcopy -O binary \
            build/little-e2e/stage0.elf build/little-e2e/stage0.bin

      - name: Fetch and adapt pinned x50ng
        env:
          TARGET: ${{ matrix.target }}
        run: |
          git clone --no-checkout https://github.com/gwenhael-le-moine/x50ng.git build/x50ng
          git -C build/x50ng checkout ac1e1e24827aa9c66e020baa47bb253746c037b5
          git -C build/x50ng rev-parse HEAD > build/x50ng-little-e2e-source.txt
          cp tests/x50ng/e2e-main.c build/x50ng/src/main.c

          python3 - <<'PY'
          from pathlib import Path

          flash = Path("build/x50ng/src/flash.c")
          s = flash.read_text()
          old = 'memcmp( phys_ram_base + flash->offset + BOOT_SIZE, "KINPOUPDATEIMAGE", 16 ) != 0'
          new = '''memcmp( phys_ram_base + flash->offset + BOOT_SIZE, "KINPOUPDATEIMAGE", 16 ) != 0 &&
                         memcmp( phys_ram_base + flash->offset + BOOT_SIZE, "KINPOHP39G+IMAGE", 16 ) != 0 &&
                         memcmp( phys_ram_base + flash->offset + BOOT_SIZE, "KINPOHP40G+IMAGE", 16 ) != 0'''
          if old not in s:
              raise SystemExit("x50ng firmware-header check changed")
          flash.write_text(s.replace(old, new, 1))

          module = Path("build/x50ng/src/module.c")
          s = module.read_text()
          needle = "    phys_ram_base = mmap( 0, phys_ram_size, PROT_NONE,"
          if needle not in s:
              raise SystemExit("x50ng init_modules layout changed")
          module.write_text(s.replace(
              needle,
              "    /* hpclang Little-Apple E2E reserved RAM. */\n"
              "    phys_ram_size += 0x00100000;\n\n" + needle,
              1))
          PY

      - name: Build x50ng
        working-directory: build/x50ng
        run: make -j2 WITH_SDL=no WITH_SDL2=no LUA_VERSION=lua5.4

      - name: Fetch bootloader and official ${{ matrix.target }} ROM
        env:
          ARCHIVE: ${{ matrix.archive }}
          MEMBER: ${{ matrix.member }}
        run: |
          make -C build/x50ng/dist/firmware bootloaders
          curl -L "https://www.hpcalc.org/hp39/pc/$ARCHIVE" -o "/tmp/$ARCHIVE"
          unzip -p "/tmp/$ARCHIVE" "$MEMBER" > build/little-apple.bin
          sha256sum build/little-apple.bin

      - name: Execute canonical HPC1 on ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          export HPCLANG_X50NG_STAGE0="$GITHUB_WORKSPACE/build/little-e2e/stage0.bin"
          export HPCLANG_X50NG_RESULT_ADDR="$(cat "$GITHUB_WORKSPACE/build/little-e2e/hp39-visible.result-address")"
          export HPCLANG_X50NG_BEFORE_PGM="$GITHUB_WORKSPACE/build/$TARGET-before.pgm"
          export HPCLANG_X50NG_PASS_PGM="$GITHUB_WORKSPACE/build/$TARGET-pass.pgm"
          export HPCLANG_X50NG_RETURN_PGM="$GITHUB_WORKSPACE/build/$TARGET-return.pgm"
          export HPCLANG_X50NG_E2E_JSON="$GITHUB_WORKSPACE/build/$TARGET-e2e.json"

          mkdir -p "build/$TARGET-state"
          timeout 35s build/x50ng/dist/x50ng \
            --datadir="$GITHUB_WORKSPACE/build/$TARGET-state" \
            --overwrite-config \
            --style="$GITHUB_WORKSPACE/build/x50ng/dist/style-40g.css" \
            --flash-full \
            --bootloader="$GITHUB_WORKSPACE/build/x50ng/dist/firmware/boot-50g.bin" \
            --firmware="$GITHUB_WORKSPACE/build/little-apple.bin"

          for pgm in build/$TARGET-*.pgm; do
            [ -f "$pgm" ] || continue
            python tools/pgm-to-png.py "$pgm" "$pgm.png"
          done
          cat "build/$TARGET-e2e.json"

      - name: Upload ${{ matrix.target }} canonical E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-canonical-arm-e2e
          path: |
            build/${{ matrix.target }}-*.pgm
            build/${{ matrix.target }}-*.pgm.png
            build/${{ matrix.target }}-e2e.json
            build/x50ng-little-e2e-source.txt
            build/little-e2e/stage0.bin
            build/little-e2e/hp39-visible.hpc
          if-no-files-found: warn
