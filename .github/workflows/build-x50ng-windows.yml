name: Build / x50ng Windows GUI

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-x50ng-windows.yml"

permissions:
  contents: read

jobs:
  windows-gui:
    name: Windows x64 GUI
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Configure Git line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v7

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            zip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-ncurses
            mingw-w64-ucrt-x86_64-lua
            mingw-w64-ucrt-x86_64-mman-win32

      - name: Fetch pinned x50ng
        run: |
          git clone --no-checkout https://codeberg.org/gwh/x50ng.git x50ng
          git -C x50ng checkout 003533d9eca3f6ded36c6ab80b8dbc0563e31d9a
          git -C x50ng submodule update --init --recursive
          printf '%s\n' 003533d9eca3f6ded36c6ab80b8dbc0563e31d9a > x50ng-source.txt

      - name: Apply Windows host portability patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          block = Path("x50ng/src/s3c2410/block.c")
          text = block.read_text()
          if "#include <windows.h>" not in text:
              prefix = """#ifdef _WIN32
          #pragma push_macro("DATADIR")
          #pragma push_macro("VERSION_MAJOR")
          #pragma push_macro("VERSION_MINOR")
          #pragma push_macro("PATCHLEVEL")
          #undef DATADIR
          #undef VERSION_MAJOR
          #undef VERSION_MINOR
          #undef PATCHLEVEL
          #include <windows.h>
          #pragma pop_macro("PATCHLEVEL")
          #pragma pop_macro("VERSION_MINOR")
          #pragma pop_macro("VERSION_MAJOR")
          #pragma pop_macro("DATADIR")
          #endif
          """
              text = prefix + text
          block.write_text(text)

          hdw = Path("x50ng/src/hdw.h")
          text = hdw.read_text()
          old = "#include <sys/times.h>"
          new = """#ifdef _WIN32
          #include <time.h>
          struct tms {
              clock_t tms_utime;
              clock_t tms_stime;
              clock_t tms_cutime;
              clock_t tms_cstime;
          };
          static inline clock_t hpclang_host_times(struct tms *buffer)
          {
              clock_t now = clock();
              if (buffer) {
                  buffer->tms_utime = now;
                  buffer->tms_stime = 0;
                  buffer->tms_cutime = 0;
                  buffer->tms_cstime = 0;
              }
              return now;
          }
          #define times hpclang_host_times
          #else
          #include <sys/times.h>
          #endif"""
          if old not in text:
              raise SystemExit("x50ng hdw.h times.h anchor changed")
          hdw.write_text(text.replace(old, new, 1))

          rtc = Path("x50ng/src/s3c2410/s3c2410_rtc.c")
          text = rtc.read_text()
          old_call = "tm = localtime( &tv.tv_sec );"
          new_call = """time_t hpclang_host_time = (time_t)tv.tv_sec;
              tm = localtime( &hpclang_host_time );"""
          count = text.count(old_call)
          if count != 2:
              raise SystemExit(f"x50ng rtc localtime anchors changed: {count}")
          rtc.write_text(text.replace(old_call, new_call))

          fq = Path("x50ng/src/for_qemu.c")
          text = fq.read_text()
          if "hpclang_host_aligned_alloc" not in text:
              shim = """#ifdef _WIN32
          static void *hpclang_host_aligned_alloc(size_t alignment, size_t size)
          {
              size_t rounded = (size + alignment - 1) / alignment * alignment;
              return aligned_alloc(alignment, rounded);
          }
          #define memalign hpclang_host_aligned_alloc
          static void *hpclang_host_valloc(size_t size)
          {
              return hpclang_host_aligned_alloc(4096, size);
          }
          #define valloc hpclang_host_valloc
          #endif
          """
              text = shim + text
          fq.write_text(text)

          api = Path("x50ng/src/emulator_api.c")
          text = api.read_text()
          old_clock = "sysconf(_SC_CLK_TCK)"
          if old_clock not in text:
              raise SystemExit("x50ng emulator_api clock anchor changed")
          text = text.replace(
              old_clock,
              "(long)CLOCKS_PER_SEC" if "#ifdef _WIN32" not in text else old_clock,
              1,
          )
          if "(long)CLOCKS_PER_SEC" in text and "#include <time.h>" not in text:
              text = "#include <time.h>\n" + text
          api.write_text(text)
          PY

          grep -R -nE 'times\\(|struct tms|GetTempPath|GetTempFileName' x50ng/src | head -n 80 || true

      - name: Build x50ng GUI
        run: |
          grep -nE 'LDFLAGS|LDLIBS|LIBS|^LD' x50ng/Makefile || true
          make -C x50ng -j2 LDFLAGS="-lmman" LIBS="-lmman" LDLIBS="-lmman"

      - name: Inspect executable
        run: |
          find x50ng -maxdepth 2 -type f \( -name 'x50ng.exe' -o -name 'x50ng' \) -print
          exe="$(find x50ng -maxdepth 2 -type f -name 'x50ng.exe' | head -n1)"
          test -n "$exe"
          ldd "$exe"

      - name: Assemble portable package
        run: |
          set -euo pipefail
          exe="$(find x50ng -maxdepth 2 -type f -name 'x50ng.exe' | head -n1)"
          test -n "$exe"

          out="$GITHUB_WORKSPACE/x50ng-windows-x64"
          mkdir -p "$out"
          cp "$exe" "$out/x50ng.exe"
          cp x50ng-source.txt "$out/"

          for pattern in '*.css' '*.png' '*.lua'; do
            find x50ng -maxdepth 3 -type f -name "$pattern" -exec cp -n {} "$out/" \; || true
          done

          # Recursively copy UCRT64 DLL dependencies reported by ldd.
          copied=1
          while [ "$copied" -ne 0 ]; do
            copied=0
            for binary in "$out"/*.exe "$out"/*.dll; do
              [ -e "$binary" ] || continue
              while IFS= read -r dll; do
                [ -f "$dll" ] || continue
                base="$(basename "$dll")"
                case "$dll" in
                  /ucrt64/bin/*)
                    if [ ! -e "$out/$base" ]; then
                      cp "$dll" "$out/$base"
                      copied=1
                    fi
                    ;;
                esac
              done < <(ldd "$binary" | awk '{for (i=1;i<=NF;i++) if ($i ~ /^\/ucrt64\/bin\/.*\.dll$/) print $i}')
            done
          done

          cat > "$out/README.txt" <<'EOF'
          x50ng Windows GUI build for hpclang HP50g launch testing

          Source:
            https://codeberg.org/gwh/x50ng
          Pinned commit:
            003533d9eca3f6ded36c6ab80b8dbc0563e31d9a

          This package contains x50ng and its MSYS2/UCRT64 runtime DLLs.
          HP firmware/ROM files are not redistributed in this package.

          Current ARMToolbox installation check:
            1. Put the HP50g in RPN mode.
            2. Put SETUP.BIN on the emulated SD card.
            3. The historical x49gp HPGCC2 instructions say:
                 2
                 SETUP.BIN
                 3
                 ->TAG
                 RCL
                 EVAL
                 ON+C (warmstart)
            4. Open RS+LIB and inspect port 2.
            5. Success means ARMToolbox/library 275 appears.

          Please report exactly what appears after each step if the sequence differs.
          EOF

          (cd "$GITHUB_WORKSPACE" && zip -9r x50ng-windows-x64.zip x50ng-windows-x64)

      - name: Upload Windows GUI package
        uses: actions/upload-artifact@v7
        with:
          name: x50ng-windows-x64
          path: x50ng-windows-x64.zip
          if-no-files-found: error
