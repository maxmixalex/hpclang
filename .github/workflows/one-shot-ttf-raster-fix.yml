name: Maintenance / One-shot TTF raster fix

on:
  push:
    branches:
      - m7-fonts-gallery
    paths:
      - ".github/workflows/one-shot-ttf-raster-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: home-docker
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Patch TTF raster policy and baseline handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          font = Path('tools/hpclang-font.py')
          text = font.read_text(encoding='utf-8')

          old = '''def _num(s: str) -> int:\n    s = s.strip()\n    if len(s) >= 2 and s[0] == s[-1] == '\"':\n        s = s[1:-1]\n    return int(s, 0)\n\n\nclass Package:\n'''
          new = '''def _num(s: str) -> int:\n    s = s.strip()\n    if len(s) >= 2 and s[0] == s[-1] == '\"':\n        s = s[1:-1]\n    return int(s, 0)\n\n\ndef load_ttf_raster_policy(path) -> dict[str, int]:\n    path = Path(path)\n    if not path.exists():\n        return {}\n    raw = json.loads(path.read_text(encoding=\"utf-8\"))\n    if raw.get(\"schema\") != \"hpclang-ttf-raster-v1\":\n        raise ValueError(f\"{path}: unsupported TTF raster policy schema\")\n    faces = raw.get(\"faces\")\n    if not isinstance(faces, dict):\n        raise ValueError(f\"{path}: faces must be an object\")\n    result: dict[str, int] = {}\n    for source, entry in faces.items():\n        if not isinstance(source, str) or not isinstance(entry, dict):\n            raise ValueError(f\"{path}: invalid TTF raster policy entry\")\n        ppem = entry.get(\"ppem\")\n        if not isinstance(ppem, int) or not 1 <= ppem <= 128:\n            raise ValueError(f\"{path}: {source}: ppem must be an integer in 1..128\")\n        result[source] = ppem\n    return result\n\n\ndef ttf_raster_size(pkg, source: str) -> int:\n    policy = getattr(pkg, \"ttf_raster_policy\", {})\n    try:\n        return int(policy[source])\n    except KeyError as exc:\n        raise ValueError(\n            f\"{source}: no explicit TTF raster PPEM; add it to runtime/fonts/ttf-raster.json\"\n        ) from exc\n\n\nclass Package:\n'''
          assert old in text, 'helper insertion anchor changed'
          text = text.replace(old, new, 1)

          old = '''        self.files = {entry[\"path\"]: entry for entry in self.manifest[\"files\"]}\n\n    def data(self, path):\n'''
          new = '''        self.files = {entry[\"path\"]: entry for entry in self.manifest[\"files\"]}\n        self.ttf_raster_policy = load_ttf_raster_policy(\n            self.path.with_name(\"ttf-raster.json\")\n        )\n\n    def data(self, path):\n'''
          assert old in text, 'Package policy anchor changed'
          text = text.replace(old, new, 1)

          old = '''            mask, (x0, y0) = font.getmask2(ch, mode=\"1\")\n            adv = round(font.getlength(ch))\n'''
          new = '''            # Use an explicit left-baseline anchor.  Pillow's historical default\n            # horizontal anchor is left-ascender; spelling the baseline out here\n            # makes the conversion to BDF-style y_offset direct and testable.\n            mask, (x0, y0) = font.getmask2(ch, mode=\"1\", anchor=\"ls\")\n            adv = round(font.getlength(ch))\n'''
          assert old in text, 'Pillow mask anchor changed'
          text = text.replace(old, new, 1)

          old = '''            x0,\n            asc - (y0 + gh),\n            bytes(bits),\n'''
          new = '''            x0,\n            -(y0 + gh),\n            bytes(bits),\n'''
          assert old in text, 'TTF y_offset anchor changed'
          text = text.replace(old, new, 1)

          old = '''    if ext == \".ttf\":\n        cps = _ttf_codepoints(data)\n        chosen = cps if mode == \"FULL\" else [cp for cp in cps if cp in (requested or set())]\n        return raster_pil(data, path, size=12, codepoints=chosen, fmt=\"ttf\")\n'''
          new = '''    if ext == \".ttf\":\n        cps = _ttf_codepoints(data)\n        chosen = cps if mode == \"FULL\" else [cp for cp in cps if cp in (requested or set())]\n        return raster_pil(\n            data,\n            path,\n            size=ttf_raster_size(pkg, path),\n            codepoints=chosen,\n            fmt=\"ttf\",\n        )\n'''
          assert old in text, 'TTF load_selected anchor changed'
          text = text.replace(old, new, 1)
          font.write_text(text, encoding='utf-8')

          regen = Path('tools/regenerate-font-assets.py')
          text = regen.read_text(encoding='utf-8')
          old = '''        self.manifest = {\"schema\": \"hpclang-font-package-index-v1\", \"files\": entries}\n        self.files = {entry[\"path\"]: entry for entry in entries}\n\n    def data(self, path):\n'''
          new = '''        self.manifest = {\"schema\": \"hpclang-font-package-index-v1\", \"files\": entries}\n        self.files = {entry[\"path\"]: entry for entry in entries}\n        self.ttf_raster_policy = hf.load_ttf_raster_policy(\n            self.path.with_name(\"ttf-raster.json\")\n        )\n\n    def data(self, path):\n'''
          assert old in text, 'PackageView policy anchor changed'
          text = text.replace(old, new, 1)

          old = '''    package = PackageView(args.package)\n    rows = hf.catalog(package)\n'''
          new = '''    package = PackageView(args.package)\n    ttf_paths = {\n        entry[\"path\"]\n        for entry in package.fonts()\n        if str(entry.get(\"format\", \"\")).lower() == \"ttf\"\n    }\n    policy_paths = set(package.ttf_raster_policy)\n    missing_policy = sorted(ttf_paths - policy_paths)\n    stale_policy = sorted(policy_paths - ttf_paths)\n    if missing_policy or stale_policy:\n        details = []\n        if missing_policy:\n            details.append(\"missing TTF PPEM: \" + \", \".join(missing_policy))\n        if stale_policy:\n            details.append(\"stale TTF PPEM: \" + \", \".join(stale_policy))\n        raise SystemExit(\"; \".join(details))\n\n    rows = hf.catalog(package)\n'''
          assert old in text, 'regenerator validation anchor changed'
          text = text.replace(old, new, 1)

          old = '''            \"nominal_advance\": font.nominal_advance,\n            \"sources\": sources,\n        }\n'''
          new = '''            \"nominal_advance\": font.nominal_advance,\n            \"sources\": sources,\n        }\n        if row.get(\"format\") == \"ttf\":\n            record[\"raster_ppem\"] = hf.ttf_raster_size(package, row[\"path\"])\n'''
          assert old in text, 'catalog raster_ppem anchor changed'
          text = text.replace(old, new, 1)
          regen.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate and validate font assets
        run: |
          python3 -m venv build/font-fix-venv
          build/font-fix-venv/bin/pip install --disable-pip-version-check Pillow fonttools
          build/font-fix-venv/bin/python tools/regenerate-font-assets.py --package runtime/fonts/fonts.zip
          build/font-fix-venv/bin/python tools/audit-font-assets.py \
            --archive runtime/fonts/fonts.zip \
            --generated runtime/fonts/generated \
            --json build/font-fix-audit.json \
            --text build/font-fix-audit.txt \
            --html build/font-fix-audit.html
          build/font-fix-venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('runtime/fonts/generated/catalog.json').read_text(encoding='utf-8'))
          policy = json.loads(Path('runtime/fonts/ttf-raster.json').read_text(encoding='utf-8'))['faces']
          ttf = [face for face in catalog['faces'] if face.get('format') == 'ttf']
          assert len(ttf) == len(policy) == 35, (len(ttf), len(policy))
          for face in ttf:
              assert face['raster_ppem'] == policy[face['path']]['ppem'], face['path']
          assert len(catalog['faces']) == 275
          print('PASS: 35 TTF faces use explicit PPEM; total faces=275')
          PY
          git diff --check

      - name: Upload corrected visual audit
        uses: actions/upload-artifact@v7
        with:
          name: ttf-raster-fix-audit
          retention-days: 7
          path: |
            build/font-fix-audit.json
            build/font-fix-audit.txt
            build/font-fix-audit.html

      - name: Commit fix and regenerated catalog
        run: |
          rm .github/workflows/one-shot-ttf-raster-fix.yml
          git add -A tools/hpclang-font.py tools/regenerate-font-assets.py runtime/fonts/generated .github/workflows/one-shot-ttf-raster-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: rasterize TTF fonts at declared pixel sizes"
          git fetch origin m7-fonts-gallery
          git rebase origin/m7-fonts-gallery
          git push origin HEAD:m7-fonts-gallery
