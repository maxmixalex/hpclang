name: Debug / HP39 Gallery alias

permissions:
  contents: read

on:
  push:
    paths:
      - ".github/workflows/debug-hp39-gallery-alias.yml"

concurrency:
  group: hp39-gallery-alias-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: home-docker
    steps:
      - uses: actions/checkout@v7
      - name: Setup Arm Toolchain for Embedded
        uses: ./.github/actions/setup-atfe
      - name: Build exhaustive Gallery
        run: |
          mkdir -p build
          chmod +x tools/build-e2e.sh
          tools/build-e2e.sh font-gallery "$GITHUB_WORKSPACE/build/e2e"
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-font-gallery-build
          retention-days: 1
          path: |
            build/e2e/e2e.hpc
            build/e2e/e2e.elf
            build/e2e/e2e.result-address
            build/e2e/launchers/*.bin
          if-no-files-found: error

  x50ng:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Prepare diagnostic x50ng
        uses: ./.github/actions/setup-x50ng
      - run: tar -C build/x50ng -czf build/x50ng-universal.tar.gz dist
      - uses: actions/upload-artifact@v7
        with:
          name: x50ng-universal
          retention-days: 1
          path: build/x50ng-universal.tar.gz
          if-no-files-found: error

  hp39:
    needs: [build, x50ng]
    runs-on: home-docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: e2e-font-gallery-build
          path: build/e2e
      - uses: actions/download-artifact@v7
        with:
          name: x50ng-universal
          path: build
      - run: |
          mkdir -p build/x50ng
          tar -xzf build/x50ng-universal.tar.gz -C build/x50ng
          bash tests/e2e/harness/setup-runtime.sh direct hp39
      - name: Capture HP39 alias failure site
        run: bash tests/e2e/harness/run-gallery-family.sh hp39 build/e2e
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hp39-gallery-alias-debug
          retention-days: 1
          path: |
            build/*-e2e.json
            build/*-before.pgm
            build/gallery-hp39-targets.txt
          if-no-files-found: warn
