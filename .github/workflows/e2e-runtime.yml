name: E2E / Runtime

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "runtime/fonts/generated/**"
      - "platform/armtoolbox/**"
      - "include/**"
      - "cmake/**"
      - "tests/e2e/**"
      - "tools/build-e2e.sh"
      - "tools/hpclang-pack.py"
      - "tools/armtoolbox-wrap.py"
      - "tools/e2e-target-env.py"
      - "tools/prepare-x50ng.py"
      - "tools/prepare-hp48gii-nor.py"
      - "tools/fetch-x50ng.sh"
      - "tools/run-hp39-kermit-server.sh"
      - "tools/wait-hp39-kermit-fetch.py"
      - "tools/run-hp48-kermit-send.sh"
      - "tools/hp48-kermit-watchdog.py"
      - "tools/hp-rpl-string-wrap.py"
      - "tools/package-hp39-aplet.sh"
      - "tools/bootstrap-hp39-aplet.sh"
      - "tools/prepare-hp39-aplet.py"
      - "tools/pgm-to-png.py"
      - "tools/publish-ci-evidence.sh"
      - ".github/actions/setup-atfe/**"
      - ".github/actions/setup-x50ng/**"
      - ".github/workflows/e2e-runtime.yml"
  pull_request:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "runtime/fonts/generated/**"
      - "platform/armtoolbox/**"
      - "include/**"
      - "cmake/**"
      - "tests/e2e/**"
      - "tools/build-e2e.sh"
      - "tools/hpclang-pack.py"
      - "tools/armtoolbox-wrap.py"
      - "tools/e2e-target-env.py"
      - "tools/prepare-x50ng.py"
      - "tools/prepare-hp48gii-nor.py"
      - "tools/fetch-x50ng.sh"
      - "tools/run-hp39-kermit-server.sh"
      - "tools/wait-hp39-kermit-fetch.py"
      - "tools/run-hp48-kermit-send.sh"
      - "tools/hp48-kermit-watchdog.py"
      - "tools/hp-rpl-string-wrap.py"
      - "tools/package-hp39-aplet.sh"
      - "tools/bootstrap-hp39-aplet.sh"
      - "tools/prepare-hp39-aplet.py"
      - "tools/pgm-to-png.py"
      - "tools/publish-ci-evidence.sh"
      - ".github/actions/setup-atfe/**"
      - ".github/actions/setup-x50ng/**"
      - ".github/workflows/e2e-runtime.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build canonical runtime E2E
    runs-on: home-docker
    steps:
      - uses: actions/checkout@v7

      - name: Setup Arm Toolchain for Embedded
        uses: ./.github/actions/setup-atfe

      - name: Build canonical E2E payload and launchers
        run: |
          chmod +x tools/build-e2e.sh
          tools/build-e2e.sh runtime "$GITHUB_WORKSPACE/build/e2e-runtime"

      - name: Upload canonical runtime build
        uses: actions/upload-artifact@v7
        with:
          name: e2e-runtime-build
          retention-days: 1
          path: |
            build/e2e-runtime/e2e.hpc
            build/e2e-runtime/e2e.result-address
            build/e2e-runtime/launchers/*.bin
            build/e2e-runtime/launchers/*.hp
          if-no-files-found: error

  x50ng:
    name: Prepare universal x50ng
    runs-on: home-docker
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore or build universal x50ng
        uses: ./.github/actions/setup-x50ng

      - name: Pack universal x50ng
        run: tar -C build/x50ng -czf build/x50ng-universal.tar.gz dist

      - name: Upload universal x50ng
        uses: actions/upload-artifact@v7
        with:
          name: x50ng-universal
          retention-days: 1
          path: build/x50ng-universal.tar.gz
          if-no-files-found: error

  stock-assets:
    name: Prepare shared Stock assets
    needs: build
    runs-on: home-docker
    steps:
      - uses: actions/checkout@v7

      - name: Download canonical runtime build
        uses: actions/download-artifact@v7
        with:
          name: e2e-runtime-build
          path: build/e2e

      - name: Restore HPGCC39 asset cache
        uses: actions/cache@v6
        with:
          path: .cache/hp39-aplet
          key: hpclang-hpgcc39-aplet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap-hp39-aplet.sh', 'tools/prepare-hp39-aplet.py') }}

      - name: Restore hpcalc asset cache
        uses: actions/cache@v6
        with:
          path: .cache/hpcalc
          key: hpclang-hpcalc-static-v1

      - name: Install asset preparation dependency on cache miss
        run: |
          if [[ ! -f .cache/hp39-aplet/sdk/.hpclang-prepared ]] && \
             ! command -v innoextract >/dev/null 2>&1; then
            sudo -E apt-get update -qq
            sudo -E apt-get install -y --no-install-recommends innoextract
          fi

      - name: Prepare shared Stock assets
        run: bash tests/e2e/harness/prepare-stock-assets.sh build/e2e build/assets

      - name: Upload shared Stock assets
        uses: actions/upload-artifact@v7
        with:
          name: e2e-stock-assets
          retention-days: 1
          path: build/assets/
          if-no-files-found: error

  direct:
    name: Direct / ${{ matrix.family }}
    needs: [build, x50ng]
    runs-on: home-docker
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        family: [hp39, hp48, hp4950]
    env:
      FAMILY: ${{ matrix.family }}

    steps:
      - uses: actions/checkout@v7

      - name: Download canonical runtime build
        uses: actions/download-artifact@v7
        with:
          name: e2e-runtime-build
          path: build/e2e

      - name: Download universal x50ng
        uses: actions/download-artifact@v7
        with:
          name: x50ng-universal
          path: build

      - name: Unpack universal x50ng
        run: |
          mkdir -p build/x50ng
          tar -xzf build/x50ng-universal.tar.gz -C build/x50ng

      - name: Prepare platform runtime
        run: bash tests/e2e/harness/setup-runtime.sh direct "$FAMILY"

      - name: Execute Direct family
        run: bash tests/e2e/harness/run-family.sh direct "$FAMILY" build/e2e

      - name: Generate canonical LCD evidence
        if: always()
        continue-on-error: true
        run: |
          targets_file="build/direct-$FAMILY-targets.txt"
          [[ -f "$targets_file" ]] || exit 0
          while IFS= read -r TARGET; do
            [[ -n "$TARGET" ]] || continue
            export TARGET
            python3 tests/e2e/report.py tests/e2e/specs/runtime.json \
              --image-out "build/$TARGET-summary.png" \
              --image-only
            args=(tests/e2e/specs/runtime.json)
            if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
              args+=(--image-url "https://github.com/$GITHUB_REPOSITORY/blob/ci-evidence/direct-runtime/$GITHUB_RUN_ID/$TARGET.png?raw=1")
            fi
            python3 tests/e2e/report.py "${args[@]}" >> "$GITHUB_STEP_SUMMARY"
          done < "$targets_file"

      - name: Upload Direct E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.family }}-direct-runtime-e2e
          retention-days: 14
          path: |
            build/*-*.pgm
            build/*-*.pgm.png
            build/*-e2e.json
            build/*-summary.png
            build/direct-${{ matrix.family }}-targets.txt
            build/e2e/e2e.hpc
          if-no-files-found: warn

  stock:
    name: Stock / ${{ matrix.family }}
    needs: [build, x50ng, stock-assets]
    runs-on: home-docker
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        family: [hp39, hp48, hp4950]
    env:
      FAMILY: ${{ matrix.family }}

    steps:
      - uses: actions/checkout@v7

      - name: Download canonical runtime build
        uses: actions/download-artifact@v7
        with:
          name: e2e-runtime-build
          path: build/e2e

      - name: Download universal x50ng
        uses: actions/download-artifact@v7
        with:
          name: x50ng-universal
          path: build

      - name: Unpack universal x50ng
        run: |
          mkdir -p build/x50ng
          tar -xzf build/x50ng-universal.tar.gz -C build/x50ng

      - name: Download shared Stock assets
        uses: actions/download-artifact@v7
        with:
          name: e2e-stock-assets
          path: build/assets

      - name: Prepare platform runtime
        run: bash tests/e2e/harness/setup-runtime.sh stock "$FAMILY"

      - name: Execute Stock family
        run: bash tests/e2e/harness/run-family.sh stock "$FAMILY" build/e2e build/assets

      - name: Generate canonical LCD evidence
        if: always()
        continue-on-error: true
        run: |
          targets_file="build/stock-$FAMILY-targets.txt"
          [[ -f "$targets_file" ]] || exit 0
          while IFS= read -r TARGET; do
            [[ -n "$TARGET" ]] || continue
            export TARGET
            python3 tests/e2e/report.py tests/e2e/specs/runtime.json \
              --image-out "build/$TARGET-summary.png" \
              --image-only
            args=(tests/e2e/specs/runtime.json)
            if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
              args+=(--image-url "https://github.com/$GITHUB_REPOSITORY/blob/ci-evidence/stock-runtime/$GITHUB_RUN_ID/$TARGET.png?raw=1")
            fi
            python3 tests/e2e/report.py "${args[@]}" >> "$GITHUB_STEP_SUMMARY"
          done < "$targets_file"

      - name: Upload Stock E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.family }}-stock-runtime-e2e
          retention-days: 14
          path: |
            build/*-*.pgm
            build/*-*.pgm.png
            build/*-*.json
            build/*-kermit*
            build/*-socat.log
            build/*-setup.bin
            build/*-summary.png
            build/*-send/*
            build/stock-${{ matrix.family }}-targets.txt
            build/e2e/e2e.hpc
          if-no-files-found: warn

  publish-evidence:
    name: Publish ci-evidence
    if: always() && !cancelled() && github.event_name != 'pull_request'
    needs: [direct, stock]
    runs-on: home-docker
    concurrency:
      group: ci-evidence-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Direct evidence artifacts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: "*-direct-runtime-e2e"
          path: build/publish/direct

      - name: Download Stock evidence artifacts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: "*-stock-runtime-e2e"
          path: build/publish/stock

      - name: Stage Runtime ci-evidence tree
        run: |
          set -euo pipefail
          mkdir -p build/publish/direct build/publish/stock
          direct_out="build/ci-evidence/direct-runtime/$GITHUB_RUN_ID"
          stock_out="build/ci-evidence/stock-runtime/$GITHUB_RUN_ID"
          mkdir -p "$direct_out" "$stock_out"

          find build/publish/direct -type f -name '*-summary.png' -print0 \
            | while IFS= read -r -d '' image; do
                base="$(basename "$image")"
                target="${base%-summary.png}"
                cp "$image" "$direct_out/$target.png"
              done

          find build/publish/stock -type f -name '*-summary.png' -print0 \
            | while IFS= read -r -d '' image; do
                base="$(basename "$image")"
                target="${base%-summary.png}"
                cp "$image" "$stock_out/$target.png"
              done

      - name: Publish Runtime ci-evidence in one commit
        continue-on-error: true
        run: |
          chmod +x tools/publish-ci-evidence.sh
          tools/publish-ci-evidence.sh build/ci-evidence
