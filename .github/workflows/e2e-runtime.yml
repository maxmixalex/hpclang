name: E2E / Runtime

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "examples/declarative-ui/**"
      - "examples/declarative-ui-cpp/**"
      - "examples/notebook/**"
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "runtime/fonts/generated/**"
      - "platform/armtoolbox/**"
      - "third_party/tinf/**"
      - "include/**"
      - "cmake/**"
      - "tests/e2e/**"
      - "!tests/e2e/object-mutation/**"
      - "!tests/e2e/object-composite/**"
      - "!tests/e2e/object-catalog/**"
      - "!tests/e2e/object-common/**"
      - "!tests/e2e/object-suites.json"
      - "!tests/e2e/specs/object-mutation.json"
      - "!tests/e2e/specs/object-composite.json"
      - "!tests/e2e/specs/object-catalog.json"
      - "tools/build-e2e.sh"
      - "tools/build-launchers.py"
      - "tools/install-ci-packages.sh"
      - "tools/hpclang-pack.py"
      - "tools/armtoolbox-wrap.py"
      - "tools/e2e-target-env.py"
      - "tools/e2e-target-matrix.py"
      - "tools/e2e-runtime-plan.py"
      - "tools/e2e-stock-media.py"
      - "tools/prepare-x50ng.py"
      - "tools/prepare-hp48gii-nor.py"
      - "tools/prepare-nor-fixture.py"
      - "tools/fetch-x50ng.sh"
      - "tools/build-ckermit.sh"
      - "tools/run-hp39-kermit-server.sh"
      - "tools/wait-hp39-kermit-fetch.py"
      - "tools/run-hp48-kermit-send.sh"
      - "tools/kermit_watchdog.py"
      - "tools/hp-rpl-string-wrap.py"
      - "tools/package-hp39-aplet.sh"
      - "tools/package-aplet.py"
      - "tools/bootstrap-hp39-aplet.sh"
      - "tools/prepare-hp39-aplet.py"
      - "tools/pgm-to-png.py"
      - "tools/publish-ci-evidence.sh"
      - ".github/actions/setup-atfe/**"
      - ".github/actions/setup-x50ng/**"
      - ".github/workflows/e2e-runtime.yml"
  pull_request:
    paths:
      - "examples/declarative-ui/**"
      - "examples/declarative-ui-cpp/**"
      - "examples/notebook/**"
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "runtime/fonts/generated/**"
      - "platform/armtoolbox/**"
      - "third_party/tinf/**"
      - "include/**"
      - "cmake/**"
      - "tests/e2e/**"
      - "!tests/e2e/object-mutation/**"
      - "!tests/e2e/object-composite/**"
      - "!tests/e2e/object-catalog/**"
      - "!tests/e2e/object-common/**"
      - "!tests/e2e/object-suites.json"
      - "!tests/e2e/specs/object-mutation.json"
      - "!tests/e2e/specs/object-composite.json"
      - "!tests/e2e/specs/object-catalog.json"
      - "tools/build-e2e.sh"
      - "tools/build-launchers.py"
      - "tools/install-ci-packages.sh"
      - "tools/hpclang-pack.py"
      - "tools/armtoolbox-wrap.py"
      - "tools/e2e-target-env.py"
      - "tools/e2e-target-matrix.py"
      - "tools/e2e-runtime-plan.py"
      - "tools/e2e-stock-media.py"
      - "tools/prepare-x50ng.py"
      - "tools/prepare-hp48gii-nor.py"
      - "tools/prepare-nor-fixture.py"
      - "tools/fetch-x50ng.sh"
      - "tools/build-ckermit.sh"
      - "tools/run-hp39-kermit-server.sh"
      - "tools/wait-hp39-kermit-fetch.py"
      - "tools/run-hp48-kermit-send.sh"
      - "tools/kermit_watchdog.py"
      - "tools/hp-rpl-string-wrap.py"
      - "tools/package-hp39-aplet.sh"
      - "tools/package-aplet.py"
      - "tools/bootstrap-hp39-aplet.sh"
      - "tools/prepare-hp39-aplet.py"
      - "tools/pgm-to-png.py"
      - "tools/publish-ci-evidence.sh"
      - ".github/actions/setup-atfe/**"
      - ".github/actions/setup-x50ng/**"
      - ".github/workflows/e2e-runtime.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Runtime suite payloads
    runs-on: ubuntu-24.04
    outputs:
      direct: ${{ steps.build.outputs.direct }}
      stock: ${{ steps.build.outputs.stock }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Arm Toolchain for Embedded
        uses: ./.github/actions/setup-atfe

      - name: Build suite payloads and launchers
        id: build
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          plan = json.loads(subprocess.check_output(
              ["python3", "tools/e2e-runtime-plan.py"], text=True))
          for build in plan["builds"]:
              subprocess.run(["bash", "tools/build-e2e.sh", build["mode"],
                              f"build/e2e/{build['artifact']}", build["family"],
                              build["model"]], check=True)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for context in ("direct", "stock"):
                  output.write(context + "=" + json.dumps(plan[context]) + "\n")
          PY

      - name: Upload suite builds
        uses: actions/upload-artifact@v7
        with:
          name: e2e-suite-builds
          retention-days: 1
          path: |
            build/e2e/*/e2e.hpc
            build/e2e/*/e2e.result-address
            build/e2e/*/e2e.stock-*.json
            build/e2e/*/launchers/*.bin
            build/e2e/*/launchers/*.hp
          if-no-files-found: error

  x50ng:
    name: Prepare universal x50ng
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore or build universal x50ng
        uses: ./.github/actions/setup-x50ng

      - name: Pack universal x50ng
        run: tar -C build/x50ng -czf build/x50ng-universal.tar.gz dist

      - name: Upload universal x50ng
        uses: actions/upload-artifact@v7
        with:
          name: x50ng-universal
          retention-days: 1
          path: build/x50ng-universal.tar.gz
          if-no-files-found: error

  stock-assets:
    name: Prepare Stock suite assets
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download suite builds
        uses: actions/download-artifact@v7
        with:
          name: e2e-suite-builds
          path: build/e2e

      - name: Restore HPGCC39 asset cache
        uses: actions/cache@v6
        with:
          path: .cache/hp39-aplet
          key: hpclang-hpgcc39-aplet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap-hp39-aplet.sh', 'tools/prepare-hp39-aplet.py') }}

      - name: Restore hpcalc asset cache
        uses: actions/cache@v6
        with:
          path: .cache/hpcalc
          key: hpclang-hpcalc-static-v1

      - name: Install asset preparation dependency on cache miss
        run: |
          if [[ ! -f .cache/hp39-aplet/sdk/.hpclang-prepared ]] && \
             ! command -v innoextract >/dev/null 2>&1; then
            bash tools/install-ci-packages.sh innoextract
          fi

      - name: Prepare suite Stock assets
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          plan = json.loads(subprocess.check_output(
              ["python3", "tools/e2e-runtime-plan.py"], text=True))
          for build in plan["builds"]:
              if not build["stock"]:
                  continue
              artifact = build["artifact"]
              subprocess.run(["bash", "tests/e2e/harness/prepare-stock-assets.sh",
                              f"build/e2e/{artifact}", f"build/assets/{artifact}"], check=True)
          PY

      - name: Upload suite Stock assets
        uses: actions/upload-artifact@v7
        with:
          name: e2e-stock-assets
          retention-days: 1
          path: build/assets/
          if-no-files-found: error

  direct:
    name: Direct / ${{ matrix.suite.mode }} / ${{ matrix.label }}
    needs: [build, x50ng]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.direct) }}
    env:
      FAMILY: ${{ matrix.family }}
      SUITE: ${{ matrix.suite.mode }}
      APPLICATION: ${{ matrix.suite.artifact }}
      HPCLANG_E2E_TARGET: ${{ matrix.model.target }}
      HPCLANG_E2E_REQUIRE_KEYBOARD: ${{ matrix.suite.keyboard && '1' || '0' }}

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Download suite builds
        uses: actions/download-artifact@v7
        with:
          name: e2e-suite-builds
          path: build/e2e

      - name: Download universal x50ng
        uses: actions/download-artifact@v7
        with:
          name: x50ng-universal
          path: build

      - name: Unpack universal x50ng
        run: |
          mkdir -p build/x50ng
          tar -xzf build/x50ng-universal.tar.gz -C build/x50ng

      - name: Prepare platform runtime
        run: bash tests/e2e/harness/setup-runtime.sh direct "$FAMILY"

      - name: Execute Direct family
        run: bash tests/e2e/harness/run-family.sh direct "$FAMILY" "build/e2e/$APPLICATION"

      - name: Verify suite-specific evidence
        if: matrix.suite.verifier != ''
        env:
          VERIFIER: ${{ matrix.suite.verifier }}
        run: python3 "$VERIFIER" direct "$FAMILY"

      - name: Generate suite LCD evidence
        if: always()
        continue-on-error: true
        run: |
          targets_file="build/direct-$FAMILY-targets.txt"
          [[ -f "$targets_file" ]] || exit 0
          while IFS= read -r TARGET; do
            [[ -n "$TARGET" ]] || continue
            export TARGET
            python3 tests/e2e/report.py tests/e2e/specs/runtime.json \
              --image-out "build/$TARGET-summary.png" \
              --image-only
            args=(tests/e2e/specs/runtime.json)
            if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
              args+=(--image-url "https://github.com/$GITHUB_REPOSITORY/blob/ci-evidence/direct-$SUITE/$GITHUB_RUN_ID/$TARGET.png?raw=1")
            fi
            python3 tests/e2e/report.py "${args[@]}" >> "$GITHUB_STEP_SUMMARY"
          done < "$targets_file"

      - name: Upload Direct E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}-direct-${{ matrix.suite.mode }}-e2e
          retention-days: 14
          path: |
            build/*-*.pgm
            build/*-*.pgm.png
            build/*-e2e.json
            build/*-frame-memory-*.json
            build/*-frame-*.lcd
            build/*-summary.png
            build/direct-${{ matrix.family }}-targets.txt
            build/e2e/${{ matrix.suite.artifact }}/e2e.hpc
          if-no-files-found: warn

  stock:
    name: Stock / ${{ matrix.suite.mode }} / ${{ matrix.model.target }}
    needs: [build, x50ng, stock-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.stock) }}
    env:
      FAMILY: ${{ matrix.model.family }}
      HPCLANG_E2E_TARGET: ${{ matrix.model.target }}
      SUITE: ${{ matrix.suite.mode }}
      APPLICATION: ${{ matrix.suite.artifact }}
      HPCLANG_E2E_REQUIRE_KEYBOARD: ${{ matrix.suite.keyboard && '1' || '0' }}
      HPCLANG_E2E_CAPTURE_STAGE_POOL: ${{ matrix.suite.mode == 'ui' && '1' || '0' }}

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Download suite builds
        uses: actions/download-artifact@v7
        with:
          name: e2e-suite-builds
          path: build/e2e

      - name: Download universal x50ng
        uses: actions/download-artifact@v7
        with:
          name: x50ng-universal
          path: build

      - name: Unpack universal x50ng
        run: |
          mkdir -p build/x50ng
          tar -xzf build/x50ng-universal.tar.gz -C build/x50ng

      - name: Download suite Stock assets
        uses: actions/download-artifact@v7
        with:
          name: e2e-stock-assets
          path: build/assets

      - name: Prepare platform runtime
        run: bash tests/e2e/harness/setup-runtime.sh stock "$FAMILY"

      - name: Execute Stock target
        # Raw-card witnesses use independent host FAT tools for preparation and verification.
        run: |
          if [[ -f "build/e2e/$APPLICATION/e2e.stock-media.json" ]]; then
            bash tools/install-ci-packages.sh dosfstools mtools
          fi
          bash tests/e2e/harness/run-family.sh stock "$FAMILY" "build/e2e/$APPLICATION" "build/assets/$APPLICATION"

      - name: Verify suite-specific evidence
        if: matrix.suite.verifier != ''
        env:
          VERIFIER: ${{ matrix.suite.verifier }}
        run: |
          args=(stock "$FAMILY")
          if [[ "$SUITE" == ui ]]; then
            args+=(--pool)
          fi
          python3 "$VERIFIER" "${args[@]}"

      - name: Generate suite LCD evidence
        if: always()
        continue-on-error: true
        run: |
          targets_file="build/stock-$FAMILY-targets.txt"
          [[ -f "$targets_file" ]] || exit 0
          while IFS= read -r TARGET; do
            [[ -n "$TARGET" ]] || continue
            export TARGET
            python3 tests/e2e/report.py tests/e2e/specs/runtime.json \
              --image-out "build/$TARGET-summary.png" \
              --image-only
            args=(tests/e2e/specs/runtime.json)
            if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
              args+=(--image-url "https://github.com/$GITHUB_REPOSITORY/blob/ci-evidence/stock-$SUITE/$GITHUB_RUN_ID/$TARGET.png?raw=1")
            fi
            python3 tests/e2e/report.py "${args[@]}" >> "$GITHUB_STEP_SUMMARY"
          done < "$targets_file"

      - name: Upload Stock E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.model.target }}-stock-${{ matrix.suite.mode }}-e2e
          retention-days: 14
          path: |
            build/*-*.pgm
            build/*-*.pgm.png
            build/*-*.json
            build/*-frame-*.lcd
            build/*-kermit*
            build/*-socat.log
            build/*-setup.bin
            build/*-summary.png
            build/*-send/*
            build/stock-${{ matrix.model.family }}-targets.txt
            build/*-stock-media.img
            build/*-code-relocation/**
            build/e2e/${{ matrix.suite.artifact }}/e2e.hpc
            build/e2e/${{ matrix.suite.artifact }}/e2e.stock-*.json
            build/e2e/${{ matrix.suite.artifact }}/launchers/memory.json
          if-no-files-found: warn

  publish-evidence:
    name: Publish ci-evidence
    if: always() && !cancelled() && github.event_name != 'pull_request'
    needs: [direct, stock]
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-evidence-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Direct evidence artifacts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: "*-direct-*-e2e"
          path: build/publish/direct

      - name: Download Stock evidence artifacts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: "*-stock-*-e2e"
          path: build/publish/stock

      - name: Stage suite evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil

          suites = json.loads(Path("tests/e2e/runtime-suites.json").read_text())
          for tier in ("direct", "stock"):
              for suite in suites:
                  mode = suite["mode"]
                  output = Path("build/ci-evidence") / f"{tier}-{mode}" / os.environ["GITHUB_RUN_ID"]
                  output.mkdir(parents=True, exist_ok=True)
                  for artifact in (Path("build/publish") / tier).glob(f"*-{tier}-{mode}-e2e"):
                      for image in artifact.rglob("*-summary.png"):
                          target = image.name.removesuffix("-summary.png")
                          shutil.copyfile(image, output / f"{target}.png")
          PY

      - name: Publish suite evidence in one commit
        continue-on-error: true
        run: |
          chmod +x tools/publish-ci-evidence.sh
          tools/publish-ci-evidence.sh build/ci-evidence
