name: Maintenance / Font assets

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - m7-fonts-gallery
    paths:
      - "runtime/fonts/fonts.zip"
      - "runtime/fonts/README.md"
      - "include/hpclang/font-package.h"
      - "cmake/fonts.cmake"
      - "tools/hpclang-font.py"
      - "tools/regenerate-font-assets.py"
      - ".github/workflows/font-assets.yml"

concurrency:
  group: font-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Verify and regenerate fonts
    runs-on: home-docker
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Materialize canonical font package
        run: |
          git lfs pull --include="runtime/fonts/fonts.zip" --exclude=""
          test "$(wc -c < runtime/fonts/fonts.zip)" -gt 1000000
          sha256sum runtime/fonts/fonts.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("runtime/fonts/fonts.zip") as archive:
              names = archive.namelist()
              manifests = [name for name in names if name.lower().endswith("manifest.json")]
              print("manifest candidates:")
              for name in manifests:
                  print("  ", name)
              print("first archive entries:")
              for name in names[:30]:
                  print("  ", name)
          PY

      - name: Prepare font maintenance environment
        run: |
          python3 -m venv build/font-venv
          build/font-venv/bin/python -m pip install --disable-pip-version-check Pillow fonttools

      - name: Verify and audit source package
        run: |
          PY=build/font-venv/bin/python
          "$PY" tools/hpclang-font.py --package runtime/fonts/fonts.zip verify
          "$PY" tools/hpclang-font.py --package runtime/fonts/fonts.zip audit
          "$PY" tools/hpclang-font.py --package runtime/fonts/fonts.zip catalog > build/font-source-catalog.json

      - name: Regenerate checked-in assembly assets
        run: |
          PY=build/font-venv/bin/python
          "$PY" tools/regenerate-font-assets.py \
            --package runtime/fonts/fonts.zip \
            --output-dir runtime/fonts/generated \
            --chunk-glyphs 512

      - name: Guard generated repository size
        run: |
          too_large="$(find runtime/fonts/generated -type f -size +90M -print)"
          if [[ -n "$too_large" ]]; then
            echo "Generated files above 90 MiB:" >&2
            echo "$too_large" >&2
            exit 1
          fi
          bytes="$(du -sb runtime/fonts/generated | cut -f1)"
          echo "Generated bytes: $bytes"
          if (( bytes > 314572800 )); then
            echo "Generated font assets exceed the 300 MiB repository guard." >&2
            exit 1
          fi
          git diff --check
          git status --short runtime/fonts/generated

      - name: Commit regenerated assets
        if: github.event_name == 'push'
        run: |
          git add -A runtime/fonts/generated
          if git diff --cached --quiet; then
            echo "Generated font assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate font assembly catalog"
          git push origin HEAD:m7-fonts-gallery
