name: Maintenance / Font assets

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - m7-fonts-gallery
    paths:
      - "runtime/fonts/fonts.zip"
      - "runtime/fonts/ttf-raster.json"
      - "tools/hpclang-font.py"
      - "tools/regenerate-font-assets.py"
      - "tools/audit-font-assets.py"
      - "tools/render-font-audit-cn.py"
      - ".github/workflows/font-assets.yml"

concurrency:
  group: font-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate fonts
    runs-on: home-docker
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Prepare font maintenance environment
        run: |
          python3 -m venv build/font-venv
          build/font-venv/bin/python -m pip install --disable-pip-version-check Pillow fonttools

      # Regeneration is the canonical check for source-parser/rasterizer changes too,
      # not only for changes to the raw source bundle.
      - name: Regenerate checked-in assembly assets
        run: |
          PY=build/font-venv/bin/python
          "$PY" tools/regenerate-font-assets.py \
            --package runtime/fonts/fonts.zip \
            --output-dir runtime/fonts/generated \
            --chunk-glyphs 512

      - name: Guard generated repository size
        run: |
          too_large="$(find runtime/fonts/generated -type f -size +90M -print)"
          if [[ -n "$too_large" ]]; then
            echo "Generated files above 90 MiB:" >&2
            echo "$too_large" >&2
            exit 1
          fi
          bytes="$(du -sb runtime/fonts/generated | cut -f1)"
          echo "Generated bytes: $bytes"
          if (( bytes > 314572800 )); then
            echo "Generated font assets exceed the 300 MiB repository guard." >&2
            exit 1
          fi
          git diff --check
          git status --short runtime/fonts/generated

      - name: Audit complete font catalog semantic parity and visual candidates
        run: |
          set -o pipefail
          PY=build/font-venv/bin/python
          mkdir -p build/font-audit
          "$PY" tools/audit-font-assets.py \
            --package runtime/fonts/fonts.zip \
            --generated-dir runtime/fonts/generated \
            --json build/font-audit/all-fonts.json \
            --html build/font-audit/visual-report.html \
            | tee build/font-audit/all-fonts.txt
          "$PY" tools/render-font-audit-cn.py \
            --package runtime/fonts/fonts.zip \
            --generated-dir runtime/fonts/generated \
            --audit-json build/font-audit/all-fonts.json \
            --html build/font-audit/font-review-cn.html
          {
            echo '### Complete font asset audit'
            echo '```text'
            cat build/font-audit/all-fonts.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload font audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: font-asset-audit
          path: build/font-audit/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit regenerated assets
        if: github.event_name == 'push'
        run: |
          git add -A runtime/fonts/generated
          if git diff --cached --quiet; then
            echo "Generated font assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate font assembly catalog"
          git fetch origin m7-fonts-gallery
          git rebase origin/m7-fonts-gallery
          git push origin HEAD:m7-fonts-gallery
