name: E2E / Font Gallery

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "runtime/core/font.c"
      - "runtime/fonts/generated/**"
      - "include/hpclang/font.h"
      - "include/hpclang/font-package.h"
      - "cmake/fonts.cmake"
      - "cmake/ui-text.cmake"
      - "tests/e2e/font-gallery/**"
      - "tests/e2e/targets/**"
      - "tests/e2e/fixtures/**"
      - "tests/e2e/harness/*gallery*"
      - "tests/e2e/harness/x50ng/stock-launcher-main.c"
      - "tests/e2e/harness/x50ng/stock-launcher-gated-main.c"
      - "tests/e2e/harness/x50ng/stock-return-phase.h"
      - "tests/e2e/harness/x50ng/lcd-quiescence.h"
      - "tests/e2e/sequences/*stock-gallery-run.seq"
      - "tests/e2e/specs/font-gallery.json"
      - "tests/e2e/specs/font-gallery-stock.json"
      - "tests/e2e/report.py"
      - "tests/e2e/harness/verify-hp39-native-font.py"
      - "tools/prepare-x50ng-gallery.py"
      - "tools/fetch-x50ng.sh"
      - "tools/wait-hp39-kermit-fetch.py"
      - "tools/run-hp39-kermit-server.sh"
      - "tools/run-hp48-kermit-send.sh"
      - "tools/hp48-kermit-watchdog.py"
      - "tools/package-hp39-aplet.sh"
      - "tools/bootstrap-hp39-aplet.sh"
      - "tools/prepare-hp39-aplet.py"
      - "tools/prepare-hp48gii-nor.py"
      - "tools/prepare-nor-fixture.py"
      - "tools/e2e-target-env.py"
      - "tools/merge-pgm-grid.py"
      - ".github/actions/setup-x50ng/**"
      - ".github/workflows/e2e-font-gallery.yml"
  pull_request:
    paths:
      - "runtime/core/font.c"
      - "runtime/fonts/generated/**"
      - "include/hpclang/font.h"
      - "include/hpclang/font-package.h"
      - "cmake/fonts.cmake"
      - "cmake/ui-text.cmake"
      - "tests/e2e/font-gallery/**"
      - "tests/e2e/targets/**"
      - "tests/e2e/fixtures/**"
      - "tests/e2e/harness/*gallery*"
      - "tests/e2e/harness/x50ng/stock-launcher-main.c"
      - "tests/e2e/harness/x50ng/stock-launcher-gated-main.c"
      - "tests/e2e/harness/x50ng/stock-return-phase.h"
      - "tests/e2e/harness/x50ng/lcd-quiescence.h"
      - "tests/e2e/sequences/*stock-gallery-run.seq"
      - "tests/e2e/specs/font-gallery.json"
      - "tests/e2e/specs/font-gallery-stock.json"
      - "tests/e2e/report.py"
      - "tests/e2e/harness/verify-hp39-native-font.py"
      - "tools/prepare-x50ng-gallery.py"
      - "tools/fetch-x50ng.sh"
      - "tools/wait-hp39-kermit-fetch.py"
      - "tools/run-hp39-kermit-server.sh"
      - "tools/run-hp48-kermit-send.sh"
      - "tools/hp48-kermit-watchdog.py"
      - "tools/package-hp39-aplet.sh"
      - "tools/bootstrap-hp39-aplet.sh"
      - "tools/prepare-hp39-aplet.py"
      - "tools/prepare-hp48gii-nor.py"
      - "tools/prepare-nor-fixture.py"
      - "tools/e2e-target-env.py"
      - "tools/merge-pgm-grid.py"
      - ".github/actions/setup-x50ng/**"
      - ".github/workflows/e2e-font-gallery.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Font Gallery
    runs-on: home-docker
    steps:
      - uses: actions/checkout@v7

      - name: Setup Arm Toolchain for Embedded
        uses: ./.github/actions/setup-atfe

      - name: Build exhaustive Direct and compact Stock Gallery payloads
        run: |
          set -o pipefail
          mkdir -p build
          chmod +x tools/build-e2e.sh
          {
            echo '=== exhaustive Direct Gallery ==='
            tools/build-e2e.sh font-gallery "$GITHUB_WORKSPACE/build/e2e-font-gallery-full"
            echo '=== compact Stock Gallery ==='
            tools/build-e2e.sh font-gallery-stock "$GITHUB_WORKSPACE/build/e2e-font-gallery-stock"
          } 2>&1 | tee build/e2e-font-gallery-build.log

      - name: Record Font Gallery sizes
        run: |
          "$ATFE/bin/llvm-size" -A build/e2e-font-gallery-full/e2e.elf \
            | tee build/e2e-font-gallery-full/e2e.size.txt
          "$ATFE/bin/llvm-size" -A build/e2e-font-gallery-stock/e2e.elf \
            | tee build/e2e-font-gallery-stock/e2e.size.txt

      - name: Upload Font Gallery build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-font-gallery-build-diagnostics
          retention-days: 1
          path: |
            build/e2e-font-gallery-build.log
            build/e2e-font-gallery-full/e2e.hpc
            build/e2e-font-gallery-full/e2e.elf
            build/e2e-font-gallery-full/e2e.result-address
            build/e2e-font-gallery-full/launchers/*.bin
            build/e2e-font-gallery-stock/e2e.hpc
            build/e2e-font-gallery-stock/e2e.elf
            build/e2e-font-gallery-stock/e2e.result-address
            build/e2e-font-gallery-stock/launchers/*.bin
            build/e2e-font-gallery-stock/launchers/*.hp
          if-no-files-found: warn

      - name: Upload exhaustive Direct Gallery build
        uses: actions/upload-artifact@v7
        with:
          name: e2e-font-gallery-build
          retention-days: 1
          path: |
            build/e2e-font-gallery-full/e2e.hpc
            build/e2e-font-gallery-full/e2e.elf
            build/e2e-font-gallery-full/e2e.size.txt
            build/e2e-font-gallery-full/e2e.result-address
            build/e2e-font-gallery-full/launchers/*.bin
          if-no-files-found: error

      - name: Upload compact Stock Gallery build
        uses: actions/upload-artifact@v7
        with:
          name: e2e-font-gallery-stock-build
          retention-days: 1
          path: |
            build/e2e-font-gallery-stock/e2e.hpc
            build/e2e-font-gallery-stock/e2e.elf
            build/e2e-font-gallery-stock/e2e.size.txt
            build/e2e-font-gallery-stock/e2e.result-address
            build/e2e-font-gallery-stock/launchers/*.bin
            build/e2e-font-gallery-stock/launchers/*.hp
          if-no-files-found: error

  x50ng:
    name: Prepare universal x50ng
    runs-on: home-docker
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore or build universal x50ng
        uses: ./.github/actions/setup-x50ng

      - name: Pack universal x50ng
        run: tar -C build/x50ng -czf build/x50ng-universal.tar.gz dist

      - name: Upload universal x50ng
        uses: actions/upload-artifact@v7
        with:
          name: x50ng-universal
          retention-days: 1
          path: build/x50ng-universal.tar.gz
          if-no-files-found: error

  gallery:
    name: Gallery / ${{ matrix.family }}
    needs: [build, x50ng]
    runs-on: home-docker
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        family: [hp39, hp48, hp4950]
    env:
      FAMILY: ${{ matrix.family }}

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Download exhaustive Direct Gallery build
        uses: actions/download-artifact@v7
        with:
          name: e2e-font-gallery-build
          path: build/e2e

      - name: Download universal x50ng
        uses: actions/download-artifact@v7
        with:
          name: x50ng-universal
          path: build

      - name: Unpack universal x50ng
        run: |
          mkdir -p build/x50ng
          tar -xzf build/x50ng-universal.tar.gz -C build/x50ng

      - name: Prepare platform runtime
        run: bash tests/e2e/harness/setup-runtime.sh direct "$FAMILY"

      - name: Browse and capture every Font Gallery family
        run: bash tests/e2e/harness/run-gallery-family.sh "$FAMILY" build/e2e

      - name: Generate Font Gallery evidence
        if: always()
        continue-on-error: true
        run: |
          targets_file="build/gallery-$FAMILY-targets.txt"
          [[ -f "$targets_file" ]] || exit 0

          while IFS= read -r TARGET; do
            [[ -n "$TARGET" ]] || continue
            export TARGET
            python3 tests/e2e/report.py tests/e2e/specs/font-gallery.json \
              --image-out "build/$TARGET-font-gallery-summary.png" \
              --image-only
          done < "$targets_file"

          while IFS= read -r TARGET; do
            [[ -n "$TARGET" ]] || continue
            export TARGET
            args=(tests/e2e/specs/font-gallery.json)
            if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
              args+=(--image-url "https://github.com/$GITHUB_REPOSITORY/blob/ci-evidence/font-gallery/$GITHUB_RUN_ID/$TARGET.png?raw=1")
            fi
            python3 tests/e2e/report.py "${args[@]}" >> "$GITHUB_STEP_SUMMARY"
          done < "$targets_file"

      - name: Upload Font Gallery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.family }}-font-gallery-e2e
          retention-days: 14
          path: |
            build/*-before.pgm
            build/*-before.pgm.png
            build/*-pass.pgm
            build/*-pass.pgm.png
            build/*-return.pgm
            build/*-return.pgm.png
            build/*-e2e.json
            build/*-font-gallery.pgm
            build/*-font-gallery.pgm.png
            build/*-font-gallery-summary.png
            build/*-font-gallery-frames/**
            build/gallery-${{ matrix.family }}-targets.txt
            build/e2e/e2e.hpc
            build/e2e/e2e.size.txt
          if-no-files-found: warn

  stock:
    name: Stock / ${{ matrix.target }}
    needs: [build, x50ng]
    runs-on: home-docker
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: hp39
            target: hp39gs
          - family: hp39
            target: hp40gs
          - family: hp48
            target: hp48gii
          - family: hp4950
            target: hp50g
    env:
      FAMILY: ${{ matrix.family }}
      TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v7

      - name: Download compact Stock Gallery build
        uses: actions/download-artifact@v7
        with:
          name: e2e-font-gallery-stock-build
          path: build/e2e

      - name: Download universal x50ng
        uses: actions/download-artifact@v7
        with:
          name: x50ng-universal
          path: build

      - name: Unpack universal x50ng
        run: |
          mkdir -p build/x50ng
          tar -xzf build/x50ng-universal.tar.gz -C build/x50ng

      - name: Restore hpcalc asset cache
        if: matrix.family == 'hp4950'
        uses: actions/cache@v6
        with:
          path: .cache/hpcalc
          key: hpclang-hpcalc-static-v1

      - name: Restore HPGCC39 asset cache
        if: matrix.family == 'hp39' || matrix.family == 'hp48'
        uses: actions/cache@v6
        with:
          path: .cache/hp39-aplet
          key: hpclang-hpgcc39-aplet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap-hp39-aplet.sh', 'tools/prepare-hp39-aplet.py') }}

      - name: Install HPGCC39 asset preparation dependency on cache miss
        if: matrix.family == 'hp39' || matrix.family == 'hp48'
        run: |
          if [[ ! -f .cache/hp39-aplet/sdk/.hpclang-prepared ]] && \
             ! command -v innoextract >/dev/null 2>&1; then
            sudo -E apt-get update -qq
            sudo -E apt-get install -y --no-install-recommends innoextract
          fi

      - name: Prepare ARMToolbox48 library
        if: matrix.family == 'hp48'
        run: |
          bash tools/bootstrap-hp39-aplet.sh >/dev/null
          mkdir -p build/assets
          cp .cache/hp39-aplet/raw/app/ARMToolbox/L275_48.LIB build/assets/L275_48
          sha256sum build/assets/L275_48

      - name: Prepare Stock platform runtime
        run: bash tests/e2e/harness/setup-runtime.sh stock "$FAMILY"

      - name: Launch Gallery through stock HP39/40 APLET path
        if: matrix.family == 'hp39'
        run: bash tests/e2e/harness/run-stock-gallery-hp39.sh "$TARGET" build/e2e

      - name: Launch Gallery through stock HP50g ARMToolbox
        if: matrix.family == 'hp4950'
        run: bash tests/e2e/harness/run-stock-gallery-hp50g.sh build/e2e

      - name: Launch Gallery through stock HP48gII ARMToolbox48
        if: matrix.family == 'hp48'
        run: bash tests/e2e/harness/run-stock-gallery-hp48gii.sh build/e2e build/assets

      - name: Validate HP48 live native-font evidence
        if: matrix.family == 'hp48'
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          build = Path('build')
          frames = [
              build / 'hp48gii-stock-gallery-native-mini.pgm',
              build / 'hp48gii-stock-gallery-native-main.pgm',
              build / 'hp48gii-stock-gallery-generated-control.pgm',
          ]
          digests = []
          for path in frames:
              data = path.read_bytes()
              try:
                  magic, geometry, maxval, pixels = data.split(b'\n', 3)
              except ValueError as exc:
                  raise SystemExit(f'{path}: malformed PGM') from exc
              if magic != b'P5' or maxval != b'255':
                  raise SystemExit(f'{path}: unexpected PGM header')
              width, height = map(int, geometry.split())
              pixels = pixels[: width * height]
              if len(pixels) != width * height:
                  raise SystemExit(f'{path}: truncated PGM')
              if not any(pixel != 255 for pixel in pixels):
                  raise SystemExit(f'{path}: blank capture')
              digests.append(hashlib.sha256(data).hexdigest())
          if len(set(digests)) != len(digests):
              raise SystemExit('HP48 Stock Gallery mini/main/control captures are not distinct')

          state = json.loads((build / 'hp48gii-stock-gallery.json').read_text())
          if not state.get('saw_pass'):
              raise SystemExit(f'HP48 Stock Gallery did not reach HPC1 PASS: {state}')
          if state.get('status') != 'pass':
              raise SystemExit(f'HP48 Stock Gallery did not reach settled PASS: {state}')
          if not state.get('returned') or not state.get('return_settled'):
              raise SystemExit(f'HP48 Stock Gallery did not settle after return: {state}')
          print('PASS HP48 live-native evidence: mini/main/control distinct; settled Stock return observed')
          PY

      - name: Generate Stock Font Gallery evidence
        if: always()
        continue-on-error: true
        run: |
          [[ -f "build/$TARGET-font-gallery.pgm" ]] || exit 0
          python3 tests/e2e/report.py tests/e2e/specs/font-gallery-stock.json \
            --image-out "build/$TARGET-stock-font-gallery-summary.png" \
            --image-only

          args=(tests/e2e/specs/font-gallery-stock.json)
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            args+=(--image-url "https://github.com/$GITHUB_REPOSITORY/blob/ci-evidence/stock-font-gallery/$GITHUB_RUN_ID/$TARGET.png?raw=1")
          fi
          python3 tests/e2e/report.py "${args[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Stock Font Gallery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-stock-font-gallery-e2e
          retention-days: 14
          path: |
            build/${{ matrix.target }}-before.pgm
            build/${{ matrix.target }}-before.pgm.png
            build/${{ matrix.target }}-pass.pgm
            build/${{ matrix.target }}-pass.pgm.png
            build/${{ matrix.target }}-return.pgm
            build/${{ matrix.target }}-return.pgm.png
            build/${{ matrix.target }}-e2e.json
            build/${{ matrix.target }}-font-gallery.pgm
            build/${{ matrix.target }}-font-gallery.pgm.png
            build/${{ matrix.target }}-stock-font-gallery-summary.png
            build/${{ matrix.target }}-stock-gallery-*.pgm
            build/${{ matrix.target }}-stock-gallery-*.pgm.png
            build/${{ matrix.target }}-stock-gallery*.json
            build/${{ matrix.target }}-stock-gallery-kermit*
            build/${{ matrix.target }}-stock-gallery-socat.log
            build/e2e/e2e.hpc
            build/e2e/e2e.size.txt
          if-no-files-found: warn

  publish-evidence:
    name: Publish ci-evidence
    if: always() && !cancelled() && github.event_name != 'pull_request'
    needs: [gallery, stock]
    runs-on: home-docker
    concurrency:
      group: ci-evidence-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Gallery evidence artifacts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: "*-font-gallery-e2e"
          path: build/publish

      - name: Stage Gallery ci-evidence tree
        run: |
          set -euo pipefail
          mkdir -p build/publish
          direct_out="build/ci-evidence/font-gallery/$GITHUB_RUN_ID"
          stock_out="build/ci-evidence/stock-font-gallery/$GITHUB_RUN_ID"
          mkdir -p "$direct_out" "$stock_out"

          find build/publish -type f -name '*-font-gallery-summary.png' -print0 \
            | while IFS= read -r -d '' image; do
                base="$(basename "$image")"
                case "$base" in
                  *-stock-font-gallery-summary.png) continue ;;
                esac
                target="${base%-font-gallery-summary.png}"
                cp "$image" "$direct_out/$target.png"
              done

          find build/publish -type f -name '*-stock-font-gallery-summary.png' -print0 \
            | while IFS= read -r -d '' image; do
                base="$(basename "$image")"
                target="${base%-stock-font-gallery-summary.png}"
                cp "$image" "$stock_out/$target.png"
              done

      - name: Publish Gallery ci-evidence in one commit
        continue-on-error: true
        run: |
          chmod +x tools/publish-ci-evidence.sh
          tools/publish-ci-evidence.sh build/ci-evidence
