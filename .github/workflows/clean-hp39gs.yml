name: Clean hp39gs

on:
  push:
    paths:
      - "runtime/hp39gs/**"
      - "tests/hp39gs-clean-smoke.c"
      - "tools/probe-clean-hp39gs.sh"
      - "tools/elf2l3.py"
      - "cmake/profiles/hp39gs-clean.cmake"
      - ".github/workflows/clean-hp39gs.yml"
  pull_request:
    paths:
      - "runtime/hp39gs/**"
      - "tests/hp39gs-clean-smoke.c"
      - "tools/probe-clean-hp39gs.sh"
      - "tools/elf2l3.py"
      - "cmake/profiles/hp39gs-clean.cmake"
      - ".github/workflows/clean-hp39gs.yml"

jobs:
  clean-arm-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld llvm

      - name: Build clean hp39gs ELF
        env:
          CC: clang
          LD: ld.lld
          READELF: llvm-readelf
          OBJDUMP: llvm-objdump
        run: |
          chmod +x tools/probe-clean-hp39gs.sh tools/elf2l3.py
          tools/probe-clean-hp39gs.sh

      - name: Pack Launcher V3 transfer string
        run: |
          python3 tools/elf2l3.py \
            build/clean-hp39gs-probe/hp39gs-clean.elf \
            build/clean-hp39gs-probe/hp39gs-clean.hp

          python3 - <<'PY'
          import struct
          from pathlib import Path

          p = Path("build/clean-hp39gs-probe/hp39gs-clean.hp").read_bytes()
          assert p[:8] == b"HPHP49-C"
          assert p[13:20] == b"\x4c\xb3\x80A>CP"
          assert p[-4:] == struct.pack("<I", 0x3176B34C)
          print(f"PASS: clean HP transfer string, {len(p)} bytes")
          PY
