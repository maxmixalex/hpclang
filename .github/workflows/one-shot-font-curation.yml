name: Maintenance / One-shot font curation

permissions:
  contents: write

on:
  push:
    branches:
      - m7-fonts-gallery
    paths:
      - ".github/workflows/one-shot-font-curation.yml"

jobs:
  curate:
    runs-on: home-docker
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Prepare Python environment
        run: |
          python3 -m venv build/font-venv
          build/font-venv/bin/python -m pip install --disable-pip-version-check Pillow fonttools

      - name: Remove approved font assets from the canonical package
        run: |
          build/font-venv/bin/python - <<'PY'
          import importlib.util
          import os
          import sys
          import zipfile
          from pathlib import Path

          tool_path = Path("tools/hpclang-font.py")
          spec = importlib.util.spec_from_file_location("hpclang_font_curation", tool_path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          hf = module

          package_path = Path("runtime/fonts/fonts.zip")
          package = hf.Package(package_path)
          rows = hf.catalog(package)
          before = len(rows)

          dina_names = {"DinaT437.fon", "DinaT850.fon"}
          dina_paths = {row["path"] for row in rows if Path(row["path"]).name in dina_names}
          power_paths = {
              row["path"] for row in rows
              if row.get("family") == "tamzen" and "powerline" in row["selector"].lower()
          }

          quick = "Quick"
          oversize_paths = set()
          oversize_selectors = []
          for row in rows:
              font = hf.load_selected(package, row["selector"], "FULL")
              if not all(ord(ch) in font.glyphs for ch in quick):
                  continue
              width = sum(font.glyphs[ord(ch)].advance for ch in quick)
              if width > 131:
                  oversize_paths.add(row["path"])
                  oversize_selectors.append((row["selector"], width))

          def impacted(paths):
              return [row for row in rows if row["path"] in paths]

          dina_faces = impacted(dina_paths)
          power_faces = impacted(power_paths)
          oversize_faces = impacted(oversize_paths)

          assert len(dina_paths) == 2, sorted(dina_paths)
          assert len(dina_faces) == 6, [row["selector"] for row in dina_faces]
          assert len(power_paths) == 21, sorted(power_paths)
          assert len(power_faces) == 21, [row["selector"] for row in power_faces]
          assert len(oversize_paths) == 6, sorted(oversize_paths)
          assert len(oversize_faces) == 6, oversize_selectors
          assert not (dina_paths & power_paths or dina_paths & oversize_paths or power_paths & oversize_paths)

          remove_paths = dina_paths | power_paths | oversize_paths
          expected_removed_faces = 33
          assert len(impacted(remove_paths)) == expected_removed_faces

          print("Dina OEM sources:")
          for path in sorted(dina_paths): print("  -", path)
          print("Powerline sources:")
          for path in sorted(power_paths): print("  -", path)
          print("Oversized sources:")
          for selector, width in sorted(oversize_selectors): print(f"  - {selector}: Quick={width}px")

          tmp = package_path.with_suffix(".zip.tmp")
          removed_archive_names = []
          with zipfile.ZipFile(package_path, "r") as zin, zipfile.ZipFile(tmp, "w") as zout:
              wanted = {"fonts/" + path.replace("\\", "/") for path in remove_paths}
              for info in zin.infolist():
                  if info.filename in wanted:
                      removed_archive_names.append(info.filename)
                      continue
                  zout.writestr(info, zin.read(info.filename))
          assert set(removed_archive_names) == {"fonts/" + path.replace("\\", "/") for path in remove_paths}
          os.replace(tmp, package_path)

          after_package = hf.Package(package_path)
          after_rows = hf.catalog(after_package)
          assert len(after_rows) == before - expected_removed_faces, (before, len(after_rows))
          assert len(after_rows) == 275, len(after_rows)
          assert not any(Path(row["path"]).name in dina_names for row in after_rows)
          assert not any(row.get("family") == "tamzen" and "powerline" in row["selector"].lower() for row in after_rows)

          remaining_oversize = []
          for row in after_rows:
              font = hf.load_selected(after_package, row["selector"], "FULL")
              if all(ord(ch) in font.glyphs for ch in quick):
                  width = sum(font.glyphs[ord(ch)].advance for ch in quick)
                  if width > 131:
                      remaining_oversize.append((row["selector"], width))
          assert not remaining_oversize, remaining_oversize
          print(f"faces: {before} -> {len(after_rows)}")
          PY

      - name: Make Ark Pixel Gallery face names explicit
        run: |
          build/font-venv/bin/python - <<'PY'
          from pathlib import Path

          path = Path("tests/e2e/font-gallery/CMakeLists.txt")
          text = path.read_text(encoding="utf-8")
          needle = '''    if(face_prefix_actual STREQUAL face_prefix)\n        string(SUBSTRING "${face_label}" ${face_prefix_len} -1 face_label)\n    endif()\n\n    string(REPLACE "\\\\" "\\\\\\\\" family_label_c "${family_label}")\n'''
          replacement = '''    if(face_prefix_actual STREQUAL face_prefix)\n        string(SUBSTRING "${face_label}" ${face_prefix_len} -1 face_label)\n    endif()\n\n    # Ark Pixel ships seven locale-specific glyph designs at every size/mode.\n    # Keep the runtime strings ASCII-only for the calculator chrome, but make\n    # size, width mode, and region visible before the label can be clipped.\n    if(font_id MATCHES "^ark_pixel_ark_pixel_(10|12|16)px_(monospaced|proportional)_(ja|ko|latin|zh_cn|zh_hk|zh_tr|zh_tw)$")\n        set(ark_size "${CMAKE_MATCH_1}")\n        set(ark_mode "${CMAKE_MATCH_2}")\n        set(ark_locale "${CMAKE_MATCH_3}")\n        if(ark_mode STREQUAL "monospaced")\n            set(ark_mode_label "Mono")\n        else()\n            set(ark_mode_label "Prop")\n        endif()\n        if(ark_locale STREQUAL "ja")\n            set(ark_locale_label "Japanese")\n        elseif(ark_locale STREQUAL "ko")\n            set(ark_locale_label "Korean")\n        elseif(ark_locale STREQUAL "latin")\n            set(ark_locale_label "Latin")\n        elseif(ark_locale STREQUAL "zh_cn")\n            set(ark_locale_label "CN Mainland")\n        elseif(ark_locale STREQUAL "zh_hk")\n            set(ark_locale_label "HK")\n        elseif(ark_locale STREQUAL "zh_tw")\n            set(ark_locale_label "TW")\n        else()\n            set(ark_locale_label "Traditional")\n        endif()\n        set(family_label "Ark Pixel")\n        set(face_label "${ark_size}px ${ark_mode_label} ${ark_locale_label}")\n    endif()\n\n    string(REPLACE "\\\\" "\\\\\\\\" family_label_c "${family_label}")\n'''
          count = text.count(needle)
          assert count == 1, f"Gallery label insertion point changed: matches={count}"
          path.write_text(text.replace(needle, replacement), encoding="utf-8")
          PY

      - name: Regenerate and audit final catalog
        run: |
          set -o pipefail
          PY=build/font-venv/bin/python
          "$PY" tools/regenerate-font-assets.py \
            --package runtime/fonts/fonts.zip \
            --output-dir runtime/fonts/generated \
            --chunk-glyphs 512
          mkdir -p build/font-audit
          "$PY" tools/audit-font-assets.py \
            --package runtime/fonts/fonts.zip \
            --generated-dir runtime/fonts/generated \
            --json build/font-audit/all-fonts.json \
            --html build/font-audit/visual-report.html \
            | tee build/font-audit/all-fonts.txt
          "$PY" tools/render-font-audit-cn.py \
            --package runtime/fonts/fonts.zip \
            --generated-dir runtime/fonts/generated \
            --audit-json build/font-audit/all-fonts.json \
            --html build/font-audit/font-review-cn.html
          "$PY" - <<'PY'
          import json
          report = json.load(open("build/font-audit/all-fonts.json", encoding="utf-8"))
          assert report["face_count"] == 275, report["face_count"]
          assert report["generated_parity"] == {"passed": 275, "failed": 0}, report["generated_parity"]
          summary = report["visual_summary"]
          assert summary["quick_overflow"] == 0, summary
          assert summary["powerline_variant"] == 0, summary
          assert summary["glyph_collapse"] == 0, summary
          assert len(report["exact_duplicate_groups"]) == 0, report["exact_duplicate_groups"]
          print("final policy gates:", summary)
          PY
          git diff --check

      - name: Upload final review report
        uses: actions/upload-artifact@v7
        with:
          name: font-asset-audit-curated
          path: build/font-audit/
          if-no-files-found: error
          retention-days: 14

      - name: Commit curated source and generated catalog
        run: |
          rm .github/workflows/one-shot-font-curation.yml
          git add -A
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fonts: prune OEM, Powerline, and oversized faces"
          git fetch origin m7-fonts-gallery
          git rebase origin/m7-fonts-gallery
          git push origin HEAD:m7-fonts-gallery
