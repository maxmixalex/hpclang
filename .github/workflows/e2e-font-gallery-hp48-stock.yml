name: E2E / Font Gallery HP50 Stock

permissions:
  contents: read

on:
  push:
    branches:
      - m7-fonts-gallery
    paths:
      - ".github/workflows/e2e-font-gallery-hp48-stock.yml"
      - "tests/e2e/harness/run-stock-gallery-hp50g.sh"
      - "tests/e2e/sequences/hp50g-stock-gallery-run.seq"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build compact Stock Gallery
    runs-on: home-docker
    steps:
      - uses: actions/checkout@v7

      - name: Setup Arm Toolchain for Embedded
        uses: ./.github/actions/setup-atfe

      - name: Build compact Stock Gallery payload
        run: |
          chmod +x tools/build-e2e.sh
          tools/build-e2e.sh font-gallery-stock "$GITHUB_WORKSPACE/build/e2e-font-gallery-stock"

      - name: Upload compact Stock Gallery build
        uses: actions/upload-artifact@v7
        with:
          name: e2e-font-gallery-stock-build
          retention-days: 1
          path: |
            build/e2e-font-gallery-stock/e2e.hpc
            build/e2e-font-gallery-stock/e2e.elf
            build/e2e-font-gallery-stock/e2e.result-address
            build/e2e-font-gallery-stock/launchers/*.bin
            build/e2e-font-gallery-stock/launchers/*.hp
          if-no-files-found: error

  x50ng:
    name: Prepare universal x50ng
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore or build universal x50ng
        uses: ./.github/actions/setup-x50ng

      - name: Pack universal x50ng
        run: tar -C build/x50ng -czf build/x50ng-universal.tar.gz dist

      - name: Upload universal x50ng
        uses: actions/upload-artifact@v7
        with:
          name: x50ng-universal
          retention-days: 1
          path: build/x50ng-universal.tar.gz
          if-no-files-found: error

  stock-gallery-hp50g:
    name: Stock Gallery / hp50g
    needs: [build, x50ng]
    runs-on: home-docker
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - name: Download compact Stock Gallery build
        uses: actions/download-artifact@v7
        with:
          name: e2e-font-gallery-stock-build
          path: build/e2e

      - name: Download universal x50ng
        uses: actions/download-artifact@v7
        with:
          name: x50ng-universal
          path: build

      - name: Unpack universal x50ng
        run: |
          mkdir -p build/x50ng
          tar -xzf build/x50ng-universal.tar.gz -C build/x50ng

      - name: Restore hpcalc asset cache
        uses: actions/cache@v6
        with:
          path: .cache/hpcalc
          key: hpclang-hpcalc-static-v1

      - name: Prepare Stock platform runtime
        run: bash tests/e2e/harness/setup-runtime.sh stock hp4950

      - name: Launch Gallery through stock HP50g ARMToolbox
        run: bash tests/e2e/harness/run-stock-gallery-hp50g.sh build/e2e

      - name: Upload HP50 Stock Font Gallery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hp50g-stock-font-gallery-e2e
          retention-days: 14
          path: |
            build/hp50g-before.pgm
            build/hp50g-before.pgm.png
            build/hp50g-pass.pgm
            build/hp50g-pass.pgm.png
            build/hp50g-return.pgm
            build/hp50g-return.pgm.png
            build/hp50g-e2e.json
            build/hp50g-font-gallery.pgm
            build/hp50g-font-gallery.pgm.png
            build/hp50g-stock-gallery-*.pgm
            build/hp50g-stock-gallery-*.pgm.png
            build/hp50g-stock-gallery*.json
            build/e2e/e2e.hpc
            build/e2e/e2e.elf
          if-no-files-found: warn
