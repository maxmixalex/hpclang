name: Probe / HP48gII firmware mirror

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-hp48-firmware.yml"

jobs:
  probe:
    runs-on: home-docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Inspect mirror
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://blog.lyc8503.net/en/post/hp39gs-modify/48gii.bin -o /tmp/48gii.bin
          stat -c 'size=%s' /tmp/48gii.bin
          sha256sum /tmp/48gii.bin
          printf 'head64=' && head -c 64 /tmp/48gii.bin | xxd -p -c 64
          printf 'tail64=' && tail -c 64 /tmp/48gii.bin | xxd -p -c 64
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/48gii.bin').read_bytes()
          print('size_hex=0x%x' % len(p))
          for marker in (b'KINPOUPDATEIMAGE', b'KINPOHP48GIIMAGE', b'Kinposhcopyright'):
              hits=[]; start=0
              while True:
                  i=p.find(marker,start)
                  if i<0: break
                  hits.append('0x%x'%i); start=i+1
              print(marker.decode()+ '=' + ','.join(hits))
          for off in (0,0x4000,0x40100,0x60000,0x1ffff0):
              if off < len(p): print('off_%x='%off + p[off:off+32].hex())
          PY
