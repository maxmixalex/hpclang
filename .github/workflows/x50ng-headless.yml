name: x50ng headless ARM E2E

on:
  push:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "tests/hp39-visible-smoke.c"
      - "tests/hp39-runtime-diag.c"
      - "tests/x50ng/e2e-main.c"
      - "tests/x50ng/headless-ui-init.h"
      - "tools/probe-atfe.sh"
      - "tools/hpclang-pack.py"
      - "tools/pgm-to-png.py"
      - "tools/pgm-to-summary.py"
      - ".github/workflows/x50ng-headless.yml"
  pull_request:
    paths:
      - "runtime/core/**"
      - "runtime/libc/**"
      - "runtime/bootstrap/**"
      - "platform/armtoolbox/**"
      - "include/hpclang/**"
      - "tests/hp39-visible-smoke.c"
      - "tests/hp39-runtime-diag.c"
      - "tests/x50ng/e2e-main.c"
      - "tests/x50ng/headless-ui-init.h"
      - "tools/probe-atfe.sh"
      - "tools/hpclang-pack.py"
      - "tools/pgm-to-png.py"
      - ".github/workflows/x50ng-headless.yml"
  workflow_dispatch:

jobs:
  arm-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git pkg-config wget unzip curl xz-utils \
            libglib2.0-dev libgtk-4-dev libncurses-dev liblua5.4-dev

      - name: Install Arm Toolchain for Embedded 22.1.0
        run: |
          curl -L \
            https://github.com/arm/arm-toolchain/releases/download/release-22.1.0-ATfE/ATfE-22.1.0-Linux-x86_64.tar.xz \
            -o /tmp/atfe.tar.xz
          mkdir -p /tmp/atfe
          tar -xJf /tmp/atfe.tar.xz -C /tmp/atfe --strip-components=1

      - name: Build canonical HPC1 and HP50g stage0
        run: |
          export ATFE=/tmp/atfe
          export OUT="$GITHUB_WORKSPACE/build/x50ng-e2e"
          chmod +x tools/probe-atfe.sh tools/hpclang-pack.py
          tools/probe-atfe.sh

          /tmp/atfe/bin/clang \
            --target=arm-none-eabi -march=armv4t -marm \
            -DHPCLANG_STAGE0_MODEL=6 \
            -c platform/armtoolbox/stage0.S \
            -o build/x50ng-e2e/stage0-hp50g.o

          /tmp/atfe/bin/ld.lld -m armelf \
            -T platform/armtoolbox/stage0.ld \
            build/x50ng-e2e/stage0-hp50g.o \
            build/x50ng-e2e/stage0-bundle.o \
            -o build/x50ng-e2e/stage0-hp50g.elf

          /tmp/atfe/bin/llvm-objcopy -O binary \
            build/x50ng-e2e/stage0-hp50g.elf \
            build/x50ng-e2e/stage0-hp50g.bin

      - name: Fetch pinned x50ng
        run: |
          git clone --no-checkout \
            https://codeberg.org/gwh/x50ng.git build/x50ng
          git -C build/x50ng checkout \
            003533d9eca3f6ded36c6ab80b8dbc0563e31d9a
          git -C build/x50ng submodule update --init --recursive
          git -C build/x50ng rev-parse HEAD | tee build/x50ng-source.txt

      - name: Install E2E frontend and reserve RAM before QEMU bookkeeping
        run: |
          cp tests/x50ng/e2e-main.c build/x50ng/src/main.c
          cp tests/x50ng/headless-ui-init.h build/x50ng/src/
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build/x50ng/src/module.c")
          s = p.read_text()
          needle = "    phys_ram_base = mmap( 0, phys_ram_size, PROT_NONE,"
          if needle not in s:
              raise SystemExit("x50ng init_modules layout changed")
          insert = (
              "    /* hpclang E2E reserved RAM. */\n"
              "    phys_ram_size += 0x00100000;\n\n"
          )
          p.write_text(s.replace(needle, insert + needle, 1))
          PY

      - name: Build x50ng
        working-directory: build/x50ng
        run: |
          make -j2 WITH_SDL=no WITH_SDL2=no LUA_VERSION=lua5.4

      - name: Fetch official 49g+/50g firmware
        working-directory: build/x50ng
        run: |
          make -C dist/firmware bootloaders official

      - name: Execute canonical HPC1
        shell: bash
        run: |
          export HPCLANG_X50NG_STAGE0="$GITHUB_WORKSPACE/build/x50ng-e2e/stage0-hp50g.bin"
          export HPCLANG_X50NG_RESULT_ADDR="$(cat "$GITHUB_WORKSPACE/build/x50ng-e2e/hp39-visible.result-address")"
          export HPCLANG_X50NG_BEFORE_PGM="$GITHUB_WORKSPACE/build/x50ng-before.pgm"
          export HPCLANG_X50NG_PASS_PGM="$GITHUB_WORKSPACE/build/x50ng-hpc1-pass.pgm"
          export HPCLANG_X50NG_RETURN_PGM="$GITHUB_WORKSPACE/build/x50ng-returned-home.pgm"
          export HPCLANG_X50NG_E2E_JSON="$GITHUB_WORKSPACE/build/x50ng-e2e.json"

          mkdir -p build/x50ng-state
          set +e
          timeout 35s build/x50ng/dist/x50ng \
            --datadir="$GITHUB_WORKSPACE/build/x50ng-state" \
            --overwrite-config \
            --style="$GITHUB_WORKSPACE/build/x50ng/dist/style-50g.css" \
            --flash \
            --bootloader="$GITHUB_WORKSPACE/build/x50ng/dist/firmware/boot-50g.bin" \
            --firmware="$GITHUB_WORKSPACE/build/x50ng/dist/firmware/hp4950v215/2MB_FIX/2MB_215f.bin"
          status=$?
          set -e

          for image in x50ng-before x50ng-hpc1-pass x50ng-returned-home
          do
            if [ -f "build/$image.pgm" ]; then
              python tools/pgm-to-png.py "build/$image.pgm" "build/$image.png"
            fi
          done

          test ! -f build/x50ng-e2e.json || cat build/x50ng-e2e.json
          exit "$status"

      - name: Add LCD evidence to job summary
        if: always()
        run: |
          python tools/pgm-to-summary.py \
            --heading "HP50g normalized ARM E2E" \
            --json build/x50ng-e2e.json \
            build/x50ng-before.pgm \
            build/x50ng-hpc1-pass.pgm \
            build/x50ng-returned-home.pgm \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x50ng-headless-arm-e2e
          path: |
            build/x50ng-before.*
            build/x50ng-hpc1-pass.*
            build/x50ng-returned-home.*
            build/x50ng-e2e.json
            build/x50ng-source.txt
            build/x50ng-e2e/hp39-visible.hpc
            build/x50ng-e2e/hp39-visible.result-address
            build/x50ng-e2e/stage0-hp50g.bin
          if-no-files-found: warn
