name: Setup ATfE
description: Install the pinned Arm Toolchain for Embedded for this ephemeral runner.

inputs:
  version:
    description: Arm Toolchain for Embedded version
    required: false
    default: "22.1.0"

runs:
  using: composite
  steps:
    - name: Download ATfE
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        DEST: ${{ runner.temp }}/atfe-${{ inputs.version }}
      run: |
        set -euo pipefail
        case "${RUNNER_ARCH:-}" in
          X64|x64|"") ;;
          *)
            echo "ATfE setup supports x86_64 runners; got ${RUNNER_ARCH:-unknown}" >&2
            exit 2
            ;;
        esac

        if [ ! -x "$DEST/bin/clang" ]; then
          tmp="$(mktemp --suffix=.tar.xz)"
          trap 'rm -f "$tmp"' EXIT
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/arm/arm-toolchain/releases/download/release-${VERSION}-ATfE/ATfE-${VERSION}-Linux-x86_64.tar.xz" \
            -o "$tmp"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          tar -xJf "$tmp" -C "$DEST" --strip-components=1
        fi

        test -x "$DEST/bin/clang"
        test -x "$DEST/bin/ld.lld"
        printf 'ATFE=%s\n' "$DEST" >> "$GITHUB_ENV"
