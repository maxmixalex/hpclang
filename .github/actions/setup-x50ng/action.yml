name: Setup universal x50ng
description: Restore or build the single pinned x50ng binary used by all hpclang E2E modes and families.

runs:
  using: composite
  steps:
    - name: Restore universal x50ng cache
      id: x50ng-cache
      uses: actions/cache/restore@v6
      with:
        path: build/x50ng/dist
        key: hpclang-x50ng-universal-${{ runner.os }}-${{ runner.arch }}-v2-${{ hashFiles('.github/actions/setup-x50ng/action.yml', 'tools/prepare-x50ng.py', 'tools/fetch-x50ng.sh', 'tests/e2e/harness/x50ng/**') }}

    - name: Install x50ng build dependencies on cache miss
      if: steps.x50ng-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        packages=(git-lfs libglib2.0-dev liblua5.4-dev)
        missing=()
        for package in "${packages[@]}"; do
          dpkg-query -W -f='${Status}' "$package" 2>/dev/null |
            grep -q 'ok installed' || missing+=("$package")
        done
        if (( ${#missing[@]} )); then
          sudo -E apt-get update -qq
          sudo -E apt-get install -y --no-install-recommends "${missing[@]}"
        fi

    - name: Fetch and adapt pinned x50ng
      if: steps.x50ng-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash tools/fetch-x50ng.sh build/x50ng

    - name: Build universal headless x50ng
      if: steps.x50ng-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: build/x50ng
      run: |
        make -j2 \
          WITH_GTK=no \
          WITH_NCURSES=no \
          WITH_SDL=no \
          WITH_SDL2=no \
          LUA_VERSION=lua5.4

    - name: Verify universal x50ng runtime dependencies
      if: steps.x50ng-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: build/x50ng
      run: |
        ldd dist/x50ng | tee dist/x50ng.ldd
        if grep -E 'libgtk|libncurses|libtinfo' dist/x50ng.ldd; then
          echo "universal E2E x50ng unexpectedly links a GUI/TUI backend" >&2
          exit 1
        fi

    - name: Prepare reusable firmware
      if: steps.x50ng-cache.outputs.cache-hit != 'true'
      shell: bash
      run: make -C build/x50ng/dist/firmware bootloaders official

    - name: Save universal x50ng cache
      if: steps.x50ng-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: build/x50ng/dist
        key: ${{ steps.x50ng-cache.outputs.cache-primary-key }}